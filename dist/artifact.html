      ctx.textAlign = 'left'; ctx.font = 'bold 11px monospace';
      ctx.fillStyle = `rgba(255,230,120,${0.6 + Math.sin(g._time * 8) * 0.4})`;
      ctx.fillText('[R] AWAKEN', bx + 18, by + bh / 2 + 4);
    }
  }

  _combo(ctx, g, W, H) {
    if (g.combo < 2) return;
    const a = clamp(g.comboTimer / 2, 0, 1);
    ctx.globalAlpha = 0.5 + a * 0.5;
    ctx.textAlign = 'center';
    const s = 20 + Math.min(g.combo, 30) * 0.6;
    ctx.font = `bold ${s}px monospace`;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(g.combo + ' HIT', W / 2 + 2, 96 + 2);
    ctx.fillStyle = g.combo >= 10 ? '#ff7a3a' : '#ffe27a';
    ctx.fillText(g.combo + ' HIT', W / 2, 96);
    ctx.globalAlpha = 1;
  }

  _boss(ctx, g, W) {
    // (per-boss health bar is drawn in world space by the boss itself)
  }

  _panel(ctx, x, y, w, h, r) {
    r = r || 6;
    ctx.fillStyle = 'rgba(20,26,34,0.55)';
    roundRect(ctx, x, y, w, h, r); ctx.fill();
    ctx.strokeStyle = 'rgba(120,180,200,0.25)'; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, r); ctx.stroke();
  }

  _hearts(ctx, p, x, y) {
    const per = 10, size = 15;
    for (let i = 0; i < p.maxHearts; i++) {
      const frac = clamp(p.health - i, 0, 1);
      const hx = x + (i % per) * (size + 2);
      const hy = y + Math.floor(i / per) * (size + 2);
      drawHeartHUD(ctx, hx, hy, size, frac);
    }
  }

  _stamina(ctx, p, W, H) {
    if (p.stamina >= p.maxStamina - 0.001 && !p.staminaLock) return; // hide when full
    // wheel near player? draw a fixed gauge under hearts for clarity
    const cx = 24, cy = 16 + Math.ceil(p.maxHearts / 10) * 17 + 18, r = 12;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(cx, cy, r, -HALF_PI, -HALF_PI + TAU); ctx.stroke();
    const frac = clamp(p.stamina / p.maxStamina, 0, 1);
    ctx.strokeStyle = p.staminaLock ? '#e8a030' : '#7bd24a';
    ctx.beginPath(); ctx.arc(cx, cy, r, -HALF_PI, -HALF_PI + TAU * frac); ctx.stroke();
  }

  _topRight(ctx, g, p, W) {
    const x = W - 190, y = 14;
    this._panel(ctx, x, y, 176, 60, 8);
    ctx.font = '12px monospace'; ctx.textAlign = 'left';
    // clock
    const dn = g.dayNight;
    ctx.fillStyle = '#dfe8ee';
    ctx.fillText(`${dn.phase}  Day ${dn.day}`, x + 12, y + 20);
    ctx.fillStyle = '#9fb8c8';
    ctx.fillText(formatClock(dn.time), x + 12, y + 36);
    // resources
    ctx.textAlign = 'right';
    const icoR = g.sprites.icon.rupeeGreen, icoK = g.sprites.icon.korok, icoA = g.sprites.icon.arrow;
    if (icoR) ctx.drawImage(icoR, x + 96, y + 8, 14, 14);
    ctx.fillStyle = '#a6f0b8'; ctx.fillText(String(p.rupees), x + 130, y + 20);
    if (icoK) ctx.drawImage(icoK, x + 136, y + 8, 14, 14);
    ctx.fillStyle = '#bfe6a0'; ctx.fillText(String(p.koroks), x + 168, y + 20);
    if (icoA) ctx.drawImage(icoA, x + 96, y + 26, 14, 14);
    ctx.fillStyle = '#e0d0a0'; ctx.fillText(String(p.arrows), x + 130, y + 38);
    ctx.fillStyle = '#8fd0f0'; ctx.textAlign = 'left';
    ctx.fillText(`Shrines ${p.shrines}`, x + 12, y + 52);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#c8b0e0';
    ctx.fillText(`Towers ${p.towersFound}/${g.world.structures.towers.length}`, x + 168, y + 52);
  }

  _weapon(ctx, g, p, x, y) {
    this._panel(ctx, x, y, 150, 44, 8);
    const w = p.weapon;
    const icon = g.sprites.icon[w.icon];
    if (icon) ctx.drawImage(icon, x + 8, y + 12, 22, 22);
    ctx.font = '11px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#e8eef2';
    ctx.fillText(w.name.length > 14 ? w.name.slice(0, 13) + '…' : w.name, x + 36, y + 18);
    ctx.fillStyle = '#9fb8c8'; ctx.fillText('ATK ' + w.dmg, x + 36, y + 33);
    // durability bar
    if (isFinite(w.maxDur)) {
      const bw = 100, bx = x + 36, by = y + 36;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, 3);
      const frac = clamp(w.dur / w.maxDur, 0, 1);
      ctx.fillStyle = frac > 0.4 ? '#7bd24a' : (frac > 0.18 ? '#e8c23a' : '#e0483a');
      ctx.fillRect(bx, by, bw * frac, 3);
    }
    // weapon count / cycle hint (on the ATK line, right-aligned, so it never
    // collides with the weapon name above it)
    if (p.weapons.length > 1) { ctx.fillStyle = '#7f98a8'; ctx.textAlign = 'right'; ctx.fillText(`[Q] ${p.wi + 1}/${p.weapons.length}`, x + 144, y + 33); }
  }

  _temperature(ctx, g, p, W, H) {
    if (p.temp > -0.2 && p.temp < 0.2 && p.coldResist <= 0) return;
    const x = W - 40, y = H / 2 - 40, h = 80;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(ctx, x, y, 12, h, 6); ctx.fill();
    // marker
    const t = clamp((p.temp + 1) / 2, 0, 1); // 0 cold bottom, 1 hot top
    const my = y + h - t * h;
    const cold = p.temp < -0.35 && p.coldResist <= 0;
    ctx.fillStyle = cold ? '#6ab0ff' : (p.temp > 0.3 ? '#ff8a4a' : '#bfe0ff');
    ctx.beginPath(); ctx.arc(x + 6, my, 5, 0, TAU); ctx.fill();
    if (p.coldResist > 0) { ctx.fillStyle = '#ffb84a'; ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.fillText('warm', x + 6, y - 4); }
  }

  _prompt(ctx, g, W, H) {
    if (!g.currentInteract) return;
    const label = g.currentInteract.label;
    ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    const tw = ctx.measureText(label).width + 28;
    const touch = g.touch && g.touch.enabled;
    const x = W / 2 - tw / 2, y = touch ? H - 250 : H - 96;
    this._panel(ctx, x, y, tw, 26, 8);
    ctx.fillStyle = '#ffe9a0';
    ctx.fillText(label, W / 2, y + 18);
  }

  _toasts(ctx, g, W, H) {
    ctx.textAlign = 'center'; ctx.font = '13px monospace';
    let y = (g.touch && g.touch.enabled) ? H - 284 : H - 130;
    for (let i = 0; i < g.toasts.length; i++) {
      const t = g.toasts[i];
      ctx.globalAlpha = clamp(t.life, 0, 1);
      const tw = ctx.measureText(t.msg).width + 24;
      this._panel(ctx, W / 2 - tw / 2, y - 15, tw, 22, 6);
      ctx.globalAlpha = clamp(t.life, 0, 1);
      ctx.fillStyle = '#eef4f8';
      ctx.fillText(t.msg, W / 2, y);
      y -= 26;
    }
    ctx.globalAlpha = 1;
  }

  _bloodMoon(ctx, g, W, H) {
    const b = g.dayNight.bloodMoon;
    if (b < 0.1) return;
    ctx.globalAlpha = b;
    ctx.fillStyle = '#e04040'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
    ctx.fillText('Blood Moon Rising', W / 2, 60);
    ctx.globalAlpha = 1;
  }
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHeartHUD(ctx, x, y, size, frac) {
  const cx = x + size / 2, cy = y + size / 2;
  // container
  heartPath(ctx, cx, cy, size * 0.5);
  ctx.fillStyle = 'rgba(20,10,14,0.7)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
  if (frac > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, size * frac, size);
    ctx.clip();
    heartPath(ctx, cx, cy, size * 0.5);
    ctx.fillStyle = '#e8434f'; ctx.fill();
    heartPath(ctx, cx - size * 0.12, cy - size * 0.1, size * 0.22);
    ctx.fillStyle = '#ff9aa0'; ctx.fill();
    ctx.restore();
  }
}


/* ===== js/ui/minimap.js ===== */
'use strict';
/* minimap.js — a corner minimap and a full-screen map. Terrain is baked to a
   1px-per-tile image; areas are revealed by exploring and by towers. */

class Minimap {
  constructor(world) {
    this.world = world;
    const { c, ctx } = makeCanvas(world.W, world.H);
    for (let y = 0; y < world.H; y++) {
      for (let x = 0; x < world.W; x++) {
        const t = TILES[world.tiles[y * world.W + x]];
        ctx.fillStyle = css(t.col);
        ctx.fillRect(x, y, 1, 1);
      }
    }
    this.base = c;
    // reveal image starts empty; revealed pixels copied from base
    const rv = makeCanvas(world.W, world.H);
    this.reveal = rv.c; this.revealCtx = rv.ctx;
    this.mask = new Uint8Array(world.W * world.H);
    // structure icons pre-marked as revealed? no — discovered by exploration/towers
  }

  revealTile(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.world.W || ty >= this.world.H) return;
    const i = ty * this.world.W + tx;
    if (this.mask[i]) return;
    this.mask[i] = 1;
    this.revealCtx.drawImage(this.base, tx, ty, 1, 1, tx, ty, 1, 1);
  }

  revealAroundWorld(wx, wy, radiusTiles) {
    const ctx = Math.floor(wx / TILE), cty = Math.floor(wy / TILE);
    const r = radiusTiles;
    for (let y = cty - r; y <= cty + r; y++)
      for (let x = ctx - r; x <= ctx + r; x++)
        if ((x - ctx) * (x - ctx) + (y - cty) * (y - cty) <= r * r) this.revealTile(x, y);
  }

  isRevealedWorld(wx, wy) {
    const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
    if (tx < 0 || ty < 0 || tx >= this.world.W || ty >= this.world.H) return false;
    return !!this.mask[ty * this.world.W + tx];
  }

  drawSmall(ctx, x, y, size, game) {
    const p = game.player;
    const tilesAcross = 60;
    const half = tilesAcross / 2;
    const ptx = p.x / TILE, pty = p.y / TILE;
    let sx = ptx - half, sy = pty - half;

    ctx.save();
    // frame
    ctx.fillStyle = 'rgba(10,16,22,0.75)';
    roundRect(ctx, x - 3, y - 3, size + 6, size + 6, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(140,200,220,0.35)'; ctx.lineWidth = 1.5;
    roundRect(ctx, x - 3, y - 3, size + 6, size + 6, 8); ctx.stroke();
    // clip
    roundRect(ctx, x, y, size, size, 5); ctx.clip();
    ctx.fillStyle = '#0b1016'; ctx.fillRect(x, y, size, size);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.reveal, sx, sy, tilesAcross, tilesAcross, x, y, size, size);

    const scale = size / tilesAcross;
    const toScreen = (wx, wy) => ({ sx: x + (wx / TILE - sx) * scale, sy: y + (wy / TILE - sy) * scale });

    // structures (only if revealed)
    this._icons(ctx, game, toScreen, true);

    // enemies as red dots
    ctx.fillStyle = '#ff5a4a';
    for (const e of game.enemies) {
      if (!e.alive) continue;
      const s = toScreen(e.x, e.y);
      if (s.sx < x || s.sx > x + size || s.sy < y || s.sy > y + size) continue;
      ctx.fillRect(s.sx - 1, s.sy - 1, 2, 2);
    }
    // player arrow
    const ps = toScreen(p.x, p.y);
    ctx.fillStyle = '#ffe14a';
    ctx.beginPath(); ctx.arc(ps.sx, ps.sy, 2.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.restore();
    // 'N'
    ctx.fillStyle = '#cfe0ea'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('N', x + size / 2, y + 10);
  }

  drawFull(ctx, W, H, game) {
    const world = this.world;
    const scale = Math.min((W - 120) / world.W, (H - 140) / world.H);
    const mw = world.W * scale, mh = world.H * scale;
    const ox = (W - mw) / 2, oy = (H - mh) / 2 + 10;
    ctx.fillStyle = 'rgba(6,10,14,0.92)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8eef2'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText('MAP', W / 2, oy - 18);

    ctx.fillStyle = '#0b1016'; ctx.fillRect(ox, oy, mw, mh);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.reveal, 0, 0, world.W, world.H, ox, oy, mw, mh);
    ctx.strokeStyle = 'rgba(140,200,220,0.4)'; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, mw, mh);

    const toScreen = (wx, wy) => ({ sx: ox + (wx / TILE) * scale, sy: oy + (wy / TILE) * scale });
    this._icons(ctx, game, toScreen, true);
    // player
    const p = game.player; const ps = toScreen(p.x, p.y);
    ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(ps.sx, ps.sy, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = '#9fb8c8'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
    ctx.fillText('Towers reveal the map.  Press M or Esc to close.', W / 2, oy + mh + 24);
    this._legend(ctx, ox, oy + mh + 40);
  }

  _icons(ctx, game, toScreen, requireReveal) {
    const world = this.world;
    // towers
    for (const t of world.structures.towers) {
      if (requireReveal && !this.isRevealedWorld(t.x, t.y)) continue;
      const s = toScreen(t.x, t.y);
      ctx.fillStyle = t.activated ? '#4fd0c8' : '#c8b0e0';
      diamond(ctx, s.sx, s.sy, 3.5); ctx.fill();
    }
    // shrines
    for (const sh of world.structures.shrines) {
      if (requireReveal && !this.isRevealedWorld(sh.x, sh.y)) continue;
      const s = toScreen(sh.x, sh.y);
      ctx.fillStyle = sh.activated ? '#3fd8ff' : '#e08a3a';
      ctx.fillRect(s.sx - 2, s.sy - 2, 4, 4);
    }
    // stone talus lairs (undefeated only)
    for (const tl of (world.structures.talus || [])) {
      if (tl.defeated) continue;
      if (requireReveal && !this.isRevealedWorld(tl.x, tl.y)) continue;
      const s = toScreen(tl.x, tl.y);
      ctx.fillStyle = '#e0642a';
      ctx.beginPath(); ctx.moveTo(s.sx, s.sy - 4); ctx.lineTo(s.sx + 4, s.sy + 3); ctx.lineTo(s.sx - 4, s.sy + 3); ctx.closePath(); ctx.fill();
    }
  }

  _legend(ctx, x, y) {
    ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#c8b0e0'; ctx.fillText('◆ Tower', x, y);
    ctx.fillStyle = '#e08a3a'; ctx.fillText('■ Shrine', x + 90, y);
    ctx.fillStyle = '#ffe14a'; ctx.fillText('● You', x + 180, y);
  }
}

function diamond(ctx, x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }


/* ===== js/ui/menus.js ===== */
'use strict';
/* menus.js — title, how-to, pause, inventory and death overlays. Rendering
   only; the game state machine drives selection and transitions. */

class Menus {
  constructor(game) { this.game = game; this.t = 0; }

  update(dt) { this.t += dt; }

  _backdrop(ctx, W, H, alpha) {
    ctx.fillStyle = `rgba(6,10,16,${alpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawTitle(ctx, W, H, options, index) {
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2a3d6b'); sky.addColorStop(0.5, '#6a7fb0'); sky.addColorStop(1, '#c8a878');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // sun
    ctx.fillStyle = 'rgba(255,220,150,0.9)';
    ctx.beginPath(); ctx.arc(W * 0.72, H * 0.34, 46, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,235,190,0.35)';
    ctx.beginPath(); ctx.arc(W * 0.72, H * 0.34, 72, 0, TAU); ctx.fill();
    // layered hills
    const hills = [['#4a6a4a', 0.66, 90], ['#3a5840', 0.74, 120], ['#2c4432', 0.84, 150]];
    for (const [col, base, amp] of hills) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 20) {
        const y = H * base + Math.sin(x * 0.008 + base * 10) * (amp * 0.12) + Math.sin(x * 0.02) * 8;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    }
    // a distant tower silhouette
    ctx.fillStyle = '#20303a';
    ctx.fillRect(W * 0.2 - 6, H * 0.5, 12, H * 0.34);
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(W * 0.2, H * 0.5, 4, 0, TAU); ctx.fill();

    // title
    ctx.textAlign = 'center';
    const cx = W / 2, ty = H * 0.30;
    ctx.save();
    ctx.font = "bold 20px monospace"; ctx.fillStyle = '#d8e6c8';
    ctx.fillText('THE LEGEND OF', cx, ty - 34);
    ctx.font = "bold 54px monospace";
    ctx.lineWidth = 6; ctx.strokeStyle = '#1c2a1c'; ctx.strokeText('WILDERLAND', cx, ty + 12);
    const grad = ctx.createLinearGradient(cx - 200, 0, cx + 200, 0);
    grad.addColorStop(0, '#f0d878'); grad.addColorStop(0.5, '#fff4d0'); grad.addColorStop(1, '#c8a24a');
    ctx.fillStyle = grad; ctx.fillText('WILDERLAND', cx, ty + 12);
    ctx.font = "italic 15px monospace"; ctx.fillStyle = '#e8eec8';
    ctx.fillText('~ Breath of the Top-Down ~', cx, ty + 40);
    ctx.restore();

    this.drawMenuList(ctx, options, index, cx, H * 0.62);

    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '11px monospace';
    const touch = document.body.classList.contains('touch');
    ctx.fillText(touch ? 'Tap an option, or tap anywhere to begin' : 'Arrow keys / W,S to choose · Enter to select · or just press Enter to begin', cx, H - 24);
  }

  drawMenuList(ctx, options, index, cx, y) {
    ctx.textAlign = 'center'; ctx.font = 'bold 18px monospace';
    if (this.game) this.game._menuRects = [];
    for (let i = 0; i < options.length; i++) {
      const sel = i === index;
      const oy = y + i * 30;
      if (this.game) this.game._menuRects.push({ index: i, x: cx - 150, y: oy - 20, w: 300, h: 30 });
      if (sel) {
        const w = ctx.measureText(options[i]).width + 44;
        ctx.fillStyle = 'rgba(255,235,150,0.16)';
        roundRect(ctx, cx - w / 2, oy - 18, w, 26, 6); ctx.fill();
        ctx.fillStyle = '#ffe98a';
        ctx.fillText('▸ ' + options[i] + ' ◂', cx, oy);
      } else {
        ctx.fillStyle = 'rgba(230,238,244,0.7)';
        ctx.fillText(options[i], cx, oy);
      }
    }
  }

  drawHowTo(ctx, W, H) {
    this._backdrop(ctx, W, H, 0.9);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe98a'; ctx.font = 'bold 24px monospace';
    ctx.fillText('HOW TO PLAY', W / 2, 60);
    const lines = [
      ['Move', 'W A S D  or  Arrow Keys'],
      ['Sprint (uses stamina)', 'Hold Shift'],
      ['Climb cliffs (uses stamina)', 'Walk into a cliff'],
      ['Swim (uses stamina)', 'Walk into deep water'],
      ['Attack / Slash', 'J  or  Left-Click'],
      ['Dodge roll (just-dodge = Flurry!)', 'Space'],
      ['⚡ AWAKEN (when KI gauge full)', 'R'],
      ['Shoot bow', 'K  or  Right-Click (aim with mouse)'],
      ['Throw bomb (rune)', 'B'],
      ['Interact / Open / Activate', 'E'],
      ['Cycle weapon', 'Q'],
      ['Eat food (heal)', 'F'],
      ['Map', 'M'],
      ['Inventory', 'Tab'],
      ['Pause', 'Esc  or  P'],
      ['Mute sound / music', '0 / 9'],
    ];
    ctx.font = '14px monospace';
    let y = 100;
    const lx = W / 2 - 220, rx = W / 2 + 210;
    for (const [k, v] of lines) {
      ctx.textAlign = 'left'; ctx.fillStyle = '#cfe0ea'; ctx.fillText(k, lx, y);
      ctx.textAlign = 'right'; ctx.fillStyle = '#ffe0a0'; ctx.fillText(v, rx, y);
      y += 24;
    }
    ctx.textAlign = 'center'; ctx.fillStyle = '#9fb8c8'; ctx.font = '13px monospace';
    ctx.fillText('Goal: explore, climb towers to reveal the map, clear camps,', W / 2, y + 20);
    ctx.fillText('activate shrines for heart containers, and find hidden Koroks!', W / 2, y + 40);
    ctx.fillStyle = '#ffe98a'; ctx.fillText('Press Esc or Enter to go back', W / 2, H - 30);
  }

  drawPause(ctx, W, H, options, index) {
    this._backdrop(ctx, W, H, 0.6);
    ctx.textAlign = 'center'; ctx.fillStyle = '#e8eef2'; ctx.font = 'bold 30px monospace';
    ctx.fillText('PAUSED', W / 2, H * 0.3);
    this.drawMenuList(ctx, options, index, W / 2, H * 0.45);
  }

  drawInventory(ctx, W, H, game) {
    this._backdrop(ctx, W, H, 0.9);
    const p = game.player;
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe98a'; ctx.font = 'bold 22px monospace';
    ctx.fillText('INVENTORY', W / 2, 50);

    // Weapons
    ctx.textAlign = 'left'; ctx.font = '15px monospace'; ctx.fillStyle = '#cfe0ea';
    let x = W / 2 - 240, y = 90;
    ctx.fillText('Weapons', x, y); y += 26;
    ctx.font = '13px monospace';
    for (let i = 0; i < p.weapons.length; i++) {
      const w = p.weapons[i];
      const icon = game.sprites.icon[w.icon];
      if (icon) ctx.drawImage(icon, x, y - 12, 16, 16);
      ctx.fillStyle = i === p.wi ? '#ffe98a' : '#cfe0ea';
      ctx.fillText(`${w.name}  (ATK ${w.dmg}${isFinite(w.maxDur) ? ', ' + Math.ceil(w.dur) + '/' + w.maxDur : ''})`, x + 22, y);
      y += 22;
    }
    y += 6;
    ctx.fillStyle = '#cfe0ea'; ctx.font = '15px monospace'; ctx.fillText('Runes & Ammo', x, y); y += 24;
    ctx.font = '13px monospace';
    ctx.fillText(`Bow: ${p.hasBow ? 'Yes' : 'None'}   Arrows: ${p.arrows}`, x, y); y += 20;
    ctx.fillText(`Bomb Rune: ready in ${Math.max(0, p.bombCd).toFixed(1)}s`, x, y); y += 20;

    // Right column: food + stats
    let rx = W / 2 + 30; y = 90;
    ctx.fillStyle = '#cfe0ea'; ctx.font = '15px monospace'; ctx.fillText('Food (press F to eat best)', rx, y); y += 24;
    ctx.font = '13px monospace';
    const foods = [['apple', 'Apple (+½)'], ['mushroom', 'Mushroom (+¾)'], ['meat', 'Meat (+1½)'], ['cooked', 'Cooked Meal (+3, warm)']];
    for (const [k, label] of foods) {
      const icon = game.sprites.icon[k === 'cooked' ? 'meat' : k];
      if (icon) ctx.drawImage(icon, rx, y - 12, 16, 16);
      ctx.fillStyle = '#e8eef2';
      ctx.fillText(`${label} × ${p.food[k] || 0}`, rx + 22, y); y += 22;
    }
    y += 10;
    ctx.fillStyle = '#cfe0ea'; ctx.font = '15px monospace'; ctx.fillText('Adventure Log', rx, y); y += 24;
    ctx.font = '13px monospace'; ctx.fillStyle = '#e8eef2';
    ctx.fillText(`Hearts: ${p.maxHearts}    Rupees: ${p.rupees}`, rx, y); y += 20;
    ctx.fillText(`Shrines activated: ${p.shrines}`, rx, y); y += 20;
    ctx.fillText(`Towers: ${p.towersFound}/${game.world.structures.towers.length}`, rx, y); y += 20;
    ctx.fillText(`Korok seeds: ${p.koroks}`, rx, y); y += 20;

    // cook hint
    ctx.textAlign = 'center'; ctx.fillStyle = '#9fb8c8'; ctx.font = '12px monospace';
    ctx.fillText('Tip: stand by a cooking pot and press E to cook ingredients into a warm meal.', W / 2, H - 54);
    ctx.fillStyle = '#ffe98a'; ctx.fillText('Press Tab or Esc to close', W / 2, H - 30);
  }

  drawDeath(ctx, W, H, t) {
    ctx.fillStyle = `rgba(40,0,0,${clamp(0.6 * (1 - t / 2.2), 0, 0.6)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffdada'; ctx.font = 'bold 34px monospace';
    ctx.globalAlpha = clamp(1 - t / 2.2, 0, 1);
    ctx.fillText('You Died', W / 2, H / 2 - 8);
    ctx.font = '14px monospace'; ctx.fillStyle = '#e8c0c0';
    ctx.fillText('Returning to your last resting place…', W / 2, H / 2 + 22);
    ctx.globalAlpha = 1;
  }
}


/* ===== js/game.js ===== */
'use strict';
/* game.js — orchestrates everything: state machine, camera, update/render,
   interactions, combat helpers, spawning, day/night, save/load. */

const TARGET_TILES_TALL = 24;
const INTERACT_RANGE = 26;
const SAVE_KEY = 'wilderland_save_v1';

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.input = new Input(canvas);
    this.audio = new AudioFX();
    this.sprites = new SpriteBank();
    this.touch = new TouchControls(this.input, this);
    this._menuRects = [];

    this.state = 'title';
    this.prevState = 'title';
    this.menuIndex = 0;
    this.titleOptions = ['Start Game', 'How to Play', 'New World'];
    this.pauseOptions = ['Resume', 'Open Map', 'How to Play', 'Sound: On', 'Music: On', 'Return to Title'];

    this.camera = { x: 0, y: 0 };
    this.view = { x: 0, y: 0, w: 100, h: 100 };
    this.zoom = 2;
    this.mouseWorld = { x: 0, y: 0 };

    this.enemies = [];
    this.pickups = [];
    this.projectiles = [];
    this.particles = new Particles();
    this.toasts = [];
    this.currentInteract = null;

    this.shakeAmt = 0;
    this.hitstop = 0;
    this.saveTimer = 8;
    this._time = 0;
    this.timeScale = 1;
    this.slowmoT = 0; this.slowmoScale = 1;
    this.lighting = new Lighting();
    this.ambient = new Ambient();
    this.lights = [];
    this.floaters = [];
    this.combo = 0; this.comboTimer = 0; this.comboBest = 0;

    this.resize();
    // Resume the saved world if there is one, otherwise roll a fresh seed.
    const savedSeed = this._savedSeed();
    this._newWorld(savedSeed !== null ? savedSeed : this._randomSeed(), true);
  }

  _randomSeed() { return Math.floor((performance.now() * 1000) % 2147483647) ^ (this._seedSalt = (this._seedSalt || 12345) * 16807 % 2147483647); }

  _savedSeed() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return (typeof d.seed === 'number' && isFinite(d.seed)) ? d.seed : null;
    } catch (e) { return null; }
  }

  _newWorld(seed, tryLoad) {
    const data = generateWorld(seed);
    this.world = new World(data, this.sprites);
    this.minimap = new Minimap(this.world);
    this.player = new Player(this.world.spawn.x, this.world.spawn.y);
    this.dayNight = new DayNight(8);
    this.weather = new Weather(new RNG((seed ^ 0xBEEF) >>> 0));
    this.spawner = new Spawner();
    this.hud = new HUD(this);
    this.menus = new Menus(this);
    this.enemies.length = 0; this.pickups.length = 0; this.projectiles.length = 0;
    this.lights.length = 0; this.floaters.length = 0;
    this.combo = 0; this.comboTimer = 0;
    this.boss = null;
    this.toasts.length = 0;
    this.dayNight.onBloodMoon = () => this._bloodMoon();
    // reveal spawn area
    this.minimap.revealAroundWorld(this.player.x, this.player.y, 22);
    this._giveStarterKit();
    if (tryLoad) this._load(seed);
    this._centerCamera();
  }

  _giveStarterKit() {
    const p = this.player;
    p.addFood('apple', 3);
    // a cook pot & shrine near spawn help onboarding; give a couple arrows too
    p.arrows = 0;
  }

  /* ---------------- lifecycle ---------------- */
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = this.canvas.clientWidth || window.innerWidth;
    const h = this.canvas.clientHeight || window.innerHeight;
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.dpr = dpr;
    this.W = w; this.H = h;
    this.zoom = clamp(Math.round(h / (TILE * TARGET_TILES_TALL)), 2, 4);
    this.ctx.imageSmoothingEnabled = false;
  }

  startGame() {
    this.state = 'playing';
    this.audio.unlock();
    this.toast('Welcome to Wilderland!');
    this.toast('Climb a tower to reveal the map.');
  }

  toast(msg) {
    this.toasts.unshift({ msg, life: 2.6, t0: 2.6 });
    if (this.toasts.length > 4) this.toasts.pop();
  }

  shake(a) { this.shakeAmt = Math.min(14, this.shakeAmt + a); }
  hitStop(t) { this.hitstop = Math.max(this.hitstop, t); }
  startSlowmo(dur, scale) { this.slowmoT = Math.max(this.slowmoT, dur); this.slowmoScale = scale; }
  addLight(x, y, r, col, life) { if (this.lights.length < 40) this.lights.push({ x, y, r, col, life, max: life }); }
  addFloater(x, y, text, col, opts) {
    opts = opts || {};
    this.floaters.push({ x: x + rand(-3, 3), y, text: String(text), col: col || '#fff', life: opts.life || 0.9, max: opts.life || 0.9, vy: opts.vy || -30, size: opts.size || 12 });
    if (this.floaters.length > 60) this.floaters.shift();
  }
  addCombo(n) {
    this.combo += (n || 1);
    this.comboTimer = 2.0;
    if (this.combo > this.comboBest) this.comboBest = this.combo;
    if (this.player) this.player.awakenGain(0.02 * (n || 1) + this.combo * 0.002);
  }
  rngPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  startBoss(ref) {
    if (this.boss) return;
    this.boss = new Boss(ref.x, ref.y, this, ref);
    this.toast('A Stone Talus awakens! Strike its glowing ore.');
    this.shake(7); this.audio.play('activate');
  }
  _checkBoss() {
    if (this.boss || !this.world.structures.talus) return;
    for (const t of this.world.structures.talus) {
      if (!t.defeated && dist(this.player.x, this.player.y, t.x, t.y) < 190) { this.startBoss(t); break; }
    }
  }

  /* ---------------- spawning helpers ---------------- */
  spawnEnemy(x, y, kind) {
    if (this.enemies.length > 90) return null;
    const e = new Enemy(x, y, kind, this);
    this.enemies.push(e);
    return e;
  }
  spawnPickup(x, y, type, key) { this.pickups.push(new Pickup(x, y, type, key)); }
  spawnProjectile(pr) { this.projectiles.push(pr); }

  onEnemyDeath(e) {
    // loot drops
    const r = Math.random();
    if (r < 0.34) this.spawnPickup(e.x, e.y, 'heart');
    if (Math.random() < 0.5) this.spawnPickup(e.x + rand(-4, 4), e.y, Math.random() < 0.7 ? 'rupeeG' : 'rupeeB');
    if (Math.random() < 0.25) this.spawnPickup(e.x, e.y, 'arrows');
    if (e.kind === 'bokoblin_blue' && Math.random() < 0.4) this.spawnPickup(e.x, e.y, 'meat');
    if (Math.random() < 0.06) this.spawnPickup(e.x, e.y, 'weapon', ['sword', 'spear', 'claymore'][Math.floor(Math.random() * 3)]);
    if (e.kind === 'octorok' && Math.random() < 0.3) this.spawnPickup(e.x, e.y, 'mushroom');
  }

  onPlayerDied() {
    this.state = 'death';
    this.slowmoT = 0; this.timeScale = 1; // don't leave the world in slow-mo
    this.player.flurry = 0;
    this.shake(8);
  }

  explode(x, y, radius, dmg) {
    this.particles.explosion(x, y);
    this.audio.play('explode');
    this.shake(8);
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const d = dist(x, y, e.x, e.y);
      if (d < radius + e.rad) {
        const k = angleTo(x, y, e.x, e.y);
        e.damage(dmg, Math.cos(k), Math.sin(k), 260, this);
      }
    }
    this.world.forEachObjectIn(x - radius - 12, y - radius - 12, x + radius + 12, y + radius + 12, (o) => {
      if (o.dead) return;
      if (o.breakable && dist(x, y, o.x, o.y) < radius + (o.r || 8)) this.breakBoulder(o);
      if (o.cut && dist(x, y, o.x, o.y) < radius) this.cutGrass(o);
    });
    const p = this.player;
    if (p.alive && dist(x, y, p.x, p.y) < radius * 0.8 && p.state !== 'glide') {
      const k = angleTo(x, y, p.x, p.y);
      p.damage(0.5, Math.cos(k), Math.sin(k), this);
    }
  }

  cutGrass(o) {
    o.dead = true;
    this.particles.leaves(o.x, o.y, '#6fae4a');
    this.audio.play('break');
    const r = Math.random();
    if (r < 0.08) this.spawnPickup(o.x, o.y, 'heart');
    else if (r < 0.16) this.spawnPickup(o.x, o.y, 'rupeeG');
    else if (r < 0.20) this.spawnPickup(o.x, o.y, 'apple');
    else if (r < 0.23) this.spawnPickup(o.x, o.y, 'arrows');
  }

  breakBoulder(o) {
    if (o.dead) return;
    o.dead = true;
    this.particles.burst(o.x, o.y - 6, '#8b857e', 16);
    this.audio.play('break');
    if (Math.random() < 0.5) this.spawnPickup(o.x, o.y, Math.random() < 0.6 ? 'rupeeB' : 'rupeeR');
    if (Math.random() < 0.3) this.spawnPickup(o.x, o.y, 'arrows');
  }

  _bloodMoon() {
    this.toast('The Blood Moon revives fallen foes...');
    // Kill existing wanderers AND camp members first, so resetting the camps
    // doesn't orphan still-living foes and double the population.
    for (const e of this.enemies) if (e.isWanderer || e.camp) { e.state = 'dead'; e.deadT = 0; }
    for (const camp of this.world.structures.camps) { camp.spawned = false; camp.cleared = false; camp.enemies = []; }
    this.shake(6);
  }

  /* ---------------- interactions ---------------- */
  _interactLabel(o) {
    switch (o.interact) {
      case 'tower': return o.ref.activated ? '[E] Paraglide from Tower' : '[E] Activate Sheikah Tower';
      case 'shrine': return o.ref.activated ? '[E] Rest at Shrine' : '[E] Activate Shrine';
      case 'chest': return '[E] Open Chest';
      case 'cookpot': return '[E] Cook';
      case 'korok': return '[E] Lift Rock';
    }
    return '[E]';
  }

  _doInteract(o) {
    const p = this.player;
    switch (o.interact) {
      case 'tower': {
        if (!o.ref.activated) {
          o.ref.activated = true; p.towersFound++;
          this.minimap.revealAroundWorld(o.x, o.y, 58);
          p.respawn = { x: o.x, y: o.y + 18 };
          this.audio.play('activate'); this.shake(4);
          this.particles.burst(o.x, o.y - 40, '#4fd0c8', 24);
          this.toast('Sheikah Tower activated! Region revealed.');
          this.toast('Press E again to paraglide.');
        } else {
          p.startGlide(this);
        }
        break;
      }
      case 'shrine': {
        if (!o.ref.activated) {
          o.ref.activated = true; p.shrines++;
          this.minimap.revealAroundWorld(o.x, o.y, 26);
          if (p.shrines % 2 === 1) { p.maxHearts++; this.toast('Heart Container gained! Max hearts: ' + p.maxHearts); }
          else { p.maxStamina = Math.min(2, p.maxStamina + 0.5); this.toast('Stamina increased!'); }
          this.audio.play('activate');
          this.particles.burst(o.x, o.y - 10, '#3fd8ff', 20);
        }
        p.respawn = { x: o.x, y: o.y + 16 };
        p.heal(p.maxHearts); p.stamina = p.maxStamina; p.staminaLock = false;
        this.toast('Rested. Fully restored.');
        break;
      }
      case 'chest': {
        if (o.opened) break;
        o.opened = true; this.audio.play('activate');
        this.particles.spark(o.x, o.y - 6);
        this._grantChest(o.item);
        break;
      }
      case 'cookpot': this._cook(); break;
      case 'korok': {
        if (o.done) break;
        o.done = true;
        this.spawnPickup(o.x, o.y - 4, 'korok');
        this.particles.burst(o.x, o.y - 6, '#8fd070', 12);
        break;
      }
    }
  }

  _grantChest(item) {
    const p = this.player;
    if (WEAPONS[item]) { p.giveWeapon(item); this.toast('Got ' + WEAPONS[item].name + '!'); return; }
    switch (item) {
      case 'bow': p.hasBow = true; p.arrows += 10; this.toast('Got a Bow! (+10 arrows)'); break;
      case 'arrows': p.arrows += 10; this.toast('Got 10 arrows.'); break;
      case 'rupees': p.rupees += 20; this.toast('Got 20 rupees.'); break;
      case 'bombup': p.arrows += 5; this.spawnPickup(p.x + 8, p.y, 'rupeeR'); this.toast('Found treasure!'); break;
      case 'heartup_food': p.addFood('meat', 2); p.addFood('apple', 2); this.toast('Got some food.'); break;
      default: p.rupees += 10; this.toast('Got 10 rupees.');
    }
  }

  _cook() {
    const p = this.player;
    const ingr = p.food.apple + p.food.meat + p.food.mushroom;
    if (ingr <= 0) { this.toast('You have no ingredients to cook.'); return; }
    // consume up to 3 raw ingredients -> 1 cooked meal
    let used = 0;
    for (const k of ['meat', 'mushroom', 'apple']) {
      while (p.food[k] > 0 && used < 3) { p.food[k]--; used++; }
    }
    p.addFood('cooked', 1);
    this.audio.play('activate');
    this.particles.heal(p.x, p.y - 4);
    this.toast('Cooked a hearty meal! (' + used + ' ingredients)');
  }

  /* ---------------- update ---------------- */
  update(dt) {
    this._time += dt;
    this.menus.update(dt);
    this._globalKeys();
    if (this.touch) this.touch.sync(this.state);

    switch (this.state) {
      case 'title': this._updateMenu(dt, this.titleOptions, (i) => this._titleSelect(i)); this._menuTap('title'); break;
      case 'howto': if (this.input.wasPressed('Escape', 'Enter', 'Space') || this.input.tap) { this.audio.play('menu'); this.state = this.prevState; } break;
      case 'pause': this._updateMenu(dt, this.pauseOptions, (i) => this._pauseSelect(i), true); this._menuTap('pause'); break;
      case 'inventory': if (this.input.wasPressed('Tab', 'Escape', 'KeyI') || this.input.tap) { this.audio.play('menu'); this.state = 'playing'; } break;
      case 'map': if (this.input.wasPressed('KeyM', 'Escape') || this.input.tap) { this.audio.play('menu'); this.state = 'playing'; } break;
      case 'playing': this._updatePlaying(dt); break;
      case 'death': this._updateDeath(dt); break;
    }
    this.input.lateUpdate();
  }

  _hitMenu(t) {
    for (const r of this._menuRects) if (t.x >= r.x && t.x <= r.x + r.w && t.y >= r.y && t.y <= r.y + r.h) return r.index;
    return -1;
  }
  // Handle a tap on a menu screen: select the tapped option (title also starts
  // on a tap anywhere else, so a first-time player just taps to play).
  _menuTap(kind) {
    const t = this.input.tap;
    if (!t) return;
    const i = this._hitMenu(t);
    if (kind === 'title') { this.audio.play('select'); if (i >= 0) this.menuIndex = i; this._titleSelect(i >= 0 ? i : 0); }
    else if (kind === 'pause') { if (i >= 0) { this.menuIndex = i; this.audio.play('select'); this._pauseSelect(i); } }
  }

  _globalKeys() {
    if (this.input.wasPressed('Digit0')) { const m = this.audio.toggleMute(); this.pauseOptions[3] = 'Sound: ' + (m ? 'Off' : 'On'); this.toast('Sound ' + (m ? 'muted' : 'on')); }
    if (this.input.wasPressed('Digit9')) { const on = this.audio.toggleMusic(); this.pauseOptions[4] = 'Music: ' + (on ? 'On' : 'Off'); this.toast('Music ' + (on ? 'on' : 'off')); }
    if (this.input.anyInteraction && !this.audio.started) this.audio.unlock();
  }

  _updateMenu(dt, options, onSelect, isPause) {
    const inp = this.input;
    if (inp.wasPressed('ArrowUp', 'KeyW')) { this.menuIndex = (this.menuIndex - 1 + options.length) % options.length; this.audio.play('menu'); }
    if (inp.wasPressed('ArrowDown', 'KeyS')) { this.menuIndex = (this.menuIndex + 1) % options.length; this.audio.play('menu'); }
    if (inp.wasPressed('Enter', 'Space', 'KeyE') || inp.mouse.leftPressed) { this.audio.play('select'); onSelect(this.menuIndex); }
    if (isPause && inp.wasPressed('Escape', 'KeyP')) { this.audio.play('menu'); this.state = 'playing'; }
  }

  _titleSelect(i) {
    if (i === 0) { this.menuIndex = 0; this.startGame(); }
    else if (i === 1) { this.prevState = 'title'; this.state = 'howto'; }
    else if (i === 2) { this._clearSave(); this._newWorld(this._randomSeed(), false); this.menuIndex = 0; this.startGame(); }
  }

  _pauseSelect(i) {
    if (i === 0) this.state = 'playing';
    else if (i === 1) this.state = 'map';
    else if (i === 2) { this.prevState = 'pause'; this.state = 'howto'; }
    else if (i === 3) { const m = this.audio.toggleMute(); this.pauseOptions[3] = 'Sound: ' + (m ? 'Off' : 'On'); }
    else if (i === 4) { const on = this.audio.toggleMusic(); this.pauseOptions[4] = 'Music: ' + (on ? 'On' : 'Off'); }
    else if (i === 5) { this._save(); this.state = 'title'; this.menuIndex = 0; }
  }

  _updatePlaying(dt) {
    const inp = this.input;
    // menu transitions
    if (inp.wasPressed('Escape', 'KeyP')) { this.state = 'pause'; this.menuIndex = 0; this.audio.play('menu'); return; }
    if (inp.wasPressed('KeyM')) { this.state = 'map'; this.audio.play('menu'); return; }
    if (inp.wasPressed('Tab', 'KeyI')) { this.state = 'inventory'; this.audio.play('menu'); return; }

    // hitstop freezes the world briefly for impact
    if (this.hitstop > 0) { this.hitstop -= dt; dt = Math.min(dt, 0.0005); }

    // slow-motion (flurry rush) scales the simulation but not real-time timers
    if (this.slowmoT > 0) { this.slowmoT -= dt; this.timeScale = this.slowmoScale; }
    else this.timeScale = 1;
    const sdt = dt * this.timeScale;

    this.dayNight.update(sdt);
    this.weather.update(sdt, this);
    this.ambient.update(sdt, this);
    this.audio.updateMusic(dt, this.dayNight.night);

    // mouse world pos
    this.mouseWorld.x = this.camera.x + inp.mouse.sx / this.zoom;
    this.mouseWorld.y = this.camera.y + inp.mouse.sy / this.zoom;

    this.player.update(sdt, this);
    this.spawner.update(sdt, this);
    this._checkBoss();
    for (const e of this.enemies) e.update(sdt, this);
    if (this.boss) this.boss.update(sdt, this);
    for (const pk of this.pickups) pk.update(sdt, this);
    for (const pr of this.projectiles) pr.update(sdt, this);
    this.particles.update(sdt);

    // transient lights + floating text
    for (let i = this.lights.length - 1; i >= 0; i--) { this.lights[i].life -= sdt; if (this.lights[i].life <= 0) this.lights.splice(i, 1); }
    for (let i = this.floaters.length - 1; i >= 0; i--) { const f = this.floaters[i]; f.life -= sdt; f.y += f.vy * sdt; f.vy += 40 * sdt; if (f.life <= 0) this.floaters.splice(i, 1); }
    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }

    // cull dead
    this.enemies = this.enemies.filter(e => e.state !== 'dead' || e.deadT > 0);
    this.pickups = this.pickups.filter(p => !p.dead);
    this.projectiles = this.projectiles.filter(p => !p.dead);
    if (this.boss && this.boss.dead && this.boss.deadT <= 0) this.boss = null;

    // interaction
    this._updateInteraction();

    // reveal minimap around player as they explore
    this.minimap.revealAroundWorld(this.player.x, this.player.y, 7);

    // toasts
    for (let i = this.toasts.length - 1; i >= 0; i--) { this.toasts[i].life -= dt; if (this.toasts[i].life <= 0) this.toasts.splice(i, 1); }

    this._updateCamera(dt);
    this.shakeAmt *= Math.pow(0.001, dt);

    // autosave
    this.saveTimer -= dt;
    if (this.saveTimer <= 0) { this.saveTimer = 12; this._save(); }
  }

  _updateInteraction() {
    const p = this.player;
    if (p.state === 'glide' || p.state === 'climb' || p.state === 'swim') { this.currentInteract = null; return; }
    const o = this.world.nearestInteractable(p.x, p.y, INTERACT_RANGE);
    this.currentInteract = o ? { obj: o, label: this._interactLabel(o) } : null;
    if (this.currentInteract && this.input.wasPressed('KeyE')) {
      this._doInteract(o);
    }
  }

  _updateDeath(dt) {
    this.player.deadTimer -= dt;
    this.particles.update(dt);
    this.shakeAmt *= Math.pow(0.001, dt);
    if (this.player.deadTimer <= 0) {
      this.player.respawnNow(this);
      // clear immediate threats
      const p = this.player;
      this.enemies = this.enemies.filter(e => dist(e.x, e.y, p.x, p.y) > 120);
      this.state = 'playing';
      this.toast('Rescued! Be careful out there.');
    }
  }

  /* ---------------- camera ---------------- */
  _centerCamera() {
    this.camera.x = this.player.x - (this.W / this.zoom) / 2;
    this.camera.y = this.player.y - (this.H / this.zoom) / 2;
    this._clampCamera();
  }
  _updateCamera(dt) {
    if (!isFinite(this.camera.x) || !isFinite(this.camera.y)) this._centerCamera();
    const vw = this.W / this.zoom, vh = this.H / this.zoom;
    const tx = this.player.x - vw / 2, ty = this.player.y - vh / 2;
    const k = 1 - Math.pow(0.0001, dt);
    this.camera.x += (tx - this.camera.x) * k;
    this.camera.y += (ty - this.camera.y) * k;
    this._clampCamera();
  }
  _clampCamera() {
    const vw = this.W / this.zoom, vh = this.H / this.zoom;
    this.camera.x = clamp(this.camera.x, 0, Math.max(0, this.world.pxW - vw));
    this.camera.y = clamp(this.camera.y, 0, Math.max(0, this.world.pxH - vh));
  }

  /* ---------------- render ---------------- */
  render() {
    const ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;

    if (this.state === 'title') { this.menus.drawTitle(ctx, this.W, this.H, this.titleOptions, this.menuIndex); return; }
    if (this.state === 'howto' && this.prevState === 'title') { this.menus.drawTitle(ctx, this.W, this.H, this.titleOptions, this.menuIndex); this.menus.drawHowTo(ctx, this.W, this.H); return; }

    // world
    ctx.fillStyle = '#0b1016'; ctx.fillRect(0, 0, this.W, this.H);
    const shake = this.shakeAmt;
    const sx = shake > 0.2 ? (Math.random() * 2 - 1) * shake : 0;
    const sy = shake > 0.2 ? (Math.random() * 2 - 1) * shake : 0;
    const camX = Math.round(this.camera.x - sx), camY = Math.round(this.camera.y - sy);
    const vw = this.W / this.zoom, vh = this.H / this.zoom;
    this.view.x = camX; this.view.y = camY; this.view.w = vw; this.view.h = vh;

    ctx.save();
    ctx.setTransform(this.zoom * this.dpr, 0, 0, this.zoom * this.dpr, -camX * this.zoom * this.dpr, -camY * this.zoom * this.dpr);

    this.world.drawTerrain(ctx, this.view);
    this.ambient.drawWater(ctx, this);

    // build y-sorted render list
    const list = [];
    this.world.collectVisibleObjects(this.view, list);
    const p = this.player;
    list.push({ sortY: p.y, kind: 'player' });
    for (const e of this.enemies) if (this._inView(e.x, e.y, 40)) list.push({ sortY: e.y, kind: 'enemy', e });
    if (this.boss && this._inView(this.boss.x, this.boss.y, 120)) list.push({ sortY: this.boss.y, kind: 'boss' });
    for (const pk of this.pickups) if (this._inView(pk.x, pk.y, 30)) list.push({ sortY: pk.y, kind: 'pickup', pk });
    for (const pr of this.projectiles) if (this._inView(pr.x, pr.y, 30)) list.push({ sortY: pr.y + 4, kind: 'proj', pr });
    list.sort((a, b) => a.sortY - b.sortY);
    for (const it of list) {
      if (it.kind === 'obj') this.world.drawObject(ctx, it.o, this._time);
      else if (it.kind === 'player') p.draw(ctx, this);
      else if (it.kind === 'enemy') it.e.draw(ctx, this);
      else if (it.kind === 'boss') this.boss.draw(ctx, this);
      else if (it.kind === 'pickup') it.pk.draw(ctx, this);
      else if (it.kind === 'proj') it.pr.draw(ctx, this);
    }

    this.particles.draw(ctx);
    this.ambient.drawDay(ctx, this);

    // interaction highlight ring
    if (this.currentInteract) {
      const o = this.currentInteract.obj;
      ctx.strokeStyle = 'rgba(255,233,140,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(o.x, o.y, (o.r || 8) + 4 + Math.sin(this.menus.t * 6) * 1.5, 0, TAU); ctx.stroke();
    }

    ctx.restore();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    // lighting, fireflies, weather, floating text (all screen space)
    this.lighting.render(ctx, this);
    this.ambient.drawGlow(ctx, this);
    this.weather.render(ctx, this);
    this._drawFloaters(ctx);

    // HUD + overlays
    if (this.state === 'playing' || this.state === 'pause' || this.state === 'death') {
      this.hud.draw(ctx, this.W, this.H);
      // On touch the bottom-right corner is the action cluster, so tuck the
      // minimap under the top-right info panel instead.
      if (this.touch && this.touch.enabled) this.minimap.drawSmall(ctx, this.W - 116, 82, 100, this);
      else this.minimap.drawSmall(ctx, this.W - 132, this.H - 132, 120, this);
    }
    if (this.state === 'pause') this.menus.drawPause(ctx, this.W, this.H, this.pauseOptions, this.menuIndex);
    if (this.state === 'inventory') this.menus.drawInventory(ctx, this.W, this.H, this);
    if (this.state === 'map') this.minimap.drawFull(ctx, this.W, this.H, this);
    if (this.state === 'howto') this.menus.drawHowTo(ctx, this.W, this.H);
    if (this.state === 'death') this.menus.drawDeath(ctx, this.W, this.H, this.player.deadTimer);

    this._vignette(ctx);
  }

  _inView(x, y, pad) {
    return x > this.view.x - pad && x < this.view.x + this.view.w + pad && y > this.view.y - pad && y < this.view.y + this.view.h + pad;
  }

  _drawFloaters(ctx) {
    if (!this.floaters.length) return;
    const z = this.zoom, view = this.view;
    ctx.textAlign = 'center';
    for (const f of this.floaters) {
      const sx = (f.x - view.x) * z, sy = (f.y - view.y) * z;
      if (sx < -20 || sx > this.W + 20 || sy < -20 || sy > this.H + 20) continue;
      ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
      ctx.font = `bold ${f.size}px monospace`;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillText(f.text, sx + 1, sy + 1);
      ctx.fillStyle = f.col; ctx.fillText(f.text, sx, sy);
    }
    ctx.globalAlpha = 1;
  }

  _vignette(ctx) {
    const g = ctx.createRadialGradient(this.W / 2, this.H / 2, this.H * 0.35, this.W / 2, this.H / 2, this.H * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, this.W, this.H);
  }

  /* ---------------- save / load ---------------- */
  _save() {
    try {
      const p = this.player;
      const data = {
        seed: this.world.seed,
        p: {
          x: p.x, y: p.y, health: p.health, maxHearts: p.maxHearts, stamina: p.stamina, maxStamina: p.maxStamina,
          rupees: p.rupees, koroks: p.koroks, shrines: p.shrines, towersFound: p.towersFound,
          hasBow: p.hasBow, arrows: p.arrows, food: p.food, respawn: p.respawn,
          weapons: p.weapons.map(w => ({ key: w.key, dur: isFinite(w.dur) ? Math.ceil(w.dur) : -1 })), wi: p.wi,
        },
        dn: { time: this.dayNight.time, day: this.dayNight.day },
        towers: this.world.structures.towers.map(t => t.activated ? 1 : 0),
        shrines: this.world.structures.shrines.map(s => s.activated ? 1 : 0),
        chests: this.world.structures.chests.map(c => c.opened ? 1 : 0),
        koroks: this.world.structures.koroks.map(k => k.done ? 1 : 0),
        talus: this.world.structures.talus.map(t => t.defeated ? 1 : 0),
        reveal: this._packReveal(),
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) { /* storage may be unavailable */ }
  }

  _packReveal() {
    // run-length encode the reveal mask to keep it small
    const m = this.minimap.mask; const out = []; let cur = m[0], run = 0;
    for (let i = 0; i < m.length; i++) { if (m[i] === cur) run++; else { out.push(run); cur = m[i]; run = 1; } }
    out.push(run); return { first: m[0], runs: out };
  }
  _unpackReveal(data) {
    try {
      const m = this.minimap.mask; let i = 0, val = data.first;
      for (const run of data.runs) { for (let k = 0; k < run && i < m.length; k++) { if (val) { this.minimap.revealTile(i % this.world.W, Math.floor(i / this.world.W)); } i++; } val = val ? 0 : 1; }
    } catch (e) { }
  }

  _load(seed) {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d.seed !== seed) return;
      const p = this.player, s = d.p;
      Object.assign(p, {
        x: s.x, y: s.y, health: s.health, maxHearts: s.maxHearts, stamina: s.stamina, maxStamina: s.maxStamina,
        rupees: s.rupees, koroks: s.koroks, shrines: s.shrines, towersFound: s.towersFound,
        hasBow: s.hasBow, arrows: s.arrows, food: s.food, respawn: s.respawn, wi: s.wi || 0,
      });
      if (s.weapons && s.weapons.length) p.weapons = s.weapons.map(sw => {
        const key = typeof sw === 'string' ? sw : sw.key;   // tolerate the old key-only format
        const w = makeWeapon(key);
        if (sw && typeof sw === 'object' && typeof sw.dur === 'number' && sw.dur >= 0 && isFinite(w.maxDur)) w.dur = clamp(sw.dur, 0, w.maxDur);
        return w;
      });
      if (p.weapons.length === 0) p.weapons = [makeWeapon('sword')];
      p.wi = clamp(p.wi, 0, p.weapons.length - 1);
      this.dayNight.time = d.dn.time; this.dayNight.day = d.dn.day;
      d.towers.forEach((v, i) => { if (this.world.structures.towers[i]) this.world.structures.towers[i].activated = !!v; });
      d.shrines.forEach((v, i) => { if (this.world.structures.shrines[i]) this.world.structures.shrines[i].activated = !!v; });
      d.chests.forEach((v, i) => { if (this.world.structures.chests[i]) this.world.structures.chests[i].opened = !!v; });
      d.koroks.forEach((v, i) => { if (this.world.structures.koroks[i]) this.world.structures.koroks[i].done = !!v; });
      if (d.talus) d.talus.forEach((v, i) => { if (this.world.structures.talus[i]) this.world.structures.talus[i].defeated = !!v; });
      if (d.reveal) this._unpackReveal(d.reveal);
      this._centerCamera();
      this.toast('Save loaded.');
    } catch (e) { /* corrupt save -> ignore */ }
  }
  _clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
}


/* ===== js/main.js ===== */
'use strict';
/* main.js — bootstraps the canvas and runs the fixed-cap game loop. */

(function () {
  const canvas = document.getElementById('game');
  const game = new Game(canvas);
  window.GAME = game; // handy for debugging

  function fit() { game.resize(); }
  window.addEventListener('resize', fit);
  fit();

  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';

  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 60;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1; // clamp after tab-out
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 5) { game.update(STEP); acc -= STEP; guard++; }
    if (guard >= 5) acc = 0; // avoid spiral of death
    game.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
