<title>Wilderland — Breath of the Top-Down</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05080c;
  font-family: 'Courier New', monospace;
  -webkit-user-select: none;
  user-select: none;
}

#wrap {
  position: fixed;
  inset: 0;
  display: block;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #0b1016;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
  touch-action: none;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #cfe0ea;
  font-size: 20px;
  letter-spacing: 1px;
  background: #0b1016;
  z-index: 10;
}

#hint {
  position: absolute;
  left: 50%;
  bottom: 6px;
  transform: translateX(-50%);
  color: rgba(200, 220, 235, 0.35);
  font-size: 11px;
  pointer-events: none;
  z-index: 5;
  white-space: nowrap;
  animation: fadeHint 1s ease 12s forwards;
}

@keyframes fadeHint { to { opacity: 0; } }

/* ---------- Touch controls ---------- */
body.touch #hint { display: none; }

#touch {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;      /* empty areas pass taps through to the canvas */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* gameplay controls appear only while playing */
#touch .joy,
#touch .actions,
#touch .lbtns,
#touch .topbtns { display: none; }
#touch.ingame .joy,
#touch.ingame .actions,
#touch.ingame .lbtns,
#touch.ingame .topbtns { display: block; }

#touch .joy {
  position: absolute;
  left: max(18px, env(safe-area-inset-left));
  bottom: max(22px, env(safe-area-inset-bottom));
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: rgba(230, 240, 250, 0.08);
  border: 2px solid rgba(200, 225, 240, 0.28);
  pointer-events: auto;
  touch-action: none;
}
#touch .knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 58px;
  margin: -29px 0 0 -29px;
  border-radius: 50%;
  background: rgba(210, 230, 245, 0.28);
  border: 2px solid rgba(220, 235, 248, 0.5);
  will-change: transform;
}

#touch .actions {
  position: absolute;
  right: max(14px, env(safe-area-inset-right));
  bottom: max(18px, env(safe-area-inset-bottom));
  width: 196px;
  height: 196px;
}
#touch .lbtns {
  position: absolute;
  left: max(18px, env(safe-area-inset-left));
  bottom: 168px;
  display: flex;
  gap: 10px;
}
#touch .topbtns {
  position: absolute;
  right: max(12px, env(safe-area-inset-right));
  top: 32%;                    /* right edge, mid-height: clear of the info panel and action cluster */
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#touch .tbtn {
  pointer-events: auto;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(30, 40, 52, 0.5);
  border: 2px solid rgba(180, 210, 230, 0.35);
  color: #eaf2f8;
  font: bold 18px 'Courier New', monospace;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  transition: transform 0.05s, background 0.05s;
}
#touch .tbtn.on { background: rgba(90, 150, 180, 0.75); transform: scale(0.92); }

/* action cluster placement (right thumb) */
#touch .actions .tbtn { position: absolute; }
#touch .actions .atk   { right: 4px;   bottom: 4px;   width: 78px; height: 78px; font-size: 26px; background: rgba(70, 120, 90, 0.55); }
#touch .actions .act   { right: 90px;  bottom: 14px;  width: 60px; height: 60px; background: rgba(70, 95, 140, 0.55); }
#touch .actions .dodge { right: 4px;   bottom: 88px;  width: 54px; height: 54px; font-size: 22px; background: rgba(110, 140, 175, 0.55); }
#touch .actions .bow   { right: 66px;  bottom: 78px;  width: 50px; height: 50px; }
#touch .actions .bomb  { right: 120px; bottom: 40px;  width: 48px; height: 48px; }
#touch .actions .swap  { right: 150px; bottom: 96px;  width: 44px; height: 44px; font-size: 16px; }

/* left helper + top buttons */
#touch .lbtns .tbtn { width: 56px; height: 44px; border-radius: 12px; font-size: 13px; }
#touch .lbtns .run.on { background: rgba(120, 190, 90, 0.8); }
#touch .topbtns .tbtn { width: 54px; height: 40px; border-radius: 10px; font-size: 14px; }

/* awaken button by the KI gauge (left-middle), dim until ready */
#touch .awakenbtn {
  position: absolute;
  left: 34px;
  top: calc(50% + 84px);
  width: 52px; height: 52px;
  font-size: 22px;
  color: #ffe98a;
  background: rgba(60, 50, 24, 0.5);
  border-color: rgba(200, 170, 80, 0.4);
  opacity: 0.45;
}
#touch .awakenbtn.ready {
  opacity: 1;
  background: rgba(150, 110, 30, 0.75);
  border-color: rgba(255, 220, 120, 0.9);
  box-shadow: 0 0 14px rgba(255, 210, 90, 0.7);
  animation: awakenPulse 1s ease-in-out infinite;
}
@keyframes awakenPulse { 50% { box-shadow: 0 0 22px rgba(255, 220, 120, 0.95); } }

@media (max-height: 460px) {
  #touch .joy { width: 108px; height: 108px; }
  #touch .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #touch .actions { width: 168px; height: 168px; }
  #touch .lbtns { bottom: 140px; }
}

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="loading">Generating Wilderland…</div>
  <div id="hint">WASD move · Shift sprint · J attack · E interact · M map · Esc pause</div>
</div>
<script>
'use strict';

/* ===== js/core/util.js ===== */
'use strict';
/* util.js — math, vectors, collision, color and misc helpers.
   Loaded as a classic script; all names below are shared globals. */

const TAU = Math.PI * 2;
const HALF_PI = Math.PI / 2;

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function invlerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
function smoothstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function sqr(v) { return v * v; }

function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
function vlen(x, y) { return Math.hypot(x, y); }
function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d < -Math.PI) d += TAU; if (d > Math.PI) d -= TAU; return d; }
function approach(cur, target, step) {
  if (cur < target) return Math.min(cur + step, target);
  if (cur > target) return Math.max(cur - step, target);
  return cur;
}
function approachAngle(cur, target, step) {
  const d = angDiff(cur, target);
  if (Math.abs(d) <= step) return target;
  return cur + sign(d) * step;
}

// Normalize a 2D vector; returns {x,y} unit vector (0,0 stays 0,0).
function normalize(x, y) {
  const l = Math.hypot(x, y);
  if (l < 1e-8) return { x: 0, y: 0 };
  return { x: x / l, y: y / l };
}

// Axis-aligned overlap tests
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function pointInRect(px, py, rx, ry, rw, rh) {
  return px >= rx && px < rx + rw && py >= ry && py < ry + rh;
}
// Distance from circle center to the nearest point of a rect (0 if inside).
function circleRectDist(cx, cy, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  return dist(cx, cy, nx, ny);
}
function circleRectOverlap(cx, cy, r, rx, ry, rw, rh) {
  return circleRectDist(cx, cy, rx, ry, rw, rh) < r;
}
function circlesOverlap(ax, ay, ar, bx, by, br) {
  const rr = ar + br; return dist2(ax, ay, bx, by) < rr * rr;
}

// Facing: convert a direction vector into one of 'down','up','left','right'
function facingFromVec(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 'left' : 'right';
  return dy < 0 ? 'up' : 'down';
}
function vecFromFacing(f) {
  switch (f) {
    case 'up': return { x: 0, y: -1 };
    case 'down': return { x: 0, y: 1 };
    case 'left': return { x: -1, y: 0 };
    case 'right': return { x: 1, y: 0 };
  }
  return { x: 0, y: 1 };
}

/* -------- Color helpers (work on {r,g,b}) -------- */
function rgb(r, g, b) { return `rgb(${r | 0},${g | 0},${b | 0})`; }
function rgba(r, g, b, a) { return `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function mixRGB(a, b, t) {
  return { r: lerp(a.r, b.r, t), g: lerp(a.g, b.g, t), b: lerp(a.b, b.b, t) };
}
function shade(c, amt) {
  // amt in [-1,1]; negative darkens, positive lightens
  if (amt >= 0) return { r: lerp(c.r, 255, amt), g: lerp(c.g, 255, amt), b: lerp(c.b, 255, amt) };
  return { r: lerp(c.r, 0, -amt), g: lerp(c.g, 0, -amt), b: lerp(c.b, 0, -amt) };
}
function css(c, a) { return a === undefined ? rgb(c.r, c.g, c.b) : rgba(c.r, c.g, c.b, a); }

// Cheap deterministic hash -> [0,1)
function hash01(x, y, seed) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (seed | 0) * 2246822519;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0 ? ((h ^ (h >>> 16)) >>> 0) / 4294967296 : 0;
}

function formatClock(hours) {
  // hours in [0,24)
  let h = Math.floor(hours) % 24;
  const m = Math.floor((hours - Math.floor(hours)) * 60);
  const ampm = h < 12 ? 'AM' : 'PM';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${hh}:${m < 10 ? '0' + m : m} ${ampm}`;
}

// Round a world position to the nearest device pixel for crisp rendering.
function pxSnap(v, zoom) { return Math.round(v * zoom) / zoom; }


/* ===== js/core/rng.js ===== */
'use strict';
/* rng.js — seeded pseudo-random number generator and value/fractal noise. */

class RNG {
  constructor(seed) {
    this.s = (seed >>> 0) || 1;
  }
  // mulberry32
  next() {
    let t = (this.s += 0x6D2B79F5) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(lo, hi) { return lo + this.next() * (hi - lo); }
  int(lo, hi) { return Math.floor(this.range(lo, hi + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  sign() { return this.next() < 0.5 ? -1 : 1; }
  angle() { return this.next() * TAU; }
  // random point in a disc of radius r
  inDisc(r) {
    const a = this.angle(), d = Math.sqrt(this.next()) * r;
    return { x: Math.cos(a) * d, y: Math.sin(a) * d };
  }
}

// 2D value noise with fractal (fBm) octaves. Deterministic from seed.
class Noise {
  constructor(seed) {
    this.seed = seed >>> 0;
  }
  _v(ix, iy) {
    // hashed gradient value in [-1,1]
    let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(this.seed, 2246822519);
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return (h / 4294967296) * 2 - 1;
  }
  value(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const v00 = this._v(x0, y0), v10 = this._v(x0 + 1, y0);
    const v01 = this._v(x0, y0 + 1), v11 = this._v(x0 + 1, y0 + 1);
    const a = v00 + (v10 - v00) * sx;
    const b = v01 + (v11 - v01) * sx;
    return a + (b - a) * sy; // in [-1,1]
  }
  // fractal Brownian motion; returns approx [-1,1]
  fbm(x, y, octaves, lacunarity, gain) {
    octaves = octaves || 4; lacunarity = lacunarity || 2; gain = gain || 0.5;
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < octaves; i++) {
      sum += amp * this.value(x * freq, y * freq);
      norm += amp;
      amp *= gain; freq *= lacunarity;
    }
    return sum / norm;
  }
  // normalized [0,1] fbm
  fbm01(x, y, octaves, lacunarity, gain) {
    return this.fbm(x, y, octaves, lacunarity, gain) * 0.5 + 0.5;
  }
}


/* ===== js/core/input.js ===== */
'use strict';
/* input.js — keyboard + mouse state with edge detection.
   Query held state any time; edge (wasPressed) is cleared once per frame
   via lateUpdate(), which the game loop calls after update(). */

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.down = Object.create(null);     // code -> true while held
    this.pressed = Object.create(null);  // code -> true for the frame it went down
    this.released = Object.create(null); // code -> true for the frame it went up
    this.mouse = { x: 0, y: 0, sx: 0, sy: 0, left: false, right: false, leftPressed: false, rightPressed: false, wheel: 0, moved: false };
    this.touchMove = { x: 0, y: 0 };     // virtual joystick direction (unit vector, 0 when idle)
    this.tap = null;                     // {x,y} canvas-relative tap, consumed by menus
    this.anyInteraction = false;         // true once the user has interacted (for audio unlock)
    this._blockKeys = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab',
      'KeyW', 'KeyA', 'KeyS', 'KeyD'
    ]);
    this._bind();
  }

  _bind() {
    window.addEventListener('keydown', (e) => {
      if (this._blockKeys.has(e.code)) e.preventDefault();
      this.anyInteraction = true;
      if (!this.down[e.code]) this.pressed[e.code] = true;
      this.down[e.code] = true;
    });
    window.addEventListener('keyup', (e) => {
      this.down[e.code] = false;
      this.released[e.code] = true;
    });
    // Lose focus -> release everything to avoid stuck keys.
    window.addEventListener('blur', () => this.clearAll());

    const c = this.canvas;
    c.addEventListener('mousemove', (e) => this._updateMouse(e));
    c.addEventListener('mousedown', (e) => {
      this.anyInteraction = true;
      this._updateMouse(e);
      if (e.button === 0) { this.mouse.left = true; this.mouse.leftPressed = true; }
      if (e.button === 2) { this.mouse.right = true; this.mouse.rightPressed = true; }
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) this.mouse.left = false;
      if (e.button === 2) this.mouse.right = false;
    });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    c.addEventListener('wheel', (e) => { this.mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    // Touch on empty canvas area = a tap (menus/confirm). Touches on the on-screen
    // controls target those DOM elements instead, so they don't land here.
    c.addEventListener('touchstart', (e) => {
      this.anyInteraction = true;
      const t = e.changedTouches[0];
      const r = this.canvas.getBoundingClientRect();
      this.tap = { x: t.clientX - r.left, y: t.clientY - r.top };
    }, { passive: true });
  }

  // Synthesize a key press/release (used by on-screen touch buttons).
  pressKey(code) { if (!this.down[code]) this.pressed[code] = true; this.down[code] = true; this.anyInteraction = true; }
  releaseKey(code) { this.down[code] = false; this.released[code] = true; }

  _updateMouse(e) {
    const r = this.canvas.getBoundingClientRect();
    this.mouse.sx = e.clientX - r.left;
    this.mouse.sy = e.clientY - r.top;
    this.mouse.moved = true;
  }

  clearAll() {
    for (const k in this.down) this.down[k] = false;
    this.mouse.left = this.mouse.right = false;
  }

  // Called after the frame's update() so edges last exactly one frame.
  lateUpdate() {
    this.pressed = Object.create(null);
    this.released = Object.create(null);
    this.mouse.leftPressed = false;
    this.mouse.rightPressed = false;
    this.mouse.wheel = 0;
    this.tap = null;
  }

  isDown(...codes) { for (const c of codes) if (this.down[c]) return true; return false; }
  wasPressed(...codes) { for (const c of codes) if (this.pressed[c]) return true; return false; }
  wasReleased(...codes) { for (const c of codes) if (this.released[c]) return true; return false; }
  // Clear a pressed edge so no later consumer in the same frame reacts to it.
  consume(...codes) { for (const c of codes) this.pressed[c] = false; }

  // Movement vector from WASD / arrows (normalized on the diagonal). The virtual
  // joystick, when active, overrides the keyboard.
  moveVector() {
    const tm = this.touchMove;
    if (tm && (tm.x !== 0 || tm.y !== 0)) return { x: tm.x, y: tm.y };
    let x = 0, y = 0;
    if (this.isDown('KeyA', 'ArrowLeft')) x -= 1;
    if (this.isDown('KeyD', 'ArrowRight')) x += 1;
    if (this.isDown('KeyW', 'ArrowUp')) y -= 1;
    if (this.isDown('KeyS', 'ArrowDown')) y += 1;
    if (x !== 0 && y !== 0) { const inv = Math.SQRT1_2; x *= inv; y *= inv; }
    return { x, y };
  }
}


/* ===== js/core/touch.js ===== */
'use strict';
/* touch.js — on-screen controls for touch devices: a left virtual joystick for
   movement and right-hand action buttons. Buttons synthesize key presses so the
   rest of the game reads input exactly as it does for a keyboard. */

class TouchControls {
  constructor(input, game) {
    this.input = input;
    this.game = game;
    this.enabled = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    this._joyId = null;
    this._joyRect = null;
    if (!this.enabled) return;
    document.body.classList.add('touch');
    this._build();
    // Unlock audio on the first touch anywhere (must be inside a gesture).
    window.addEventListener('touchstart', () => this.game.audio.unlock(), { passive: true });
  }

  _build() {
    const wrap = document.getElementById('wrap') || document.body;
    const root = document.createElement('div');
    root.id = 'touch';
    wrap.appendChild(root);
    this.root = root;

    // --- joystick ---
    const joy = document.createElement('div'); joy.className = 'joy';
    const knob = document.createElement('div'); knob.className = 'knob';
    joy.appendChild(knob); root.appendChild(joy);
    this.joy = joy; this.knob = knob;
    this._bindJoystick();

    // --- right-hand action cluster ---
    const actions = document.createElement('div'); actions.className = 'actions'; root.appendChild(actions);
    this._btn(actions, 'atk', 'A', 'KeyJ');    // attack
    this._btn(actions, 'act', 'E', 'KeyE');    // interact / activate
    this._btn(actions, 'dodge', '↻', 'Space'); // dodge roll
    this._btn(actions, 'bow', '➹', 'KeyK');    // bow
    this._btn(actions, 'bomb', '✸', 'KeyB');   // bomb
    this._btn(actions, 'swap', '⟳', 'KeyQ');   // cycle weapon

    // --- left helpers near the joystick ---
    const left = document.createElement('div'); left.className = 'lbtns'; root.appendChild(left);
    this._btn(left, 'run', 'RUN', 'ShiftLeft', { toggle: true }); // sprint (toggle)
    this._btn(left, 'eat', 'EAT', 'KeyF');

    // --- awaken button by the power gauge (only lights up when ready) ---
    this.awakenBtn = this._btn(root, 'awaken', '⚡', 'KeyR');
    this.awakenBtn.classList.add('awakenbtn');

    // --- top-right system buttons ---
    const top = document.createElement('div'); top.className = 'topbtns'; root.appendChild(top);
    this._btn(top, 'map', 'MAP', 'KeyM');
    this._btn(top, 'menu', '❚❚', 'Escape');
  }

  _btn(parent, cls, label, code, opts) {
    opts = opts || {};
    const b = document.createElement('div');
    b.className = 'tbtn ' + cls;
    b.textContent = label;
    parent.appendChild(b);

    const press = (e) => {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      this.game.audio.unlock();
      if (opts.toggle) {
        const on = !b.classList.contains('on');
        b.classList.toggle('on', on);
        this.input.down[code] = on; // held while toggled on
      } else {
        this.input.pressKey(code);
        b.classList.add('on');
      }
    };
    const release = (e) => {
      if (e) e.preventDefault();
      if (!opts.toggle) { this.input.releaseKey(code); b.classList.remove('on'); }
    };
    b.addEventListener('touchstart', press, { passive: false });
    b.addEventListener('touchend', release, { passive: false });
    b.addEventListener('touchcancel', release, { passive: false });
    // mouse fallback so the controls are testable on desktop
    b.addEventListener('mousedown', press);
    b.addEventListener('mouseup', release);
    b.addEventListener('mouseleave', (e) => { if (b.classList.contains('on') && !opts.toggle) release(e); });
    return b;
  }

  _bindJoystick() {
    const joy = this.joy, knob = this.knob;
    const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px, ${dy}px)`; };
    const reset = () => { setKnob(0, 0); this.input.touchMove.x = 0; this.input.touchMove.y = 0; this._joyId = null; };

    const move = (cx, cy) => {
      const r = this._joyRect || joy.getBoundingClientRect();
      const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
      const dx = cx - ox, dy = cy - oy;
      const m = Math.hypot(dx, dy);
      const maxR = r.width * 0.36;
      const cl = Math.min(m, maxR);
      const ux = m > 0.0001 ? dx / m : 0, uy = m > 0.0001 ? dy / m : 0;
      setKnob(ux * cl, uy * cl);
      if (m > 8) { this.input.touchMove.x = ux; this.input.touchMove.y = uy; }
      else { this.input.touchMove.x = 0; this.input.touchMove.y = 0; }
    };

    joy.addEventListener('touchstart', (e) => {
      e.preventDefault(); this.game.audio.unlock();
      this._joyRect = joy.getBoundingClientRect();
      const t = e.changedTouches[0];
      this._joyId = t.identifier;
      move(t.clientX, t.clientY);
    }, { passive: false });
    joy.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === this._joyId) move(t.clientX, t.clientY);
    }, { passive: false });
    const end = (e) => { for (const t of e.changedTouches) if (t.identifier === this._joyId) { reset(); } };
    joy.addEventListener('touchend', end, { passive: false });
    joy.addEventListener('touchcancel', end, { passive: false });

    // mouse fallback (desktop testing)
    let md = false;
    joy.addEventListener('mousedown', (e) => { md = true; this._joyRect = joy.getBoundingClientRect(); move(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => { if (md) move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { if (md) { md = false; reset(); } });
  }

  // Show gameplay controls only while actually playing.
  sync(state) {
    if (!this.enabled) return;
    this.root.classList.toggle('ingame', state === 'playing');
    if (this.awakenBtn && this.game.player) this.awakenBtn.classList.toggle('ready', this.game.player.canAwaken() || this.game.player.awaken > 0);
    if (state !== 'playing') { this.input.touchMove.x = 0; this.input.touchMove.y = 0; if (this.knob) this.knob.style.transform = 'translate(0,0)'; }
  }
}


/* ===== js/core/audio.js ===== */
'use strict';
/* audio.js — procedural sound effects and gentle ambient music via WebAudio.
   Nothing is loaded from the network. All sounds are synthesized. */

class AudioFX {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.muted = false;
    this.musicOn = true;
    this.started = false;
    this._noiseBuf = null;
    this._musicTimer = 0;
    this._step = 0;
  }

  // Must be called from within a user gesture (browsers block otherwise).
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ctx.destination);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.7;
    this.sfxGain.connect(this.master);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.0;
    this.musicGain.connect(this.master);
    // pre-build a noise buffer
    const n = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this._noiseBuf = buf;
    this.started = true;
    if (this.musicOn) this.musicGain.gain.linearRampToValueAtTime(0.32, this.ctx.currentTime + 3);
  }

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.9;
  }
  toggleMute() { this.setMuted(!this.muted); return this.muted; }

  toggleMusic() {
    this.musicOn = !this.musicOn;
    if (this.musicGain) {
      const t = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(t);
      this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
      this.musicGain.gain.linearRampToValueAtTime(this.musicOn ? 0.32 : 0.0, t + 1.2);
    }
    return this.musicOn;
  }

  _osc(type, freq, t0, dur, gainPeak, dest, detune) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (detune) o.detune.setValueAtTime(detune, t0);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gainPeak), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.02);
    return { o, g };
  }

  _noise(t0, dur, gainPeak, filterType, freq, dest) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = filterType || 'bandpass';
    f.frequency.setValueAtTime(freq || 1200, t0);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(dest || this.sfxGain);
    src.start(t0); src.stop(t0 + dur + 0.02);
    return { src, f, g };
  }

  play(name) {
    if (!this.started || this.muted) return;
    const ctx = this.ctx;
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    switch (name) {
      case 'swing': {
        this._noise(t, 0.16, 0.25, 'bandpass', 1700, this.sfxGain);
        const s = this._noise(t, 0.16, 0.2, 'highpass', 900, this.sfxGain);
        s.f.frequency.exponentialRampToValueAtTime(400, t + 0.16);
        break;
      }
      case 'hit': {
        this._noise(t, 0.12, 0.4, 'bandpass', 500, this.sfxGain);
        this._osc('square', 160, t, 0.1, 0.18);
        break;
      }
      case 'hurt': {
        const s = this._osc('sawtooth', 320, t, 0.28, 0.28);
        s.o.frequency.exponentialRampToValueAtTime(90, t + 0.28);
        break;
      }
      case 'enemyDie': {
        const s = this._osc('square', 300, t, 0.3, 0.22);
        s.o.frequency.exponentialRampToValueAtTime(70, t + 0.3);
        this._noise(t, 0.3, 0.2, 'lowpass', 800, this.sfxGain);
        break;
      }
      case 'pickup': {
        this._osc('triangle', 660, t, 0.09, 0.25);
        this._osc('triangle', 990, t + 0.06, 0.1, 0.22);
        break;
      }
      case 'rupee': {
        this._osc('sine', 1050, t, 0.08, 0.2);
        this._osc('sine', 1400, t + 0.05, 0.1, 0.18);
        break;
      }
      case 'heart': {
        this._osc('triangle', 520, t, 0.1, 0.24);
        this._osc('triangle', 780, t + 0.08, 0.12, 0.22);
        this._osc('triangle', 1040, t + 0.16, 0.14, 0.2);
        break;
      }
      case 'korok': {
        const notes = [880, 1174, 1318, 1760];
        notes.forEach((f, i) => this._osc('sine', f, t + i * 0.09, 0.16, 0.22));
        break;
      }
      case 'bow': {
        const s = this._osc('triangle', 220, t, 0.12, 0.2);
        s.o.frequency.exponentialRampToValueAtTime(520, t + 0.12);
        this._noise(t, 0.08, 0.12, 'highpass', 2000, this.sfxGain);
        break;
      }
      case 'bomb': {
        this._osc('sine', 440, t, 0.06, 0.16);
        break;
      }
      case 'explode': {
        const s = this._noise(t, 0.5, 0.6, 'lowpass', 900, this.sfxGain);
        s.f.frequency.exponentialRampToValueAtTime(120, t + 0.5);
        const o = this._osc('sine', 90, t, 0.4, 0.4);
        o.o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
        break;
      }
      case 'menu': { this._osc('square', 440, t, 0.05, 0.14); break; }
      case 'select': { this._osc('square', 660, t, 0.07, 0.16); break; }
      case 'activate': {
        const notes = [523, 659, 784, 1047];
        notes.forEach((f, i) => this._osc('sine', f, t + i * 0.12, 0.4, 0.2, this.sfxGain));
        break;
      }
      case 'break': {
        this._noise(t, 0.2, 0.35, 'highpass', 1500, this.sfxGain);
        break;
      }
      case 'climb': {
        this._noise(t, 0.07, 0.12, 'bandpass', 700, this.sfxGain);
        break;
      }
      case 'splash': {
        this._noise(t, 0.25, 0.3, 'lowpass', 1400, this.sfxGain);
        break;
      }
      case 'glide': {
        const s = this._osc('sine', 300, t, 0.5, 0.1);
        s.o.frequency.linearRampToValueAtTime(360, t + 0.5);
        break;
      }
    }
  }

  // Ambient, sparse exploration melody (pentatonic) — called each frame with dt.
  updateMusic(dt, nightAmt) {
    if (!this.started || !this.musicOn) return;
    this._musicTimer -= dt;
    if (this._musicTimer > 0) return;
    this._musicTimer = 2.1; // seconds between phrases
    const ctx = this.ctx, t = ctx.currentTime;
    // Pentatonic scale (A minor pentatonic-ish), lower & sparser at night.
    const scale = nightAmt > 0.5
      ? [220, 261.63, 293.66, 349.23, 392]
      : [329.63, 392, 440, 523.25, 587.33];
    this._step = (this._step + 1) % 8;
    const rootIdx = (this._step * 3) % scale.length;
    const f = scale[rootIdx];
    // soft plucked note
    const o = this._osc('triangle', f, t, 1.6, 0.16, this.musicGain);
    o.g.gain.cancelScheduledValues(t);
    o.g.gain.setValueAtTime(0.0001, t);
    o.g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
    o.g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    // occasional harmony a fifth up
    if (this._step % 2 === 0) {
      this._osc('sine', f * 1.5, t + 0.25, 1.2, 0.08, this.musicGain);
    }
    // low pad
    if (this._step % 4 === 0) {
      this._osc('sine', f / 2, t, 2.0, 0.1, this.musicGain);
    }
  }
}


/* ===== js/core/sprites.js ===== */
'use strict';
/* sprites.js — procedurally paints static-object and item sprites onto
   offscreen canvases once at startup. Objects are drawn many times per
   frame, so caching them as bitmaps is far cheaper than re-painting. */

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return { c, ctx };
}

class SpriteBank {
  constructor() {
    this.rng = new RNG(1337);
    this.o = {};      // objects: name -> [variant canvases], anchor bottom-center
    this.icon = {};   // items: name -> canvas (anchor center)
    this._build();
  }

  R(a, b) { return this.rng.range(a, b); }

  _put(name, canvas, feetY) {
    if (!this.o[name]) this.o[name] = [];
    canvas._feetY = feetY === undefined ? canvas.height : feetY;
    this.o[name].push(canvas);
  }

  variant(name, i) {
    const arr = this.o[name];
    if (!arr || !arr.length) return null;
    return arr[i % arr.length];
  }

  _build() {
    this._trees();
    this._pines();
    this._bushes();
    this._rocks();
    this._boulders();
    this._grassTufts();
    this._flowers();
    this._stump();
    this._chest();
    this._campfire();
    this._tower();
    this._shrine();
    this._cookpot();
    this._icons();
  }

  _trees() {
    for (let v = 0; v < 3; v++) {
      const w = 34, h = 44;
      const { c, ctx } = makeCanvas(w, h);
      // trunk
      ctx.fillStyle = '#6b4a2b';
      ctx.fillRect(w / 2 - 3, h - 14, 6, 14);
      ctx.fillStyle = '#5a3d22';
      ctx.fillRect(w / 2 - 3, h - 14, 2, 14);
      // canopy: layered blobs
      const greens = [['#2f6b34', '#3f8a41', '#57a54f'], ['#345f2c', '#4a7d3a', '#67a24d'], ['#2c6b4a', '#3c8a5f', '#54a56f']][v];
      const cx = w / 2, cy = 16;
      const blobs = [[cx, cy, 15], [cx - 8, cy + 4, 11], [cx + 8, cy + 4, 11], [cx, cy + 9, 13], [cx - 5, cy - 6, 9], [cx + 5, cy - 6, 9]];
      ctx.fillStyle = greens[0];
      for (const [bx, by, r] of blobs) { ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill(); }
      ctx.fillStyle = greens[1];
      for (const [bx, by, r] of blobs) { ctx.beginPath(); ctx.arc(bx - 1, by - 1, r * 0.72, 0, TAU); ctx.fill(); }
      // highlights
      ctx.fillStyle = greens[2];
      for (let i = 0; i < 20; i++) {
        const a = this.R(0, TAU), rr = this.R(2, 12);
        ctx.beginPath(); ctx.arc(cx - 2 + Math.cos(a) * rr, cy - 3 + Math.sin(a) * rr * 0.8, this.R(1.2, 2.4), 0, TAU); ctx.fill();
      }
      this._put('tree', c, h - 3);
    }
  }

  _pines() {
    for (let v = 0; v < 2; v++) {
      const w = 26, h = 46;
      const { c, ctx } = makeCanvas(w, h);
      ctx.fillStyle = '#5a3d22';
      ctx.fillRect(w / 2 - 2, h - 10, 4, 10);
      const dark = v ? '#20492e' : '#1f4a3a';
      const lite = v ? '#347044' : '#2f6b52';
      const cx = w / 2;
      for (let layer = 0; layer < 4; layer++) {
        const ly = 6 + layer * 8;
        const lw = 6 + layer * 4.5;
        ctx.fillStyle = dark;
        ctx.beginPath();
        ctx.moveTo(cx, ly - 8);
        ctx.lineTo(cx - lw, ly + 6);
        ctx.lineTo(cx + lw, ly + 6);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = lite;
        ctx.beginPath();
        ctx.moveTo(cx, ly - 6);
        ctx.lineTo(cx - lw * 0.55, ly + 4);
        ctx.lineTo(cx + lw * 0.3, ly + 4);
        ctx.closePath(); ctx.fill();
      }
      this._put('pine', c, h - 2);
    }
  }

  _bushes() {
    for (let v = 0; v < 3; v++) {
      const w = 24, h = 20;
      const { c, ctx } = makeCanvas(w, h);
      const base = ['#3f7d3a', '#4a7d3a', '#57893f'][v];
      const hi = ['#5aa552', '#67a24d', '#78b05a'][v];
      ctx.fillStyle = base;
      const blobs = [[8, 12, 8], [16, 12, 8], [12, 9, 9], [6, 14, 6], [18, 14, 6]];
      for (const [bx, by, r] of blobs) { ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill(); }
      ctx.fillStyle = hi;
      for (let i = 0; i < 12; i++) ctx.fillRect(this.R(4, 20), this.R(4, 12), 2, 2);
      // occasional berries
      if (v === 2) { ctx.fillStyle = '#d8464f'; for (let i = 0; i < 4; i++) ctx.fillRect(this.R(6, 18), this.R(6, 13), 2, 2); }
      this._put('bush', c, h - 2);
    }
  }

  _rocks() {
    for (let v = 0; v < 3; v++) {
      const w = 22, h = 18;
      const { c, ctx } = makeCanvas(w, h);
      ctx.fillStyle = '#8b857e';
      ctx.beginPath();
      ctx.moveTo(3, h - 2); ctx.lineTo(2, 9); ctx.lineTo(8, 3); ctx.lineTo(15, 4); ctx.lineTo(20, 10); ctx.lineTo(19, h - 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a49e97';
      ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(11, 5); ctx.lineTo(15, 8); ctx.lineTo(12, 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6f6a64';
      ctx.fillRect(4, h - 5, 14, 3);
      this._put('rock', c, h - 1);
    }
  }

  _boulders() {
    for (let v = 0; v < 2; v++) {
      const w = 40, h = 34;
      const { c, ctx } = makeCanvas(w, h);
      ctx.fillStyle = '#7d766e';
      ctx.beginPath();
      ctx.moveTo(4, h - 2); ctx.lineTo(2, 16); ctx.lineTo(12, 4); ctx.lineTo(26, 3); ctx.lineTo(37, 14); ctx.lineTo(36, h - 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#948d84';
      ctx.beginPath(); ctx.moveTo(10, 14); ctx.lineTo(20, 8); ctx.lineTo(28, 15); ctx.lineTo(20, 22); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#635d57';
      ctx.fillRect(6, h - 6, 28, 4);
      // crack (breakable hint)
      ctx.strokeStyle = '#4a453f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(20, 6); ctx.lineTo(18, 16); ctx.lineTo(22, 24); ctx.stroke();
      this._put('boulder', c, h - 1);
    }
  }

  _grassTufts() {
    for (let v = 0; v < 3; v++) {
      const w = 16, h = 14;
      const { c, ctx } = makeCanvas(w, h);
      const col = ['#6fae4a', '#7bbb52', '#84c25a'][v];
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const x = 3 + i * 2;
        ctx.beginPath(); ctx.moveTo(x, h - 1); ctx.quadraticCurveTo(x + this.R(-2, 2), h - 7, x + this.R(-3, 3), 2); ctx.stroke();
      }
      this._put('grass', c, h - 1);
    }
  }

  _flowers() {
    const cols = ['#e46b9a', '#e8d24a', '#7aa6e8', '#f28d5a'];
    for (let v = 0; v < 3; v++) {
      const w = 16, h = 14;
      const { c, ctx } = makeCanvas(w, h);
      ctx.strokeStyle = '#4f8a3f'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const x = 4 + i * 4, col = cols[(v + i) % cols.length];
        ctx.beginPath(); ctx.moveTo(x, h - 1); ctx.lineTo(x, 5); ctx.stroke();
        ctx.fillStyle = col;
        for (let p = 0; p < 4; p++) { const a = p / 4 * TAU; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 2.2, 5 + Math.sin(a) * 2.2, 1.6, 0, TAU); ctx.fill(); }
        ctx.fillStyle = '#f6e58d'; ctx.beginPath(); ctx.arc(x, 5, 1.4, 0, TAU); ctx.fill();
      }
      this._put('flower', c, h - 1);
    }
  }

  _stump() {
    const w = 18, h = 12;
    const { c, ctx } = makeCanvas(w, h);
    ctx.fillStyle = '#6b4a2b'; ctx.beginPath(); ctx.ellipse(w / 2, h - 4, 7, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8a6339'; ctx.beginPath(); ctx.ellipse(w / 2, h - 6, 6, 3.4, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(w / 2, h - 6, 3, 1.7, 0, 0, TAU); ctx.stroke();
    this._put('stump', c, h - 1);
  }

  _chest() {
    for (let open = 0; open < 2; open++) {
      const w = 26, h = 22;
      const { c, ctx } = makeCanvas(w, h);
      // body
      ctx.fillStyle = '#7a4d24'; ctx.fillRect(3, 9, 20, 12);
      ctx.fillStyle = '#8f5d2c'; ctx.fillRect(4, 10, 18, 10);
      ctx.fillStyle = '#c8a24a'; ctx.fillRect(3, 9, 20, 2); ctx.fillRect(11, 9, 4, 12);
      if (!open) {
        ctx.fillStyle = '#8f5d2c'; ctx.fillRect(3, 3, 20, 7);
        ctx.fillStyle = '#a06a34'; ctx.fillRect(4, 4, 18, 5);
        ctx.fillStyle = '#c8a24a'; ctx.fillRect(3, 3, 20, 2);
        ctx.fillStyle = '#e8cf6a'; ctx.fillRect(11, 8, 4, 4);
      } else {
        ctx.fillStyle = '#5a3a1c'; ctx.fillRect(3, 3, 20, 4); // open lid back
        ctx.fillStyle = '#241a10'; ctx.fillRect(5, 9, 16, 3); // dark interior
        ctx.fillStyle = '#ffe98a'; ctx.globalAlpha = 0.5; ctx.fillRect(6, 8, 14, 2); ctx.globalAlpha = 1;
      }
      this._put(open ? 'chestOpen' : 'chest', c, h - 1);
    }
  }

  _campfire() {
    for (let f = 0; f < 3; f++) {
      const w = 24, h = 22;
      const { c, ctx } = makeCanvas(w, h);
      // logs
      ctx.fillStyle = '#5a3d22'; ctx.fillRect(5, h - 6, 14, 3);
      ctx.save(); ctx.translate(12, h - 5); ctx.rotate(0.5); ctx.fillRect(-7, -1.5, 14, 3); ctx.restore();
      // stones
      ctx.fillStyle = '#8b857e';
      for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; ctx.beginPath(); ctx.arc(12 + Math.cos(a) * 8, h - 4 + Math.sin(a) * 3, 2.2, 0, TAU); ctx.fill(); }
      // flame
      const flick = f * 1.7;
      ctx.fillStyle = '#e8622a';
      ctx.beginPath(); ctx.moveTo(12, h - 20 - (f === 1 ? 2 : 0)); ctx.quadraticCurveTo(6 - flick, h - 10, 12, h - 6); ctx.quadraticCurveTo(18 + flick, h - 10, 12, h - 20 - (f === 1 ? 2 : 0)); ctx.fill();
      ctx.fillStyle = '#f4a63a';
      ctx.beginPath(); ctx.moveTo(12, h - 15); ctx.quadraticCurveTo(8, h - 9, 12, h - 6); ctx.quadraticCurveTo(16, h - 9, 12, h - 15); ctx.fill();
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath(); ctx.arc(12, h - 9, 2, 0, TAU); ctx.fill();
      this._put('campfire', c, h - 2);
    }
  }

  _tower() {
    const w = 44, h = 96;
    const { c, ctx } = makeCanvas(w, h);
    const cx = w / 2;
    // shadowed base
    ctx.fillStyle = '#2b3340'; ctx.fillRect(cx - 9, 12, 18, h - 12);
    ctx.fillStyle = '#39424f'; ctx.fillRect(cx - 8, 12, 14, h - 12);
    ctx.fillStyle = '#4a5563'; ctx.fillRect(cx - 8, 12, 5, h - 12);
    // ancient teal accents
    ctx.fillStyle = '#3fd0c8';
    for (let y = 20; y < h - 6; y += 12) { ctx.fillRect(cx - 8, y, 14, 2); }
    ctx.fillRect(cx - 2, 14, 4, h - 20);
    // top platform
    ctx.fillStyle = '#2b3340'; ctx.fillRect(cx - 13, 6, 26, 10);
    ctx.fillStyle = '#4a5563'; ctx.fillRect(cx - 13, 6, 26, 3);
    // orange guidance light orb
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(cx, 6, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe0a0'; ctx.beginPath(); ctx.arc(cx, 6, 2, 0, TAU); ctx.fill();
    this._put('tower', c, h - 2);
  }

  _shrine() {
    for (let active = 0; active < 2; active++) {
      const w = 40, h = 40;
      const { c, ctx } = makeCanvas(w, h);
      const cx = w / 2;
      // base pedestal
      ctx.fillStyle = '#2c3038'; ctx.fillRect(cx - 14, h - 12, 28, 12);
      ctx.fillStyle = '#3a3f49'; ctx.fillRect(cx - 12, h - 12, 24, 3);
      // dome / structure
      ctx.fillStyle = '#33383f';
      ctx.beginPath(); ctx.moveTo(cx - 12, h - 12); ctx.lineTo(cx - 8, 10); ctx.lineTo(cx + 8, 10); ctx.lineTo(cx + 12, h - 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#454b54';
      ctx.beginPath(); ctx.moveTo(cx - 8, 10); ctx.lineTo(cx, 4); ctx.lineTo(cx + 8, 10); ctx.closePath(); ctx.fill();
      // glowing entrance
      const glow = active ? '#3fd8ff' : '#e08a3a';
      ctx.fillStyle = glow;
      ctx.fillRect(cx - 4, h - 22, 8, 12);
      ctx.fillStyle = active ? '#bff2ff' : '#ffd9a0';
      ctx.fillRect(cx - 2, h - 20, 4, 8);
      // accent lines
      ctx.strokeStyle = glow; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - 10, 14); ctx.lineTo(cx - 10, h - 14); ctx.moveTo(cx + 10, 14); ctx.lineTo(cx + 10, h - 14); ctx.stroke();
      this._put(active ? 'shrineOn' : 'shrine', c, h - 1);
    }
  }

  _cookpot() {
    const w = 24, h = 18;
    const { c, ctx } = makeCanvas(w, h);
    ctx.fillStyle = '#3a3a40'; ctx.beginPath(); ctx.ellipse(12, 11, 9, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#55555c'; ctx.beginPath(); ctx.ellipse(12, 9, 8, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2a30'; ctx.beginPath(); ctx.ellipse(12, 9, 6, 3, 0, 0, TAU); ctx.fill();
    // tripod
    ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(4, 3); ctx.lineTo(12, 8); ctx.lineTo(20, 3); ctx.stroke();
    this._put('cookpot', c, h - 1);
  }

  _icons() {
    // Each icon centered on a 16x16 canvas.
    const mk = (name, draw) => { const { c, ctx } = makeCanvas(16, 16); draw(ctx); this.icon[name] = c; };

    mk('apple', (x) => { x.fillStyle = '#d8464f'; x.beginPath(); x.arc(8, 9, 5, 0, TAU); x.fill(); x.fillStyle = '#f07a7a'; x.beginPath(); x.arc(6, 7, 1.6, 0, TAU); x.fill(); x.strokeStyle = '#6b4a2b'; x.lineWidth = 1.4; x.beginPath(); x.moveTo(8, 4); x.lineTo(9, 2); x.stroke(); x.fillStyle = '#4f8a3f'; x.beginPath(); x.ellipse(10, 3, 2, 1, 0.6, 0, TAU); x.fill(); });
    mk('meat', (x) => { x.fillStyle = '#b5643c'; x.beginPath(); x.ellipse(8, 9, 5, 4, 0, 0, TAU); x.fill(); x.fillStyle = '#d98a5a'; x.beginPath(); x.ellipse(7, 8, 3, 2.4, 0, 0, TAU); x.fill(); x.fillStyle = '#f0efe8'; x.fillRect(11, 3, 2, 6); });
    mk('mushroom', (x) => { x.fillStyle = '#d05a44'; x.beginPath(); x.arc(8, 7, 5, Math.PI, TAU); x.fill(); x.fillStyle = '#f0e0d0'; x.fillRect(6, 7, 4, 6); for (let i = 0; i < 3; i++) { x.fillStyle = '#fff'; x.beginPath(); x.arc(5 + i * 3, 5, 1, 0, TAU); x.fill(); } });
    mk('heart', (x) => { x.fillStyle = '#e8434f'; heartPath(x, 8, 9, 5.4); x.fill(); x.fillStyle = '#ff8a90'; heartPath(x, 6.6, 7.4, 2.2); x.fill(); });
    mk('stamina', (x) => { x.fillStyle = '#7bc24a'; x.beginPath(); x.arc(8, 8, 5, 0, TAU); x.fill(); x.fillStyle = '#a6e07a'; x.beginPath(); x.arc(6.5, 6.5, 2, 0, TAU); x.fill(); x.fillStyle = '#3f6b2a'; x.fillRect(7, 3, 2, 3); });
    mk('rupeeGreen', (x) => rupee(x, '#4fbf6a', '#a6f0b8'));
    mk('rupeeBlue', (x) => rupee(x, '#4f8fe0', '#b0d4ff'));
    mk('rupeeRed', (x) => rupee(x, '#e05a5a', '#ffb0b0'));
    mk('korok', (x) => { x.fillStyle = '#7a5a34'; x.beginPath(); x.arc(8, 9, 4.5, 0, TAU); x.fill(); x.fillStyle = '#4f8a3f'; for (let i = 0; i < 5; i++) { const a = -HALF_PI + (i - 2) * 0.5; x.save(); x.translate(8, 5); x.rotate(a); x.beginPath(); x.ellipse(0, -3, 1.4, 4, 0, 0, TAU); x.fill(); x.restore(); } x.fillStyle = '#2a1e12'; x.fillRect(6, 8, 1.5, 1.5); x.fillRect(9, 8, 1.5, 1.5); });
    mk('arrow', (x) => { x.strokeStyle = '#c8a86a'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(3, 13); x.lineTo(13, 3); x.stroke(); x.fillStyle = '#d8d8d8'; x.beginPath(); x.moveTo(13, 3); x.lineTo(10, 4); x.lineTo(12, 6); x.closePath(); x.fill(); x.strokeStyle = '#e0e0e0'; x.beginPath(); x.moveTo(3, 13); x.lineTo(5, 11); x.moveTo(3, 13); x.lineTo(5, 14); x.stroke(); });
    mk('bomb', (x) => { x.fillStyle = '#2f333a'; x.beginPath(); x.arc(8, 10, 5, 0, TAU); x.fill(); x.fillStyle = '#4a4f57'; x.beginPath(); x.arc(6, 8, 1.8, 0, TAU); x.fill(); x.strokeStyle = '#8a6a3a'; x.lineWidth = 1.4; x.beginPath(); x.moveTo(9, 5); x.quadraticCurveTo(12, 2, 13, 4); x.stroke(); x.fillStyle = '#ff9a3a'; x.beginPath(); x.arc(13, 4, 1.5, 0, TAU); x.fill(); });

    // Weapons (also used as world drops), drawn on 16x16, pointing up-right.
    mk('sword', (x) => { x.strokeStyle = '#d6dbe2'; x.lineWidth = 2.4; x.beginPath(); x.moveTo(4, 13); x.lineTo(12, 4); x.stroke(); x.strokeStyle = '#8a5a2a'; x.lineWidth = 2.4; x.beginPath(); x.moveTo(3, 14); x.lineTo(5, 12); x.stroke(); x.strokeStyle = '#c8a24a'; x.lineWidth = 2; x.beginPath(); x.moveTo(3, 11); x.lineTo(6, 14); x.stroke(); });
    mk('claymore', (x) => { x.strokeStyle = '#cfd6de'; x.lineWidth = 3.4; x.beginPath(); x.moveTo(3, 14); x.lineTo(13, 3); x.stroke(); x.strokeStyle = '#7a4a8a'; x.lineWidth = 3; x.beginPath(); x.moveTo(2, 15); x.lineTo(4.5, 12.5); x.stroke(); x.strokeStyle = '#c8a24a'; x.lineWidth = 2.4; x.beginPath(); x.moveTo(2.5, 11.5); x.lineTo(6, 15); x.stroke(); });
    mk('spear', (x) => { x.strokeStyle = '#b58a4a'; x.lineWidth = 1.8; x.beginPath(); x.moveTo(2, 15); x.lineTo(13, 3); x.stroke(); x.fillStyle = '#d6dbe2'; x.beginPath(); x.moveTo(13, 3); x.lineTo(10, 4); x.lineTo(12, 7); x.closePath(); x.fill(); });
    mk('bow', (x) => { x.strokeStyle = '#8a5a2a'; x.lineWidth = 2; x.beginPath(); x.arc(6, 8, 6, -1.1, 1.1); x.stroke(); x.strokeStyle = '#e8e8e8'; x.lineWidth = 1; x.beginPath(); x.moveTo(9, 3); x.lineTo(9, 13); x.stroke(); });
    mk('shield', (x) => { x.fillStyle = '#4f6ea0'; x.beginPath(); x.moveTo(8, 2); x.lineTo(13, 5); x.lineTo(13, 10); x.lineTo(8, 14); x.lineTo(3, 10); x.lineTo(3, 5); x.closePath(); x.fill(); x.fillStyle = '#c8a24a'; x.beginPath(); x.moveTo(8, 5); x.lineTo(10, 8); x.lineTo(8, 11); x.lineTo(6, 8); x.closePath(); x.fill(); });
  }
}

function heartPath(ctx, cx, cy, s) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.7);
  ctx.bezierCurveTo(cx - s, cy - s * 0.2, cx - s * 0.55, cy - s, cx, cy - s * 0.35);
  ctx.bezierCurveTo(cx + s * 0.55, cy - s, cx + s, cy - s * 0.2, cx, cy + s * 0.7);
  ctx.closePath();
}

function rupee(x, col, hi) {
  x.fillStyle = col;
  x.beginPath();
  x.moveTo(8, 2); x.lineTo(12, 5); x.lineTo(12, 11); x.lineTo(8, 14); x.lineTo(4, 11); x.lineTo(4, 5);
  x.closePath(); x.fill();
  x.fillStyle = hi;
  x.beginPath(); x.moveTo(8, 4); x.lineTo(10, 6); x.lineTo(8, 9); x.lineTo(6, 6); x.closePath(); x.fill();
}


/* ===== js/world/tiles.js ===== */
'use strict';
/* tiles.js — terrain tile definitions (data-driven).
   T holds integer ids; TILES[id] holds the tile's properties. */

const T = {
  DEEP_WATER: 0,
  WATER: 1,
  SAND: 2,
  GRASS: 3,
  GRASS_DARK: 4,
  FOREST: 5,
  DIRT: 6,
  PATH: 7,
  ROCK: 8,
  CLIFF: 9,
  SNOW: 10,
  SNOW_ROCK: 11,
  FLOWERS: 12,
  SHRINE_FLOOR: 13,
};

// col = base color, col2 = speckle/detail color.
const TILES = [];
function defTile(id, name, col, col2, opt) {
  opt = opt || {};
  TILES[id] = {
    id, name, col, col2,
    solid: !!opt.solid,          // blocks all movement
    deep: !!opt.deep,            // deep water -> swim
    shallow: !!opt.shallow,      // shallow water -> splash + slight slow
    climb: !!opt.climb,          // cliff -> climbable with stamina
    cold: !!opt.cold,            // contributes to chill
    speed: opt.speed === undefined ? 1 : opt.speed, // movement multiplier
    noise: opt.noise || 0.06,    // per-tile brightness variation amount
  };
}

defTile(T.DEEP_WATER, 'Deep Water', { r: 34, g: 78, b: 148 }, { r: 60, g: 120, b: 200 }, { deep: true, speed: 0.55, noise: 0.1 });
defTile(T.WATER, 'Water', { r: 64, g: 132, b: 200 }, { r: 120, g: 190, b: 235 }, { shallow: true, speed: 0.75, noise: 0.12 });
defTile(T.SAND, 'Sand', { r: 224, g: 206, b: 145 }, { r: 205, g: 184, b: 120 }, { speed: 0.9, noise: 0.05 });
defTile(T.GRASS, 'Grass', { r: 106, g: 168, b: 79 }, { r: 128, g: 186, b: 92 }, { noise: 0.07 });
defTile(T.GRASS_DARK, 'Meadow', { r: 84, g: 146, b: 66 }, { r: 104, g: 164, b: 80 }, { noise: 0.07 });
defTile(T.FOREST, 'Woods', { r: 66, g: 118, b: 58 }, { r: 82, g: 134, b: 68 }, { noise: 0.08 });
defTile(T.DIRT, 'Dirt', { r: 138, g: 110, b: 74 }, { r: 120, g: 94, b: 62 }, { noise: 0.06 });
defTile(T.PATH, 'Path', { r: 176, g: 154, b: 112 }, { r: 158, g: 136, b: 96 }, { speed: 1.08, noise: 0.04 });
defTile(T.ROCK, 'Rock', { r: 128, g: 122, b: 116 }, { r: 148, g: 142, b: 136 }, { speed: 0.85, noise: 0.08 });
defTile(T.CLIFF, 'Cliff', { r: 92, g: 84, b: 78 }, { r: 70, g: 63, b: 58 }, { solid: true, climb: true, noise: 0.1 });
defTile(T.SNOW, 'Snow', { r: 236, g: 240, b: 246 }, { r: 214, g: 224, b: 236 }, { cold: true, speed: 0.85, noise: 0.05 });
defTile(T.SNOW_ROCK, 'Frozen Rock', { r: 176, g: 186, b: 198 }, { r: 150, g: 162, b: 176 }, { cold: true, speed: 0.8, noise: 0.08 });
defTile(T.FLOWERS, 'Flower Field', { r: 112, g: 174, b: 84 }, { r: 210, g: 120, b: 170 }, { noise: 0.09 });
defTile(T.SHRINE_FLOOR, 'Ancient Tile', { r: 44, g: 52, b: 66 }, { r: 90, g: 150, b: 168 }, { speed: 1.0, noise: 0.04 });

function tileInfo(id) { return TILES[id] || TILES[T.GRASS]; }
function tileSolid(id) { const t = TILES[id]; return t ? t.solid : true; }
function tileDeep(id) { const t = TILES[id]; return t ? t.deep : false; }


/* ===== js/world/worldgen.js ===== */
'use strict';
/* worldgen.js — builds a continent: biome tiles from layered noise, then
   scatters vegetation/rocks and places structures (towers, shrines, camps,
   cook pots, chests, korok spots). Returns a plain data object. */

const TILE = 16; // world pixels per tile

function generateWorld(seed) {
  const rng = new RNG(seed);
  const elev = new Noise(seed ^ 0x9e37);
  const moist = new Noise(seed ^ 0x51ed);
  const detail = new Noise(seed ^ 0xa13f);

  const W = 220, H = 176;                 // tiles
  const tiles = new Uint8Array(W * H);
  const cx = W / 2, cy = H / 2;
  const maxR = Math.min(W, H) * 0.5;

  const eScale = 0.028, mScale = 0.035;

  const elevOf = new Float32Array(W * H);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let e = elev.fbm01(x * eScale, y * eScale, 5, 2, 0.5);
      // island falloff: subtract based on normalized distance from centre
      const dx = (x - cx) / maxR, dy = (y - cy) / maxR;
      const d = Math.sqrt(dx * dx + dy * dy);
      const falloff = smoothstep(invlerp(0.72, 1.05, d)); // 0 inland, 1 at edge
      e = e * (1 - falloff) - falloff * 0.35;
      // sprinkle fine detail
      e += detail.value(x * 0.12, y * 0.12) * 0.03;
      e = clamp(e, 0, 1);
      elevOf[y * W + x] = e;

      const m = moist.fbm01(x * mScale + 100, y * mScale + 100, 4, 2, 0.5);

      let t;
      if (e < 0.30) t = T.DEEP_WATER;
      else if (e < 0.355) t = T.WATER;
      else if (e < 0.40) t = T.SAND;
      else if (e < 0.66) {
        if (m < 0.34) t = (m < 0.18 ? T.DIRT : T.GRASS_DARK);
        else if (m < 0.60) t = (detail.value(x * 0.2, y * 0.2) > 0.55 ? T.FLOWERS : T.GRASS);
        else t = T.FOREST;
      } else if (e < 0.70) t = T.CLIFF;         // climbable ring around highlands
      else if (e < 0.80) t = T.ROCK;
      else if (e < 0.87) t = T.SNOW_ROCK;
      else t = T.SNOW;
      tiles[y * W + x] = t;
    }
  }

  const idx = (x, y) => y * W + x;
  const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const isWalkTile = (x, y) => {
    if (!inb(x, y)) return false;
    const t = TILES[tiles[idx(x, y)]];
    return !t.solid && !t.deep;
  };

  // Pick a pleasant spawn: flat grass near centre.
  let spawnTX = Math.floor(cx), spawnTY = Math.floor(cy);
  {
    let best = -1;
    for (let tries = 0; tries < 4000; tries++) {
      const x = Math.floor(cx + rng.range(-18, 18));
      const y = Math.floor(cy + rng.range(-18, 18));
      if (!inb(x, y)) continue;
      const t = tiles[idx(x, y)];
      if (t === T.GRASS || t === T.GRASS_DARK || t === T.FLOWERS) {
        const score = (isWalkTile(x + 1, y) && isWalkTile(x - 1, y) && isWalkTile(x, y + 1) && isWalkTile(x, y - 1)) ? 1 : 0;
        if (score > best) { best = score; spawnTX = x; spawnTY = y; if (score === 1) break; }
      }
    }
  }
  // Fallback: if no grass was found near centre, spiral outward for the nearest
  // walkable tile rather than trusting the untested centre cell (could be water).
  if (!isWalkTile(spawnTX, spawnTY)) {
    const ccx = Math.floor(cx), ccy = Math.floor(cy);
    let found = false;
    for (let rad = 1; rad < Math.max(W, H) && !found; rad++) {
      for (let dy = -rad; dy <= rad && !found; dy++) {
        for (let dx = -rad; dx <= rad && !found; dx++) {
          if (Math.abs(dx) !== rad && Math.abs(dy) !== rad) continue; // ring only
          if (isWalkTile(ccx + dx, ccy + dy)) { spawnTX = ccx + dx; spawnTY = ccy + dy; found = true; }
        }
      }
    }
  }
  const spawn = { x: spawnTX * TILE + TILE / 2, y: spawnTY * TILE + TILE / 2 };

  const objects = [];
  const structures = { towers: [], shrines: [], camps: [], cookpots: [], chests: [], koroks: [], talus: [] };
  const reserved = new Uint8Array(W * H); // 1 = don't scatter decor here

  function reserveArea(tx, ty, rad) {
    for (let y = ty - rad; y <= ty + rad; y++)
      for (let x = tx - rad; x <= tx + rad; x++)
        if (inb(x, y)) reserved[idx(x, y)] = 1;
  }
  function farEnough(list, wx, wy, minD) {
    for (const s of list) if (dist(s.x, s.y, wx, wy) < minD) return false;
    return true;
  }
  function findWalkable(centerBias) {
    for (let tries = 0; tries < 600; tries++) {
      const x = rng.int(6, W - 7), y = rng.int(6, H - 7);
      if (!isWalkTile(x, y)) continue;
      if (centerBias && dist(x, y, cx, cy) > maxR * 0.9) continue;
      return { tx: x, ty: y, wx: x * TILE + TILE / 2, wy: y * TILE + TILE / 2 };
    }
    return null;
  }

  // --- Towers ---
  const towerCount = 5;
  for (let i = 0; i < towerCount && structures.towers.length < towerCount; i++) {
    for (let tries = 0; tries < 400; tries++) {
      const p = findWalkable(false);
      if (!p) break;
      if (!farEnough(structures.towers, p.wx, p.wy, 55 * TILE)) continue;
      if (dist(p.wx, p.wy, spawn.x, spawn.y) < 26 * TILE && i === 0) { /* first can be nearer */ }
      // flatten footprint
      for (let yy = -1; yy <= 1; yy++) for (let xx = -1; xx <= 1; xx++) if (inb(p.tx + xx, p.ty + yy)) tiles[idx(p.tx + xx, p.ty + yy)] = T.PATH;
      reserveArea(p.tx, p.ty, 2);
      const tw = { id: i, x: p.wx, y: p.wy, activated: false };
      structures.towers.push(tw);
      objects.push({ type: 'tower', x: p.wx, y: p.wy, v: 0, solid: true, r: 12, interact: 'tower', ref: tw });
      break;
    }
  }

  // --- Shrines ---
  const shrineCount = 12;
  for (let i = 0; i < shrineCount; i++) {
    let placed = false;
    for (let tries = 0; tries < 400 && !placed; tries++) {
      const p = findWalkable(false);
      if (!p) break;
      if (!farEnough(structures.shrines, p.wx, p.wy, 22 * TILE)) continue;
      if (dist(p.wx, p.wy, spawn.x, spawn.y) < 12 * TILE) continue;
      tiles[idx(p.tx, p.ty)] = T.SHRINE_FLOOR;
      for (let yy = -1; yy <= 1; yy++) for (let xx = -1; xx <= 1; xx++) if (inb(p.tx + xx, p.ty + yy) && isWalkTile(p.tx + xx, p.ty + yy)) tiles[idx(p.tx + xx, p.ty + yy)] = T.SHRINE_FLOOR;
      reserveArea(p.tx, p.ty, 2);
      const sh = { id: i, x: p.wx, y: p.wy, activated: false };
      structures.shrines.push(sh);
      objects.push({ type: 'shrine', x: p.wx, y: p.wy, v: 0, solid: true, r: 11, interact: 'shrine', ref: sh });
      placed = true;
    }
  }

  // --- Enemy camps (cluster around a campfire, with a chest) ---
  const campCount = 10;
  for (let i = 0; i < campCount; i++) {
    for (let tries = 0; tries < 400; tries++) {
      const p = findWalkable(false);
      if (!p) break;
      const t = tiles[idx(p.tx, p.ty)];
      if (t === T.SAND || t === T.SNOW || t === T.ROCK) { /* allow */ }
      if (dist(p.wx, p.wy, spawn.x, spawn.y) < 20 * TILE) continue;
      if (!farEnough(structures.camps, p.wx, p.wy, 26 * TILE)) continue;
      reserveArea(p.tx, p.ty, 3);
      objects.push({ type: 'campfire', x: p.wx, y: p.wy, v: 0, solid: false, r: 5, light: true });
      // chest with a weapon — placed on a walkable tile near the fire so it is
      // always reachable on foot (never floating on water or inside a rock)
      let chestPos = { x: p.wx, y: p.wy };
      for (let ct = 0; ct < 14; ct++) {
        const cxp = p.wx + rng.range(-40, 40), cyp = p.wy + rng.range(-40, 40);
        if (isWalkTile(Math.floor(cxp / TILE), Math.floor(cyp / TILE))) { chestPos = { x: cxp, y: cyp }; break; }
      }
      const loot = rng.pick(['claymore', 'spear', 'sword', 'bow']);
      const chest = { type: 'chest', x: chestPos.x, y: chestPos.y, v: 0, solid: true, r: 9, interact: 'chest', opened: false, item: loot };
      objects.push(chest);
      structures.chests.push(chest);
      const size = rng.int(3, 5);
      const camp = { x: p.wx, y: p.wy, size, radius: 60, cleared: false, enemies: [] };
      structures.camps.push(camp);
      break;
    }
  }

  // --- Standalone cook pots (one guaranteed near spawn) ---
  {
    // near-spawn cook pot
    for (let tries = 0; tries < 200; tries++) {
      const x = spawnTX + rng.int(-5, 5), y = spawnTY + rng.int(-5, 5);
      if (inb(x, y) && isWalkTile(x, y) && dist(x, y, spawnTX, spawnTY) > 2) {
        const wx = x * TILE + TILE / 2, wy = y * TILE + TILE / 2;
        objects.push({ type: 'cookpot', x: wx, y: wy, v: 0, solid: true, r: 8, interact: 'cookpot' });
        structures.cookpots.push({ x: wx, y: wy });
        reserveArea(x, y, 1);
        break;
      }
    }
    for (let i = 0; i < 5; i++) {
      const p = findWalkable(false);
      if (!p) continue;
      objects.push({ type: 'cookpot', x: p.wx, y: p.wy, v: 0, solid: true, r: 8, interact: 'cookpot' });
      structures.cookpots.push({ x: p.wx, y: p.wy });
      reserveArea(p.tx, p.ty, 1);
    }
  }

  // --- Standalone treasure chests in the wild ---
  for (let i = 0; i < 8; i++) {
    const p = findWalkable(false);
    if (!p) continue;
    if (reserved[idx(p.tx, p.ty)]) continue;
    const loot = rng.pick(['rupees', 'arrows', 'bombup', 'heartup_food', 'sword', 'bow']);
    const chest = { type: 'chest', x: p.wx, y: p.wy, v: 0, solid: true, r: 9, interact: 'chest', opened: false, item: loot };
    objects.push(chest);
    structures.chests.push(chest);
    reserveArea(p.tx, p.ty, 1);
  }

  // --- Stone Talus boss lairs (roam rocky/dry ground, awaken when approached) ---
  for (let i = 0; i < 2; i++) {
    for (let tries = 0; tries < 400; tries++) {
      const p = findWalkable(false);
      if (!p) break;
      const tid = tiles[idx(p.tx, p.ty)];
      if (tid !== T.ROCK && tid !== T.DIRT && tid !== T.GRASS_DARK && tid !== T.SAND) continue;
      if (dist(p.wx, p.wy, spawn.x, spawn.y) < 42 * TILE) continue;
      if (!farEnough(structures.talus, p.wx, p.wy, 60 * TILE)) continue;
      structures.talus.push({ x: p.wx, y: p.wy, defeated: false });
      break;
    }
  }

  // --- Korok spots (a lone rock with a leaf; lift with E) ---
  const korokCount = 40;
  for (let i = 0; i < korokCount; i++) {
    const p = findWalkable(false);
    if (!p) continue;
    if (reserved[idx(p.tx, p.ty)]) continue;
    const k = { type: 'korokRock', x: p.wx, y: p.wy, v: 0, solid: false, r: 7, interact: 'korok', done: false };
    objects.push(k);
    structures.koroks.push(k);
    reserved[idx(p.tx, p.ty)] = 1;
  }

  // --- Scatter vegetation & rocks ---
  for (let y = 2; y < H - 2; y++) {
    for (let x = 2; x < W - 2; x++) {
      if (reserved[idx(x, y)]) continue;
      const t = tiles[idx(x, y)];
      const ti = TILES[t];
      if (ti.solid || ti.deep) continue;
      const wx = x * TILE + rng.range(2, TILE - 2);
      const wy = y * TILE + rng.range(2, TILE - 2);
      const r = rng.next();
      // keep spawn area clearer
      const nearSpawn = dist(x, y, spawnTX, spawnTY) < 6;

      if (t === T.FOREST) {
        if (r < 0.34) objects.push({ type: rng.chance(0.4) ? 'pine' : 'tree', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 6 });
        else if (r < 0.46) objects.push({ type: 'bush', x: wx, y: wy, v: rng.int(0, 2), solid: false, r: 5, cut: false });
        else if (r < 0.52) objects.push({ type: 'grass', x: wx, y: wy, v: rng.int(0, 2), solid: false, cut: true });
        else if (r < 0.54) objects.push({ type: 'stump', x: wx, y: wy, v: 0, solid: true, r: 5 });
      } else if (t === T.GRASS || t === T.GRASS_DARK) {
        if (!nearSpawn && r < 0.06) objects.push({ type: rng.chance(0.7) ? 'tree' : 'pine', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 6 });
        else if (r < 0.12) objects.push({ type: 'bush', x: wx, y: wy, v: rng.int(0, 2), solid: false, r: 5 });
        else if (r < 0.30) objects.push({ type: 'grass', x: wx, y: wy, v: rng.int(0, 2), solid: false, cut: true });
        else if (r < 0.33) objects.push({ type: 'rock', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 5 });
      } else if (t === T.FLOWERS) {
        if (r < 0.26) objects.push({ type: 'flower', x: wx, y: wy, v: rng.int(0, 2), solid: false });
        else if (r < 0.44) objects.push({ type: 'grass', x: wx, y: wy, v: rng.int(0, 2), solid: false, cut: true });
      } else if (t === T.SAND) {
        if (r < 0.05) objects.push({ type: 'rock', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 5 });
        else if (r < 0.07) objects.push({ type: 'bush', x: wx, y: wy, v: rng.int(0, 2), solid: false, r: 4 });
      } else if (t === T.DIRT) {
        if (r < 0.08) objects.push({ type: 'rock', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 5 });
        else if (r < 0.14) objects.push({ type: 'grass', x: wx, y: wy, v: rng.int(0, 2), solid: false, cut: true });
      } else if (t === T.ROCK) {
        if (r < 0.10) objects.push({ type: 'rock', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 5 });
        else if (r < 0.14) objects.push({ type: 'boulder', x: wx, y: wy, v: rng.int(0, 1), solid: true, r: 10, breakable: true, hp: 3 });
      } else if (t === T.SNOW || t === T.SNOW_ROCK) {
        if (r < 0.05) objects.push({ type: 'pine', x: wx, y: wy, v: rng.int(0, 1), solid: true, r: 6 });
        else if (r < 0.09) objects.push({ type: 'rock', x: wx, y: wy, v: rng.int(0, 2), solid: true, r: 5 });
      }
    }
  }

  return { W, H, tiles, elevOf, objects, structures, spawn, seed };
}


/* ===== js/world/world.js ===== */
'use strict';
/* world.js — wraps generated map data: tile queries, collision resolution,
   a spatial grid for objects, and cached terrain rendering. */

const CHUNK = 16;          // tiles per cached terrain chunk
const GRID_CELL = 32;      // world px per spatial-grid cell

class World {
  constructor(data, sprites) {
    this.W = data.W; this.H = data.H;
    this.tiles = data.tiles;
    this.elevOf = data.elevOf;
    this.objects = data.objects;
    this.structures = data.structures;
    this.spawn = data.spawn;
    this.seed = data.seed;
    this.sprites = sprites;
    this.pxW = this.W * TILE;
    this.pxH = this.H * TILE;

    this._chunks = new Map();
    this._buildGrid();
  }

  /* ---------------- tile queries ---------------- */
  inBounds(tx, ty) { return tx >= 0 && ty >= 0 && tx < this.W && ty < this.H; }
  tileIdAt(tx, ty) { return this.inBounds(tx, ty) ? this.tiles[ty * this.W + tx] : T.DEEP_WATER; }
  tileIdAtWorld(wx, wy) { return this.tileIdAt(Math.floor(wx / TILE), Math.floor(wy / TILE)); }
  tileInfoAtWorld(wx, wy) { return TILES[this.tileIdAtWorld(wx, wy)]; }
  elevAtWorld(wx, wy) {
    const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
    return this.inBounds(tx, ty) ? this.elevOf[ty * this.W + tx] : 0;
  }

  /* ---------------- spatial grid ---------------- */
  _buildGrid() {
    this.gw = Math.ceil(this.pxW / GRID_CELL);
    this.gh = Math.ceil(this.pxH / GRID_CELL);
    this.grid = new Array(this.gw * this.gh);
    for (const o of this.objects) this._gridAdd(o);
  }
  _cellIndex(wx, wy) {
    const cx = clamp(Math.floor(wx / GRID_CELL), 0, this.gw - 1);
    const cy = clamp(Math.floor(wy / GRID_CELL), 0, this.gh - 1);
    return cy * this.gw + cx;
  }
  _gridAdd(o) {
    const i = this._cellIndex(o.x, o.y);
    (this.grid[i] || (this.grid[i] = [])).push(o);
  }
  // Iterate objects whose cell is within the world-px rectangle.
  forEachObjectIn(x0, y0, x1, y1, fn) {
    const cx0 = clamp(Math.floor(x0 / GRID_CELL), 0, this.gw - 1);
    const cy0 = clamp(Math.floor(y0 / GRID_CELL), 0, this.gh - 1);
    const cx1 = clamp(Math.floor(x1 / GRID_CELL), 0, this.gw - 1);
    const cy1 = clamp(Math.floor(y1 / GRID_CELL), 0, this.gh - 1);
    for (let cy = cy0; cy <= cy1; cy++)
      for (let cx = cx0; cx <= cx1; cx++) {
        const bucket = this.grid[cy * this.gw + cx];
        if (bucket) for (let i = 0; i < bucket.length; i++) fn(bucket[i]);
      }
  }

  removeObject(o) { o.dead = true; }

  nearestInteractable(wx, wy, maxDist) {
    let best = null, bestD = maxDist;
    this.forEachObjectIn(wx - maxDist - 20, wy - maxDist - 20, wx + maxDist + 20, wy + maxDist + 20, (o) => {
      if (o.dead || !o.interact) return;
      if (o.interact === 'chest' && o.opened) return;
      if (o.interact === 'korok' && o.done) return;
      const d = dist(wx, wy, o.x, o.y);
      if (d < bestD) { bestD = d; best = o; }
    });
    return best;
  }

  /* ---------------- collision ---------------- */
  _tileBlocks(tid, opts) {
    const t = TILES[tid];
    if (!t) return true;
    if (t.solid) { if (t.climb && !opts.cliffSolid) return false; return true; }
    if (t.deep && opts.deepSolid) return true;
    return false;
  }
  // Is a circle at (x,y,r) blocked by tiles?
  _tilesBlockCircle(x, y, r, opts) {
    const tx0 = Math.floor((x - r) / TILE), tx1 = Math.floor((x + r) / TILE);
    const ty0 = Math.floor((y - r) / TILE), ty1 = Math.floor((y + r) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const tid = this.tileIdAt(tx, ty);
        if (!this.inBounds(tx, ty)) return true; // out of bounds blocks
        if (this._tileBlocks(tid, opts)) {
          if (circleRectOverlap(x, y, r, tx * TILE, ty * TILE, TILE, TILE)) return true;
        }
      }
    }
    return false;
  }
  _objectsBlockCircle(x, y, r, opts) {
    let blocked = false;
    this.forEachObjectIn(x - r - 12, y - r - 12, x + r + 12, y + r + 12, (o) => {
      if (blocked || o.dead || !o.solid) return;
      if (opts.ignoreObj && opts.ignoreObj === o) return;
      const or = o.r || 5;
      if (circlesOverlap(x, y, r, o.x, o.y, or)) blocked = true;
    });
    return blocked;
  }
  _blocked(x, y, r, opts) {
    return this._tilesBlockCircle(x, y, r, opts) || this._objectsBlockCircle(x, y, r, opts);
  }

  // Move a circle by (dx,dy) with axis separation and sub-stepping.
  // Returns {x, y, hitX, hitY}. opts: {deepSolid, cliffSolid, ignoreObj}
  moveCircle(x, y, r, dx, dy, opts) {
    opts = opts || {};
    if (opts.deepSolid === undefined) opts.deepSolid = true;
    if (opts.cliffSolid === undefined) opts.cliffSolid = true;
    // If we start already embedded in a solid (e.g. a climber whose stamina ran
    // out inside a cliff band, or an enemy that spawned badly), nudge free first
    // so the entity can never get permanently frozen.
    if (this._blocked(x, y, r, opts)) { const esc = this._unstick(x, y, r, opts); x = esc.x; y = esc.y; }
    let hitX = false, hitY = false;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / (r * 0.5 || 4)));
    const sx = dx / steps, sy = dy / steps;
    for (let s = 0; s < steps; s++) {
      if (sx !== 0) {
        const nx = x + sx;
        if (!this._blocked(nx, y, r, opts)) x = nx; else hitX = true;
      }
      if (sy !== 0) {
        const ny = y + sy;
        if (!this._blocked(x, ny, r, opts)) y = ny; else hitY = true;
      }
    }
    return { x, y, hitX, hitY };
  }

  // Find the nearest non-blocked position by spiralling outward. Returns the
  // original position if nothing free is found within range.
  _unstick(x, y, r, opts) {
    for (let rad = 2; rad <= 28; rad += 2) {
      for (let a = 0; a < 8; a++) {
        const ang = a / 8 * TAU;
        const nx = x + Math.cos(ang) * rad, ny = y + Math.sin(ang) * rad;
        if (!this._blocked(nx, ny, r, opts)) return { x: nx, y: ny };
      }
    }
    return { x, y };
  }

  // True if a straight sample point is inside a solid (used by projectiles).
  pointSolid(x, y, opts) {
    opts = opts || { deepSolid: false, cliffSolid: true };
    const tid = this.tileIdAtWorld(x, y);
    if (!this.inBounds(Math.floor(x / TILE), Math.floor(y / TILE))) return true;
    if (this._tileBlocks(tid, opts)) return true;
    let hit = false;
    this.forEachObjectIn(x - 12, y - 12, x + 12, y + 12, (o) => {
      if (hit || o.dead || !o.solid) return;
      if (o.type === 'campfire' || o.type === 'cookpot' || o.type === 'korokRock') return;
      const or = (o.r || 5);
      if (dist2(x, y, o.x, o.y) < or * or) hit = true;
    });
    return hit;
  }

  /* ---------------- rendering ---------------- */
  _buildChunk(ccx, ccy) {
    const size = CHUNK * TILE;
    const { c, ctx } = makeCanvas(size, size);
    const tx0 = ccx * CHUNK, ty0 = ccy * CHUNK;
    for (let ly = 0; ly < CHUNK; ly++) {
      for (let lx = 0; lx < CHUNK; lx++) {
        const tx = tx0 + lx, ty = ty0 + ly;
        if (!this.inBounds(tx, ty)) { ctx.fillStyle = '#22496a'; ctx.fillRect(lx * TILE, ly * TILE, TILE, TILE); continue; }
        const t = TILES[this.tiles[ty * this.W + tx]];
        const h = hash01(tx, ty, this.seed);
        const b = (h - 0.5) * 2 * t.noise; // brightness variation
        const base = shade(t.col, b);
        ctx.fillStyle = css(base);
        ctx.fillRect(lx * TILE, ly * TILE, TILE, TILE);
        // speckles
        const nSp = 3;
        for (let s = 0; s < nSp; s++) {
          const hx = hash01(tx * 4 + s, ty * 7 + 1, this.seed);
          const hy = hash01(tx * 9 + 3, ty * 5 + s, this.seed + 99);
          ctx.fillStyle = css(shade(t.col2, (hx - 0.5) * 0.2));
          ctx.globalAlpha = 0.5;
          ctx.fillRect(lx * TILE + hx * (TILE - 3), ly * TILE + hy * (TILE - 3), 2, 2);
          ctx.globalAlpha = 1;
        }
        // water: horizontal light bands; cliff: vertical shade
        if (t.deep || t.shallow) {
          ctx.fillStyle = css(shade(t.col2, 0.15), 0.35);
          if (((tx * 3 + ty * 5) & 3) === 0) ctx.fillRect(lx * TILE + 2, ly * TILE + 5, TILE - 5, 1.5);
        } else if (t.climb) {
          ctx.fillStyle = css(shade(t.col, -0.35), 0.5);
          ctx.fillRect(lx * TILE, ly * TILE, 2, TILE);
          ctx.fillStyle = css(shade(t.col, 0.2), 0.4);
          ctx.fillRect(lx * TILE + TILE - 3, ly * TILE + 2, 2, TILE - 4);
        }
      }
    }
    return c;
  }
  _getChunk(ccx, ccy) {
    const key = ccx + ',' + ccy;
    let c = this._chunks.get(key);
    if (!c) { c = this._buildChunk(ccx, ccy); this._chunks.set(key, c); }
    return c;
  }
  drawTerrain(ctx, view) {
    const size = CHUNK * TILE;
    const c0 = Math.floor(view.x / size), c1 = Math.floor((view.x + view.w) / size);
    const r0 = Math.floor(view.y / size), r1 = Math.floor((view.y + view.h) / size);
    const maxCX = Math.ceil(this.pxW / size) - 1, maxCY = Math.ceil(this.pxH / size) - 1;
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        if (cx < 0 || cy < 0 || cx > maxCX || cy > maxCY) continue;
        const chunk = this._getChunk(cx, cy);
        ctx.drawImage(chunk, cx * size, cy * size);
      }
    }
  }

  // Push visible objects into arr as render entries {y, kind:'obj', o}.
  collectVisibleObjects(view, arr) {
    // Objects are drawn upward from their feet, so a tall sprite (the 96px tower)
    // can still be on-screen when its feet are well below the view. Pad enough to
    // cover the tallest sprite so nothing pops out at the edges.
    const pad = 110;
    this.forEachObjectIn(view.x - pad, view.y - pad, view.x + view.w + pad, view.y + view.h + pad, (o) => {
      if (o.dead) return;
      arr.push({ sortY: o.y, kind: 'obj', o });
    });
  }

  drawObject(ctx, o, t) {
    const sb = this.sprites;
    let name = o.type;
    if (o.type === 'chest') name = o.opened ? 'chestOpen' : 'chest';
    else if (o.type === 'shrine') name = (o.ref && o.ref.activated) ? 'shrineOn' : 'shrine';
    else if (o.type === 'korokRock') name = 'rock';
    const cv = sb.variant(name, o.v || 0) || sb.variant('rock', 0);
    if (!cv) return;
    // shadow for solid/tall objects
    if (o.solid || o.type === 'campfire' || o.type === 'korokRock') {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(o.x, o.y + 1, (o.r || 6) * 1.2, (o.r || 6) * 0.55, 0, 0, TAU);
      ctx.fill();
    }
    // gentle wind sway for foliage (skew the top of the sprite)
    const sways = (o.type === 'grass' || o.type === 'flower' || o.type === 'bush' || o.type === 'tree' || o.type === 'pine');
    if (sways && t !== undefined) {
      const amt = (o.type === 'tree' || o.type === 'pine') ? 0.05 : 0.14;
      const sw = Math.sin(t * 1.6 + o.x * 0.05 + o.y * 0.03) * amt;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.transform(1, 0, sw, 1, 0, 0); // horizontal shear grows toward the top
      ctx.drawImage(cv, Math.round(-cv.width / 2), Math.round(-cv._feetY));
      ctx.restore();
      if (o.type === 'korokRock' && !o.done) {
        ctx.fillStyle = '#4f8a3f';
        ctx.beginPath(); ctx.ellipse(o.x + 3, o.y - 8, 2, 4, 0.5, 0, TAU); ctx.fill();
      }
      return;
    }
    ctx.drawImage(cv, Math.round(o.x - cv.width / 2), Math.round(o.y - cv._feetY));
    // korok leaf hint on the rock
    if (o.type === 'korokRock' && !o.done) {
      ctx.fillStyle = '#4f8a3f';
      ctx.beginPath(); ctx.ellipse(o.x + 3, o.y - 8, 2, 4, 0.5, 0, TAU); ctx.fill();
    }
  }
}


/* ===== js/entities/weapons.js ===== */
'use strict';
/* weapons.js — melee weapon archetypes plus optional elemental variants.
   dmg in hearts-equivalent, reach in world px, arc in radians, dur = durability.
   An elemental key looks like "claymore_fire" (base "_" element). */

const WEAPONS = {
  fists:    { name: 'Bare Hands',        type: 'fists',    icon: 'sword',    dmg: 1, dur: Infinity, maxDur: Infinity, reach: 16, arc: 1.4, swing: 0.26, knock: 60 },
  sword:    { name: "Traveler's Sword",  type: 'sword',    icon: 'sword',    dmg: 3, dur: 24, maxDur: 24, reach: 22, arc: 1.5, swing: 0.28, knock: 130 },
  claymore: { name: "Knight's Claymore", type: 'claymore', icon: 'claymore', dmg: 6, dur: 20, maxDur: 20, reach: 30, arc: 2.1, swing: 0.5, knock: 220 },
  spear:    { name: "Traveler's Spear",  type: 'spear',    icon: 'spear',    dmg: 4, dur: 28, maxDur: 28, reach: 36, arc: 0.7, swing: 0.24, knock: 110 },
};

const ELEMENTS = {
  fire:  { name: 'Flameblade', col: '#ff7a3a', dmg: 2, dur: 8 },
  ice:   { name: 'Frostspire', col: '#7ad0ff', dmg: 1, dur: 8 },
  shock: { name: 'Thunderstorm', col: '#ffe14a', dmg: 3, dur: 8 },
};

function makeWeapon(key) {
  let base = key, element = null;
  const us = key.indexOf('_');
  if (us > 0) { base = key.slice(0, us); element = key.slice(us + 1); }
  const w = WEAPONS[base] || WEAPONS.sword;
  const wep = {
    key, name: w.name, type: base, icon: w.icon,
    dmg: w.dmg, dur: w.dur, maxDur: w.maxDur, reach: w.reach, arc: w.arc, swing: w.swing, knock: w.knock,
    element: null, elemCol: null,
  };
  const E = element && ELEMENTS[element];
  if (E) {
    wep.element = element;
    wep.elemCol = E.col;
    wep.name = E.name + ' ' + w.name;
    wep.dmg = w.dmg + E.dmg;
    wep.dur = w.dur + E.dur;
    wep.maxDur = (isFinite(w.maxDur) ? w.maxDur : 0) + E.dur;
  }
  return wep;
}


/* ===== js/entities/particle.js ===== */
'use strict';
/* particle.js — lightweight particle system with pooled emitters. */

class Particles {
  constructor() { this.list = []; this.rings = []; }

  _add(x, y, vx, vy, life, color, size, grav, fade) {
    if (this.list.length > 900) return;
    this.list.push({ x, y, vx, vy, life, max: life, color, size, grav: grav || 0, fade: fade !== false, shape: 'rect' });
  }

  dust(x, y, scale) {
    scale = scale || 1;
    for (let i = 0; i < 2; i++) this._add(x + rand(-2, 2), y, rand(-8, 8), rand(-14, -4), rand(0.25, 0.5) * scale, 'rgba(200,190,160,0.7)', rand(1.5, 3), -8);
  }
  dustRing(x, y) {
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; this._add(x + Math.cos(a) * 3, y, Math.cos(a) * 30, Math.sin(a) * 12 - 6, 0.4, 'rgba(210,200,170,0.75)', 2.4, 20); }
  }
  splash(x, y) {
    for (let i = 0; i < 5; i++) this._add(x + rand(-3, 3), y, rand(-24, 24), rand(-40, -12), rand(0.25, 0.5), 'rgba(150,200,240,0.85)', rand(1.5, 3), 120);
    this.ring(x, y, 'rgba(180,220,255,0.7)', 12, 0.35);
  }
  hit(x, y) {
    for (let i = 0; i < 6; i++) { const a = Math.random() * TAU, s = rand(30, 90); this._add(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.15, 0.35), 'rgba(255,240,180,0.95)', rand(1.5, 3), 40); }
  }
  spark(x, y) {
    for (let i = 0; i < 5; i++) { const a = Math.random() * TAU, s = rand(20, 60); this._add(x, y, Math.cos(a) * s, Math.sin(a) * s - 20, rand(0.3, 0.6), 'rgba(255,255,210,0.9)', rand(1, 2.4), 30); }
  }
  burst(x, y, color, n) {
    const c = withAlpha(color);
    for (let i = 0; i < (n || 10); i++) { const a = Math.random() * TAU, s = rand(30, 110); this._add(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.3, 0.7), css(c, 0.9), rand(2, 4), 60); }
  }
  leaves(x, y, color) {
    const c = withAlpha(color || '#6fae4a');
    for (let i = 0; i < 6; i++) { const a = Math.random() * TAU, s = rand(20, 60); this._add(x, y - 4, Math.cos(a) * s, Math.sin(a) * s - 20, rand(0.5, 1.0), css(c, 0.9), rand(2, 3.5), 40); }
  }
  heal(x, y) {
    for (let i = 0; i < 8; i++) this._add(x + rand(-6, 6), y + rand(-2, 8), rand(-6, 6), rand(-40, -18), rand(0.6, 1.1), 'rgba(120,240,150,0.9)', rand(1.5, 3), -20);
  }
  aura(x, y) {
    this._add(x, y + rand(-2, 8), rand(-10, 10), rand(-56, -26), rand(0.4, 0.85), 'rgba(255,224,120,0.9)', rand(1.5, 3.2), -34);
  }
  explosion(x, y) {
    for (let i = 0; i < 26; i++) { const a = Math.random() * TAU, s = rand(40, 180); this._add(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.3, 0.7), i % 3 === 0 ? 'rgba(255,210,120,0.95)' : 'rgba(255,130,50,0.95)', rand(3, 6), 20); }
    for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, s = rand(10, 60); this._add(x, y, Math.cos(a) * s, Math.sin(a) * s - 20, rand(0.6, 1.2), 'rgba(80,80,80,0.6)', rand(4, 8), -30); }
    this.ring(x, y, 'rgba(255,220,150,0.9)', 46, 0.4);
  }
  ring(x, y, color, r, life) { this.rings.push({ x, y, color, r, life, max: life }); }

  update(dt) {
    const l = this.list;
    for (let i = l.length - 1; i >= 0; i--) {
      const p = l[i];
      p.life -= dt;
      if (p.life <= 0) { l[i] = l[l.length - 1]; l.pop(); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) { this.rings.splice(i, 1); }
    }
  }

  draw(ctx) {
