    const l = this.list;
    for (let i = 0; i < l.length; i++) {
      const p = l[i];
      const a = p.fade ? clamp(p.life / p.max, 0, 1) : 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    for (const r of this.rings) {
      const t = 1 - r.life / r.max;
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = r.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * t, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}


/* ===== js/entities/projectile.js ===== */
'use strict';
/* projectile.js — arrows (player), rocks (octorok), and bombs (rune). */

class Projectile {
  constructor(x, y, angle, type, game) {
    this.x = x; this.y = y;
    this.type = type;
    this.angle = angle;
    this.dead = false;
    this.fromEnemy = false;
    this.spin = 0;
    if (type === 'arrow') {
      const sp = 340; this.vx = Math.cos(angle) * sp; this.vy = Math.sin(angle) * sp;
      this.dmg = 3; this.life = 1.4; this.rad = 3;
    } else if (type === 'rock') {
      const sp = 150; this.vx = Math.cos(angle) * sp; this.vy = Math.sin(angle) * sp;
      this.dmg = 0.75; this.life = 2.2; this.rad = 4;
    } else if (type === 'bomb') {
      this.vx = 0; this.vy = 0; this.timer = 1.7; this.rad = 5; this.life = 6;
    }
  }

  update(dt, game) {
    this.life -= dt;
    if (this.life <= 0) { if (this.type === 'bomb') this._explode(game); this.dead = true; return; }

    if (this.type === 'bomb') {
      this.timer -= dt;
      // slide with friction
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= Math.pow(0.02, dt); this.vy *= Math.pow(0.02, dt);
      if (game.world.pointSolid(this.x, this.y, { deepSolid: false, cliffSolid: true })) { this.vx *= -0.3; this.vy *= -0.3; }
      if (this.timer <= 0) { this._explode(game); this.dead = true; }
      return;
    }

    // arrow / rock: substep to avoid tunneling
    const steps = 3;
    for (let s = 0; s < steps; s++) {
      this.x += this.vx * dt / steps;
      this.y += this.vy * dt / steps;
      if (game.world.pointSolid(this.x, this.y, { deepSolid: false, cliffSolid: true })) {
        game.particles.burst(this.x, this.y, '#c8b088', 5);
        this.dead = true; return;
      }
      if (this.fromEnemy) {
        const p = game.player;
        if (p.alive && circlesOverlap(this.x, this.y, this.rad, p.x, p.y, p.rad)) {
          p.damage(this.dmg, this.vx, this.vy, game);
          this.dead = true; return;
        }
      } else {
        for (const e of game.enemies) {
          if (!e.alive) continue;
          if (circlesOverlap(this.x, this.y, this.rad, e.x, e.y, e.rad)) {
            e.damage(this.dmg, this.vx, this.vy, 140, game);
            game.audio.play('hit');
            this.dead = true; return;
          }
        }
        if (game.boss && game.boss.alive && game.boss.projHit(this.x, this.y, this.dmg, game)) { this.dead = true; return; }
      }
    }
    this.spin += dt * 10;
  }

  _explode(game) {
    game.explode(this.x, this.y, 46, 5);
  }

  draw(ctx, game) {
    const x = this.x, y = this.y;
    if (this.type === 'bomb') {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(x, y + 4, 5, 2, 0, 0, TAU); ctx.fill();
      const blink = this.timer < 0.6 && Math.floor(this.timer * 12) % 2 === 0;
      ctx.fillStyle = blink ? '#ff5a3a' : '#2f333a';
      ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff9a3a';
      ctx.beginPath(); ctx.arc(x + 3, y - 5, 1.6, 0, TAU); ctx.fill();
      return;
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(this.angle);
    if (this.type === 'arrow') {
      ctx.strokeStyle = '#c8a86a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(2, -2.4); ctx.lineTo(2, 2.4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#e8e8e8'; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-4, -2); ctx.moveTo(-7, 0); ctx.lineTo(-4, 2); ctx.stroke();
    } else {
      ctx.fillStyle = '#7a6a58'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#96866f'; ctx.beginPath(); ctx.arc(-1, -1, 2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}


/* ===== js/entities/player.js ===== */
'use strict';
/* player.js — Link. Movement, stamina, climbing, swimming, gliding, melee,
   bow, bomb rune, hearts, temperature, and procedural rendering. */

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.rad = 5;
    this.facing = 'down';
    this.aim = HALF_PI; // radians
    this.walkPhase = 0;
    this.state = 'normal'; // normal | climb | swim | glide | dead

    this.maxHearts = 3;
    this.health = 3;
    this.maxStamina = 1;
    this.stamina = 1;
    this.staminaLock = false; // true after full depletion until refilled a bit

    this.weapons = [makeWeapon('sword')];
    this.wi = 0;
    this.hasBow = false;
    this.arrows = 0;
    this.bombCd = 0;
    this.bombReady = 4; // seconds cooldown

    this.rupees = 0;
    this.koroks = 0;
    this.shrines = 0;
    this.towersFound = 0;

    this.food = { apple: 0, meat: 0, mushroom: 0, cooked: 0 };

    this.invuln = 0;
    this.attackT = 0;      // remaining swing time
    this.attackCd = 0;
    this.swingArc = 0;     // animated swing angle offset
    this.swingWeapon = null; // weapon reference locked in for the current swing
    this.hitSet = null;    // enemies already hit this swing
    this.kbx = 0; this.kby = 0; // knockback velocity

    this.temp = 0;         // -1 cold .. +1 hot (environment)
    this.coldResist = 0;   // buff timer (seconds)
    this.chillDamageT = 0;
    this.glideT = 0;
    this.respawn = { x, y };
    this.deadTimer = 0;
    this.stepTimer = 0;
    this.swimSplashT = 0;
    this.toastCd = 0;

    // combat depth
    this.dodgeT = 0;       // active dodge-roll timer
    this.dodgeCd = 0;
    this.dodgeDir = { x: 1, y: 0 };
    this.flurry = 0;       // flurry-rush 2x flag (active only while slow-mo runs)
    this.flurryCd = 0;     // re-trigger cooldown
    // awakening (Super Saiyan)
    this.awaken = 0;       // seconds of transformation left
    this.awakenMeter = 0;  // 0..1 charge
    this.auraT = 0;
  }

  get weapon() { return this.weapons[this.wi]; }
  get alive() { return this.state !== 'dead'; }

  addFood(kind, n) { this.food[kind] = (this.food[kind] || 0) + (n || 1); }
  totalFood() { return this.food.apple + this.food.meat + this.food.mushroom + this.food.cooked; }

  heal(h) { this.health = clamp(this.health + h, 0, this.maxHearts); }

  giveWeapon(key) {
    const w = makeWeapon(key);
    // replace fists or add; cap inventory to 8
    this.weapons = this.weapons.filter(x => x.type !== 'fists');
    this.weapons.push(w);
    if (this.weapons.length > 8) this.weapons.shift();
    this.wi = this.weapons.length - 1;
  }

  cycleWeapon(dir) {
    if (this.weapons.length <= 1) return;
    this.wi = (this.wi + dir + this.weapons.length) % this.weapons.length;
  }

  awakenGain(amt) { if (this.awaken <= 0) this.awakenMeter = clamp(this.awakenMeter + amt, 0, 1); }
  canAwaken() { return this.awaken <= 0 && this.awakenMeter >= 1; }

  awakenActivate(game) {
    if (!this.canAwaken()) {
      if (this.toastCd <= 0) { game.toast(this.awaken > 0 ? 'Already awakened!' : 'Awaken meter not full.'); this.toastCd = 2; }
      return;
    }
    this.awaken = 12; this.awakenMeter = 0;
    this.invuln = Math.max(this.invuln, 0.8);
    this.stamina = this.maxStamina; this.staminaLock = false;
    game.audio.play('activate'); game.shake(9);
    game.addLight(this.x, this.y, 240, [255, 210, 90], 0.9);
    game.particles.burst(this.x, this.y - 4, '#ffe27a', 34);
    game.startSlowmo(0.5, 0.4);
    game.toast('⚡ AWAKENING! Power surges through you!');
    for (const e of game.enemies) if (e.alive && dist(this.x, this.y, e.x, e.y) < 92) { const k = angleTo(this.x, this.y, e.x, e.y); e.damage(4, Math.cos(k), Math.sin(k), 320, game); }
  }

  _dodge(game) {
    if (this.dodgeCd > 0 || this.dodgeT > 0 || this.state !== 'normal') return;
    if (this.stamina < 0.12 && this.awaken <= 0) return;
    this.dodgeT = 0.26; this.dodgeCd = 0.5;
    const mv = game.input.moveVector();
    let dx = mv.x, dy = mv.y;
    if (dx === 0 && dy === 0) { const f = vecFromFacing(this.facing); dx = f.x; dy = f.y; }
    const l = Math.hypot(dx, dy) || 1; this.dodgeDir = { x: dx / l, y: dy / l };
    this.invuln = Math.max(this.invuln, 0.3);
    if (this.awaken <= 0) this._drainStamina(0.12, game);
    game.particles.dustRing(this.x, this.y + 4);
    game.audio.play('swing');
    let threat = false;
    for (const e of game.enemies) if (e.alive && e.aggro && dist(this.x, this.y, e.x, e.y) < 36) { threat = true; break; }
    if (game.boss && dist(this.x, this.y, game.boss.x, game.boss.y) < game.boss.rad + 30) threat = true;
    if (threat && this.flurryCd <= 0) { this.flurry = 1; this.flurryCd = 3; game.startSlowmo(1.4, 0.32); game.toast('Flurry Rush!'); game.addFloater(this.x, this.y - 16, 'DODGE!', '#8fd0ff', { size: 14 }); }
  }

  update(dt, game) {
    if (this.state === 'dead') { this.deadTimer -= dt; return; }
    this.attackCd = Math.max(0, this.attackCd - dt);
    this.bombCd = Math.max(0, this.bombCd - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.coldResist = Math.max(0, this.coldResist - dt);
    this.toastCd = Math.max(0, this.toastCd - dt);
    this.dodgeCd = Math.max(0, this.dodgeCd - dt);
    this.flurryCd = Math.max(0, this.flurryCd - dt);
    // flurry's 2x lives exactly as long as its slow-mo, so it can't leak into
    // full-speed play or be chained into a permanent buff
    if (game.slowmoT <= 0) this.flurry = 0;

    // awakening upkeep
    if (this.awaken > 0) {
      this.awaken -= dt;
      this.stamina = this.maxStamina; this.staminaLock = false;
      this.health = Math.min(this.maxHearts, this.health + dt * 0.35); // slow regen
      this.auraT -= dt;
      if (this.auraT <= 0) { this.auraT = 0.05; game.particles.aura(this.x + rand(-6, 6), this.y + rand(-4, 8)); }
      if (this.awaken <= 0) { game.toast('Awakening faded.'); game.particles.burst(this.x, this.y - 4, '#ffe27a', 12); }
    }

    // activate awakening
    if (game.input.wasPressed('KeyR')) this.awakenActivate(game);

    if (this.state === 'glide') { this._updateGlide(dt, game); return; }

    // --- dodge roll (overrides normal movement while active) ---
    if (game.input.wasPressed('Space') && this.state === 'normal') this._dodge(game);
    if (this.dodgeT > 0) {
      this.dodgeT -= dt;
      const spd = (this.awaken > 0 ? 300 : 250);
      const res = game.world.moveCircle(this.x, this.y, this.rad, this.dodgeDir.x * spd * dt, this.dodgeDir.y * spd * dt, { deepSolid: true });
      this.x = res.x; this.y = res.y;
      this.walkPhase += dt * 20;
      if (Math.random() < 0.5) game.particles.dust(this.x, this.y + 4, 0.5);
      this._postMoveCommon(dt, game, game.world.tileInfoAtWorld(this.x, this.y), false);
      return;
    }

    // --- knockback decay ---
    if (Math.abs(this.kbx) > 1 || Math.abs(this.kby) > 1) {
      const mv = game.world.moveCircle(this.x, this.y, this.rad, this.kbx * dt, this.kby * dt, {});
      this.x = mv.x; this.y = mv.y;
      this.kbx *= Math.pow(0.001, dt); this.kby *= Math.pow(0.001, dt);
    }

    const input = game.input;
    const mv = input.moveVector();
    const moving = (mv.x !== 0 || mv.y !== 0);

    // Aim: keyboard uses facing, but if mouse has moved, aim toward cursor for bow.
    if (moving) this.facing = facingFromVec(mv.x, mv.y);
    const face = vecFromFacing(this.facing);
    this.aim = Math.atan2(face.y, face.x);

    // --- terrain context ---
    const tile = game.world.tileInfoAtWorld(this.x, this.y);
    const onDeep = tile.deep;
    const onShallow = tile.shallow;

    // sprint
    const wantSprint = input.isDown('ShiftLeft', 'ShiftRight') && moving && !onDeep;
    let speed = 72;
    let sprinting = false;

    // --- climbing check ---
    const aheadX = this.x + face.x * (this.rad + 3);
    const aheadY = this.y + face.y * (this.rad + 3);
    const aheadTile = game.world.tileInfoAtWorld(aheadX, aheadY);
    const facingCliff = aheadTile.climb;

    if (this.state !== 'climb' && facingCliff && moving && this.stamina > 0.02 && !this.staminaLock) {
      this.state = 'climb';
    }

    if (this.state === 'climb') {
      speed = 42;
      // drain stamina while actively climbing
      const climbing = moving;
      if (climbing) this._drainStamina(dt * 0.26, game);
      const onCliffNow = game.world.tileInfoAtWorld(this.x, this.y).climb;
      const stillAdjacent = game.world.tileInfoAtWorld(this.x + face.x * (this.rad + 3), this.y + face.y * (this.rad + 3)).climb;
      // move allowing cliff traversal
      const res = game.world.moveCircle(this.x, this.y, this.rad, mv.x * speed * dt, mv.y * speed * dt, { cliffSolid: false, deepSolid: true });
      this.x = res.x; this.y = res.y;
      this.walkPhase += (climbing ? 1 : 0) * dt * 6;
      if (moving && ((this.walkPhase % 1) < dt * 6)) game.audio.play('climb');
      // exit conditions
      if (this.stamina <= 0.001) {
        // fall off: retreat back the way we climbed until on safe (non-cliff)
        // ground, so we never get left embedded inside a thick cliff band.
        this.state = 'normal';
        let bx = this.x, by = this.y;
        for (let s = 0; s < 24; s++) {
          const ti = game.world.tileInfoAtWorld(bx, by);
          if (!ti.climb && !ti.solid && !ti.deep) break;
          bx -= face.x * 3; by -= face.y * 3;
        }
        this.x = bx; this.y = by;
        this.kbx = 0; this.kby = 0;
        this.damage(0.5, 0, 0, game, true);
        game.toast('Out of stamina!');
      } else if (!onCliffNow && !stillAdjacent) {
        this.state = 'normal';
      }
      this._postMoveCommon(dt, game, tile, false);
      return;
    }

    // --- swimming ---
    if (onDeep) {
      this.state = 'swim';
      speed = 55;
      if (moving) this._drainStamina(dt * 0.16, game);
      this.swimSplashT -= dt;
      if (moving && this.swimSplashT <= 0) { this.swimSplashT = 0.35; game.particles.splash(this.x, this.y + 4); }
      if (this.stamina <= 0.001) {
        // drowning: damage + shove toward nearest shallow/land
        this.chillDamageT -= dt;
        if (this.chillDamageT <= 0) { this.chillDamageT = 1.0; this.damage(0.5, 0, 0, game, true); game.audio.play('splash'); }
        const push = this._towardLand(game);
        this.kbx = push.x * 90; this.kby = push.y * 90;
      }
    } else if (this.state === 'swim') {
      this.state = 'normal';
    }

    // --- normal / shallow movement ---
    if (this.state === 'normal' || this.state === 'swim') {
      if (wantSprint && !this.staminaLock && this.stamina > 0.001 && this.state === 'normal') {
        sprinting = true; speed = 122;
        this._drainStamina(dt * 0.34, game);
      } else if (this.state === 'normal') {
        speed = 72;
      }
      speed *= tile.speed || 1;
      if (this.awaken > 0) speed *= 1.4; // awakening boosts movement
      const res = game.world.moveCircle(this.x, this.y, this.rad, mv.x * speed * dt, mv.y * speed * dt, { deepSolid: false, cliffSolid: true });
      this.x = res.x; this.y = res.y;
      if (moving) {
        this.walkPhase += dt * (sprinting ? 12 : 8);
        this.stepTimer -= dt;
        if (this.stepTimer <= 0 && this.state === 'normal') {
          this.stepTimer = sprinting ? 0.22 : 0.32;
          if (!onShallow) game.particles.dust(this.x, this.y + 4);
          else game.particles.splash(this.x, this.y + 4);
        }
      } else {
        this.walkPhase = 0;
      }
    }

    // stamina regen
    if (!sprinting && this.state !== 'climb' && !(onDeep && moving)) {
      this.stamina = Math.min(this.maxStamina, this.stamina + dt * (this.staminaLock ? 0.55 : 0.5));
      if (this.staminaLock && this.stamina > this.maxStamina * 0.3) this.staminaLock = false;
    }

    // --- actions ---
    if (input.wasPressed('KeyJ') || input.mouse.leftPressed) this._attack(game);
    if (input.wasPressed('KeyK') || input.mouse.rightPressed) this._shootBow(game);
    if (input.wasPressed('KeyB')) this._throwBomb(game);
    if (input.wasPressed('KeyQ')) this.cycleWeapon(1);
    if (input.wasPressed('KeyF')) this.quickEat(game);

    // swing timer
    if (this.attackT > 0) {
      this.attackT -= dt;
      this._applyAttack(game);
    }

    this._postMoveCommon(dt, game, tile, sprinting);
  }

  _postMoveCommon(dt, game, tile, sprinting) {
    // temperature
    let target = 0;
    if (tile.cold) target = -1;
    // near a fire warms up
    let nearFire = false;
    game.world.forEachObjectIn(this.x - 60, this.y - 60, this.x + 60, this.y + 60, (o) => {
      if (o.dead) return;
      if (o.type === 'campfire' || o.type === 'cookpot') { if (dist(this.x, this.y, o.x, o.y) < 46) nearFire = true; }
    });
    if (nearFire) target = 0.6;
    this.temp = approach(this.temp, target, dt * 0.5);
    const cold = this.temp < -0.35 && this.coldResist <= 0 && !nearFire;
    if (cold) {
      this.chillDamageT -= dt;
      if (this.chillDamageT <= 0) { this.chillDamageT = 2.2; this.damage(0.25, 0, 0, game, true); if (this.toastCd <= 0) { game.toast('You are freezing! Find warmth.'); this.toastCd = 4; } }
    }
  }

  _updateGlide(dt, game) {
    this.glideT -= dt;
    const input = game.input;
    const mv = input.moveVector();
    let dx = mv.x, dy = mv.y;
    if (dx === 0 && dy === 0) { const f = vecFromFacing(this.facing); dx = f.x; dy = f.y; }
    if (mv.x !== 0 || mv.y !== 0) this.facing = facingFromVec(mv.x, mv.y);
    const spd = 205;
    // glide flies over everything (no collision), but clamp to world bounds
    this.x = clamp(this.x + dx * spd * dt, TILE, game.world.pxW - TILE);
    this.y = clamp(this.y + dy * spd * dt, TILE, game.world.pxH - TILE);
    this.walkPhase += dt * 3;
    if (Math.random() < 0.3) game.particles.dust(this.x + rand(-6, 6), this.y + 10, 0.4);
    // land on press or when timer ends over walkable ground
    const wantLand = input.wasPressed('KeyE');
    const groundOK = !game.world.tileInfoAtWorld(this.x, this.y).deep && !game.world.tileInfoAtWorld(this.x, this.y).solid;
    if ((this.glideT <= 0 && groundOK) || (wantLand && groundOK)) {
      this.state = 'normal';
      game.particles.dustRing(this.x, this.y + 4);
      // Consume the land press so the same edge can't also fire an interaction
      // (e.g. re-launching the glide) later this frame.
      if (wantLand) input.consume('KeyE');
    } else if (this.glideT <= -6) {
      // forced landing (nudge to nearest walkable)
      this.state = 'normal';
    }
  }

  startGlide(game) {
    if (this.state === 'glide') return;
    this.state = 'glide';
    this.glideT = 5.0;
    this.invuln = 5.5;
    game.audio.play('glide');
    game.toast('Paragliding! Steer with WASD, press E to land.');
  }

  _towardLand(game) {
    // sample directions, pick one heading toward shallow/land
    let best = { x: 0, y: -1 }, bestScore = -1;
    for (let a = 0; a < 8; a++) {
      const ang = a / 8 * TAU;
      const sx = this.x + Math.cos(ang) * 40, sy = this.y + Math.sin(ang) * 40;
      const t = game.world.tileInfoAtWorld(sx, sy);
      const score = t.deep ? 0 : (t.solid ? 0.3 : 1);
      if (score > bestScore) { bestScore = score; best = { x: Math.cos(ang), y: Math.sin(ang) }; }
    }
    return best;
  }

  _drainStamina(amt, game) {
    this.stamina -= amt;
    if (this.stamina <= 0) {
      this.stamina = 0;
      this.staminaLock = true;
    }
  }

  _attack(game) {
    if (this.attackCd > 0 || this.attackT > 0) return;
    const w = this.weapon;
    this.attackT = w.swing;
    this.attackCd = w.swing + 0.08;
    this.hitSet = new Set();
    this.swingArc = -w.arc / 2;
    this.swingWeapon = w; // lock stats for this swing even if the weapon breaks now
    this._swingId = (this._swingId || 0) + 1;
    game.audio.play('swing');
    // durability
    if (w.type !== 'fists' && isFinite(w.dur)) {
      w.dur -= 1;
      if (w.dur <= 0) {
        game.audio.play('break');
        game.toast(w.name + ' broke!');
        this.weapons.splice(this.wi, 1);
        if (this.weapons.length === 0) this.weapons.push(makeWeapon('fists'));
        this.wi = clamp(this.wi, 0, this.weapons.length - 1);
      }
    }
  }

  _applyAttack(game) {
    const w = this.swingWeapon || this.weapon;
    const t = 1 - this.attackT / w.swing; // 0..1 through swing
    this.swingArc = lerp(-w.arc / 2, w.arc / 2, t);
    const ang = this.aim;
    const dmgMul = (this.awaken > 0 ? 2 : 1) * (this.flurry > 0 ? 2 : 1);
    const dmg = w.dmg * dmgMul;
    for (const e of game.enemies) {
      if (!e.alive || this.hitSet.has(e)) continue;
      const d = dist(this.x, this.y, e.x, e.y);
      if (d > w.reach + e.rad) continue;
      const toE = angleTo(this.x, this.y, e.x, e.y);
      if (Math.abs(angDiff(ang, toE)) <= w.arc / 2 + 0.15) {
        this.hitSet.add(e);
        const kx = Math.cos(toE), ky = Math.sin(toE);
        e.damage(dmg, kx, ky, w.knock, game);
        if (w.element && e.alive) e.applyStatus(w.element, game);
        game.audio.play('hit');
        game.particles.hit(e.x, e.y);
        if (w.elemCol) game.particles.burst(e.x, e.y - 2, w.elemCol, 6);
        game.hitStop(0.05);
        game.addCombo(1);
      }
    }
    // boss weak-point (armoured body just clangs)
    if (game.boss && !this.hitSet.has(game.boss)) {
      const hit = game.boss.meleeHit(this, { dmg, reach: w.reach, arc: w.arc, element: w.element }, game, this._swingId);
      if (hit) { this.hitSet.add(game.boss); game.addCombo(1); }
    }
    // cut grass / hit boulders in arc
    game.world.forEachObjectIn(this.x - w.reach - 8, this.y - w.reach - 8, this.x + w.reach + 8, this.y + w.reach + 8, (o) => {
      if (o.dead) return;
      const d = dist(this.x, this.y, o.x, o.y);
      if (d > w.reach + (o.r || 6)) return;
      const toO = angleTo(this.x, this.y, o.x, o.y);
      if (Math.abs(angDiff(ang, toO)) > w.arc / 2 + 0.2) return;
      if (o.cut && !o._cutHit) { o._cutHit = true; game.cutGrass(o); }
      else if (o.breakable && w.type === 'claymore') { /* claymore can smash boulders slowly */ o.hp -= 0.34; game.particles.hit(o.x, o.y - 6); if (o.hp <= 0) game.breakBoulder(o); }
    });
  }

  _shootBow(game) {
    if (!this.hasBow) { if (this.toastCd <= 0) { game.toast('You need a bow.'); this.toastCd = 2; } return; }
    if (this.arrows <= 0) { if (this.toastCd <= 0) { game.toast('Out of arrows!'); this.toastCd = 2; } return; }
    if (this.attackCd > 0) return;
    this.attackCd = 0.35;
    this.arrows--;
    let ang = this.aim;
    if (game.input.mouse.moved) ang = angleTo(this.x, this.y, game.mouseWorld.x, game.mouseWorld.y);
    this.facing = facingFromVec(Math.cos(ang), Math.sin(ang));
    game.spawnProjectile(new Projectile(this.x, this.y, ang, 'arrow', game));
    game.audio.play('bow');
  }

  _throwBomb(game) {
    if (this.bombCd > 0) return;
    this.bombCd = this.bombReady;
    const f = vecFromFacing(this.facing);
    const b = new Projectile(this.x + f.x * 10, this.y + f.y * 10, this.aim, 'bomb', game);
    b.vx = f.x * 90; b.vy = f.y * 90;
    game.spawnProjectile(b);
    game.audio.play('bomb');
  }

  quickEat(game) {
    let kind = null;
    if (this.food.cooked > 0) kind = 'cooked';
    else if (this.food.meat > 0) kind = 'meat';
    else if (this.food.mushroom > 0) kind = 'mushroom';
    else if (this.food.apple > 0) kind = 'apple';
    if (!kind) { if (this.toastCd <= 0) { game.toast('No food to eat.'); this.toastCd = 2; } return; }
    if (this.health >= this.maxHearts && kind !== 'cooked') { if (this.toastCd <= 0) { game.toast('Health already full.'); this.toastCd = 2; } return; }
    this.food[kind]--;
    const heals = { apple: 0.5, mushroom: 0.75, meat: 1.5, cooked: 3 };
    this.heal(heals[kind]);
    if (kind === 'cooked') this.coldResist = 60; // cooked meals warm you
    game.audio.play('heart');
    game.particles.heal(this.x, this.y);
    game.toast('Ate ' + kind + (kind === 'cooked' ? ' (warm!)' : '') + '.');
  }

  damage(amount, kx, ky, game, ignoreInvuln) {
    if (this.state === 'dead' || this.state === 'glide') return;
    if (this.invuln > 0 && !ignoreInvuln) return;
    this.health = Math.max(0, this.health - amount);
    if (!ignoreInvuln) {
      this.invuln = 0.8;
      const l = Math.hypot(kx, ky) || 1;
      this.kbx = (kx / l) * 150; this.kby = (ky / l) * 150;
    }
    game.audio.play('hurt');
    game.shake(4);
    if (this.health <= 0) this._die(game);
  }

  _die(game) {
    this.state = 'dead';
    this.deadTimer = 2.2;
    game.audio.play('enemyDie');
    game.onPlayerDied();
  }

  respawnNow(game) {
    this.state = 'normal';
    this.x = this.respawn.x; this.y = this.respawn.y;
    this.health = this.maxHearts;
    this.stamina = this.maxStamina;
    this.staminaLock = false;
    this.invuln = 1.5;
    this.kbx = this.kby = 0;
    this.temp = 0;
  }

  /* ---------------- rendering ---------------- */
  draw(ctx, game) {
    const x = Math.round(this.x), y = Math.round(this.y);
    const swim = this.state === 'swim';
    const climb = this.state === 'climb';
    const glide = this.state === 'glide';

    // shadow
    if (!swim && !glide) {
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(x, y + 6, 6, 3, 0, 0, TAU); ctx.fill();
    }

    // awakening: golden flame aura around Link
    if (this.awaken > 0) {
      const tt = game._time;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * TAU + tt * 4;
        const rr = 11 + Math.sin(tt * 12 + i) * 3;
        ctx.fillStyle = `rgba(255,${200 + (i % 2) * 40},90,0.5)`;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * 6, y - 2 + Math.sin(a) * 6);
        ctx.lineTo(x + Math.cos(a) * rr, y - 2 + Math.sin(a) * rr);
        ctx.lineTo(x + Math.cos(a + 0.4) * 6, y - 2 + Math.sin(a + 0.4) * 6);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }

    // flashing on i-frames
    if (this.invuln > 0 && Math.floor(this.invuln * 20) % 2 === 0 && this.state !== 'dead') {
      // skip drawing body this frame (blink)
    } else {
      ctx.save();
      ctx.translate(x, y);
      const bob = Math.sin(this.walkPhase) * (this.state === 'normal' || climb ? 1 : 0);
      if (this.state === 'dead') { ctx.globalAlpha = clamp(this.deadTimer / 2.2, 0, 1); ctx.rotate(0.4); }
      this._drawLink(ctx, bob, swim, climb, glide, game);
      ctx.restore();
    }

    // glide sail (drawn after body, above)
    if (glide) {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#c8703a';
      ctx.beginPath(); ctx.moveTo(-14, -18); ctx.quadraticCurveTo(0, -26, 14, -18); ctx.lineTo(9, -14); ctx.quadraticCurveTo(0, -18, -9, -14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e0b060';
      ctx.fillRect(-2, -18, 4, 4);
      ctx.strokeStyle = '#5a3d22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-3, -4); ctx.moveTo(9, -14); ctx.lineTo(3, -4); ctx.stroke();
      ctx.restore();
    }
  }

  _drawLink(ctx, bob, swim, climb, glide, game) {
    const f = this.facing;
    const flip = f === 'left';
    if (flip) ctx.scale(-1, 1);
    const side = (f === 'left' || f === 'right');
    const up = f === 'up';

    const skin = '#e8b98a', tunic = '#3f8f4a', tunicD = '#2f7038', hair = '#c8912f', cap = '#3f8f4a', boot = '#6b4a2b';
    const legPhase = Math.sin(this.walkPhase);

    if (swim) {
      // ripple + upper body only
      ctx.strokeStyle = 'rgba(220,240,255,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 5, 8, 3, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = tunic; ctx.fillRect(-4, -2, 8, 6);
      // head
      ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -6, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = cap; ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(4, -8); ctx.lineTo(6, -14); ctx.closePath(); ctx.fill();
      if (!up) { ctx.fillStyle = '#222'; ctx.fillRect(1, -7, 1.4, 1.4); }
      return;
    }

    // legs
    ctx.fillStyle = boot;
    if (climb) {
      ctx.fillRect(-4, 0, 3, 6 + Math.max(0, legPhase) * 2);
      ctx.fillRect(1, 0, 3, 6 + Math.max(0, -legPhase) * 2);
    } else {
      ctx.fillRect(-3.5, 2 + bob, 3, 5 + legPhase * 1.5);
      ctx.fillRect(0.5, 2 + bob, 3, 5 - legPhase * 1.5);
    }

    // body / tunic
    ctx.fillStyle = tunic;
    ctx.beginPath();
    ctx.moveTo(-5, 3 + bob); ctx.lineTo(5, 3 + bob); ctx.lineTo(4, -4 + bob); ctx.lineTo(-4, -4 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = tunicD; ctx.fillRect(-1, -4 + bob, 2, 7); // center seam
    ctx.fillStyle = '#caa24a'; ctx.fillRect(-5, 1 + bob, 10, 1.5); // belt

    // arms (attack pose reaches out)
    ctx.fillStyle = skin;
    if (this.attackT > 0) {
      ctx.fillRect(3, -3 + bob, 4, 2.5);
    } else {
      ctx.fillRect(-6, -2 + bob, 2.5, 4);
      ctx.fillRect(3.5, -2 + bob, 2.5, 4);
    }

    // head
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(0, -8 + bob, 4.2, 0, TAU); ctx.fill();
    // hair
    ctx.fillStyle = hair;
    if (up) { ctx.beginPath(); ctx.arc(0, -8 + bob, 4.4, 0, TAU); ctx.fill(); }
    else { ctx.fillRect(-4.4, -11 + bob, 8.8, 3); ctx.fillRect(-4.6, -9 + bob, 2, 4); }
    // cap
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.moveTo(-4.6, -9 + bob); ctx.lineTo(4.6, -9 + bob); ctx.lineTo(side ? 9 : 2, -17 + bob); ctx.closePath(); ctx.fill();
    // face
    if (!up) {
      ctx.fillStyle = '#3a2a1a';
      if (side) { ctx.fillRect(2, -8 + bob, 1.4, 1.6); }
      else { ctx.fillRect(-2.4, -8 + bob, 1.4, 1.6); ctx.fillRect(1, -8 + bob, 1.4, 1.6); }
    }

    // weapon swing arc
    if (this.attackT > 0) {
      const w = this.swingWeapon || this.weapon;
      // draw relative to un-flipped space using aim; simplest: draw a slash arc in facing
      ctx.save();
      // aim relative to sprite: if flipped we already scaled; approximate by facing
      const baseAng = up ? -HALF_PI : (side ? 0 : HALF_PI);
      ctx.rotate(baseAng + this.swingArc);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -2, w.reach * 0.7, -0.5, 0.5); ctx.stroke();
      // weapon icon along the arc
      const icon = game.sprites.icon[w.icon];
      if (icon) { ctx.drawImage(icon, w.reach * 0.55 - 8, -2 - 8); }
      ctx.restore();
    }

    if (climb) {
      // reaching arms up
      ctx.fillStyle = skin;
      ctx.fillRect(-5, -10 + bob, 2.5, 4);
      ctx.fillRect(2.5, -12 + bob, 2.5, 4);
    }
  }
}

function rand(a, b) { return a + Math.random() * (b - a); }


/* ===== js/entities/enemy.js ===== */
'use strict';
/* enemy.js — enemy types with a small state machine (idle/patrol → chase →
   attack → hurt → dead). Bokoblins & Chuchus melee, Keese fly, Octoroks shoot. */

const ENEMY_TYPES = {
  bokoblin:      { hp: 6,  speed: 48, dmg: 0.75, sight: 180, atk: 18, rad: 7, ranged: false, fly: false, color: '#b25a3a', color2: '#d67a4a', name: 'Bokoblin' },
  bokoblin_blue: { hp: 11, speed: 54, dmg: 1.0,  sight: 200, atk: 18, rad: 7.5, ranged: false, fly: false, color: '#4a6fb2', color2: '#6a92d6', name: 'Blue Bokoblin' },
  chuchu:        { hp: 4,  speed: 28, dmg: 0.5,  sight: 140, atk: 14, rad: 7, ranged: false, fly: false, color: '#4aa0d6', color2: '#8fd0f0', name: 'Chuchu' },
  keese:         { hp: 2,  speed: 74, dmg: 0.5,  sight: 210, atk: 12, rad: 5, ranged: false, fly: true,  color: '#5a4a6a', color2: '#8a7aa0', name: 'Keese' },
  octorok:       { hp: 5,  speed: 32, dmg: 0.75, sight: 230, atk: 150, rad: 7, ranged: true, fly: false, color: '#b28a4a', color2: '#d6b06a', name: 'Octorok' },
};

class Enemy {
  constructor(x, y, kind, game) {
    const t = ENEMY_TYPES[kind] || ENEMY_TYPES.bokoblin;
    this.kind = kind; this.def = t;
    this.x = x; this.y = y; this.hx = x; this.hy = y; // home
    this.rad = t.rad;
    this.hp = t.hp; this.maxHp = t.hp;
    this.state = 'idle';
    this.vx = 0; this.vy = 0;
    this.kbx = 0; this.kby = 0;
    this.hurtT = 0;
    this.flash = 0;
    this.touchCd = 0;
    this.shootCd = rand(0.5, 1.5);
    this.wanderT = 0; this.wx = 0; this.wy = 0;
    this.bob = Math.random() * TAU;
    this.aggro = false;
    this.deadT = 0;
    this.facing = 1; // -1 left, 1 right
    this.camp = null; // reference to camp if part of one
    this.attackWind = 0;
    this.alertPing = 0;
    this.status = null; this.statusT = 0; this.burnTick = 0; // fire/ice/shock
    this.isWanderer = false;
  }

  get alive() { return this.state !== 'dead'; }
  get disabled() { return this.statusT > 0 && (this.status === 'ice' || this.status === 'shock'); }

  applyStatus(element, game) {
    if (element === 'fire') { this.status = 'fire'; this.statusT = 3; this.burnTick = 0.4; }
    else if (element === 'ice') { this.status = 'ice'; this.statusT = 1.6; game.particles.burst(this.x, this.y - 2, '#7ad0ff', 6); }
    else if (element === 'shock') { this.status = 'shock'; this.statusT = 0.9; game.particles.burst(this.x, this.y - 2, '#ffe14a', 8); }
  }

  damage(dmg, kx, ky, knock, game) {
    if (this.state === 'dead') return;
    if (this.status === 'ice' && this.statusT > 0) dmg *= 1.5; // frozen foes take extra
    this.hp -= dmg;
    this.flash = 0.12;
    this.hurtT = 0.22;
    this.aggro = true;
    const l = Math.hypot(kx, ky) || 1;
    this.kbx += (kx / l) * knock; this.kby += (ky / l) * knock;
    game.particles.hit(this.x, this.y - 4);
    if (game.addFloater) game.addFloater(this.x, this.y - 8, Math.max(1, Math.round(dmg)), '#ffe27a', { size: 13 });
    if (this.hp <= 0) this._die(game);
  }

  _die(game) {
    this.state = 'dead';
    this.deadT = 0.4;
    game.audio.play('enemyDie');
    game.particles.burst(this.x, this.y - 4, this.def.color2, 14);
    game.onEnemyDeath(this);
  }

  update(dt, game) {
    if (this.state === 'dead') { this.deadT -= dt; return; }
    const p = game.player;
    this.bob += dt * 6;
    this.flash = Math.max(0, this.flash - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.touchCd = Math.max(0, this.touchCd - dt);
    this.shootCd = Math.max(0, this.shootCd - dt);
    this.alertPing = Math.max(0, this.alertPing - dt);

    // elemental status
    if (this.statusT > 0) {
      this.statusT -= dt;
      if (this.status === 'fire') {
        this.burnTick -= dt;
        if (this.burnTick <= 0) { this.burnTick = 0.4; this.hp -= 1; game.particles.burst(this.x, this.y - 4, '#ff7a3a', 3); if (game.addFloater) game.addFloater(this.x, this.y - 6, '1', '#ff9a4a', { size: 10 }); if (this.hp <= 0) { this._die(game); return; } }
      }
      if (this.statusT <= 0) this.status = null;
    }

    // knockback
    if (Math.abs(this.kbx) > 2 || Math.abs(this.kby) > 2) {
      const opts = { deepSolid: !this.def.fly };
      const res = game.world.moveCircle(this.x, this.y, this.rad, this.kbx * dt, this.kby * dt, opts);
      this.x = res.x; this.y = res.y;
      this.kbx *= Math.pow(0.0005, dt); this.kby *= Math.pow(0.0005, dt);
    }
    if (this.hurtT > 0) return; // stunned
    if (this.disabled) return;  // frozen / shocked: cannot act

    const d = dist(this.x, this.y, p.x, p.y);
    const canSee = p.alive && d < this.def.sight && p.state !== 'glide';
    if (canSee) { if (!this.aggro) { this.aggro = true; this.alertPing = 0.6; } }
    // lose interest if far from home and player gone
    if (!canSee && d > this.def.sight * 1.4) this.aggro = false;

    let mvx = 0, mvy = 0;
    const t = this.def;

    if (this.aggro && p.alive) {
      const toP = angleTo(this.x, this.y, p.x, p.y);
      if (t.ranged) {
        // keep mid distance and shoot
        if (d < 80) { mvx = -Math.cos(toP); mvy = -Math.sin(toP); }
        else if (d > 170) { mvx = Math.cos(toP); mvy = Math.sin(toP); }
        if (d < t.sight && this.shootCd <= 0) {
          this.shootCd = rand(1.6, 2.4);
          const proj = new Projectile(this.x, this.y - 4, toP, 'rock', game);
          proj.fromEnemy = true; proj.dmg = t.dmg;
          game.spawnProjectile(proj);
        }
      } else if (t.fly) {
        // erratic swoop
        const wob = Math.sin(this.bob * 1.7) * 0.6;
        mvx = Math.cos(toP + wob); mvy = Math.sin(toP + wob);
      } else {
        mvx = Math.cos(toP); mvy = Math.sin(toP);
        // lunge windup when close
        if (d < t.atk + p.rad + 6) { this.attackWind = Math.min(0.3, this.attackWind + dt); }
        else this.attackWind = Math.max(0, this.attackWind - dt);
      }
      if (mvx !== 0) this.facing = mvx < 0 ? -1 : 1;
    } else {
      // wander near home
      this.wanderT -= dt;
      if (this.wanderT <= 0) {
        this.wanderT = rand(1.2, 3.0);
        if (Math.random() < 0.5) { this.wx = this.wy = 0; }
        else {
          const a = Math.random() * TAU;
          this.wx = Math.cos(a); this.wy = Math.sin(a);
        }
      }
      // return toward home if strayed
      const dh = dist(this.x, this.y, this.hx, this.hy);
      if (dh > 90) { const toH = angleTo(this.x, this.y, this.hx, this.hy); this.wx = Math.cos(toH); this.wy = Math.sin(toH); }
      mvx = this.wx * 0.5; mvy = this.wy * 0.5;
      if (mvx !== 0) this.facing = mvx < 0 ? -1 : 1;
    }

    let sp = t.speed * (this.aggro ? 1 : 0.6);
    if (mvx !== 0 || mvy !== 0) {
      const opts = { deepSolid: !t.fly, cliffSolid: true };
      const res = game.world.moveCircle(this.x, this.y, this.rad, mvx * sp * dt, mvy * sp * dt, opts);
      this.x = res.x; this.y = res.y;
    }

    // contact damage
    if (!t.ranged && p.alive && this.touchCd <= 0) {
      if (circlesOverlap(this.x, this.y, this.rad, p.x, p.y, p.rad + 1)) {
        this.touchCd = 0.8;
        const k = angleTo(p.x, p.y, this.x, this.y);
        // knock player AWAY from enemy
        p.damage(t.dmg, p.x - this.x, p.y - this.y, game);
      }
    }
  }

  draw(ctx, game) {
    const x = Math.round(this.x), y = Math.round(this.y);
    const t = this.def;
    if (this.state === 'dead') {
      const a = clamp(this.deadT / 0.4, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = t.color2;
      const s = 1 + (1 - a) * 0.6;
      ctx.beginPath(); ctx.arc(x, y - 4, this.rad * s, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y + 5, this.rad * 0.9, this.rad * 0.4, 0, 0, TAU); ctx.fill();

    const bobY = t.fly ? Math.sin(this.bob) * 3 : Math.abs(Math.sin(this.bob)) * 1.5;
    ctx.save(); ctx.translate(x, y - bobY);
    const flash = this.flash > 0;
    const body = flash ? '#ffffff' : t.color;
    const body2 = flash ? '#ffffff' : t.color2;

    if (this.kind === 'keese') {
      // bat
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, 0, this.rad, 0, TAU); ctx.fill();
      const wf = Math.sin(this.bob * 3) * 3;
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-11, -4 - wf); ctx.lineTo(-4, 3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(11, -4 - wf); ctx.lineTo(4, 3); ctx.closePath(); ctx.fill();
      if (!flash) { ctx.fillStyle = '#ffcf3a'; ctx.fillRect(-2, -1, 1.6, 1.6); ctx.fillRect(1, -1, 1.6, 1.6); }
    } else if (this.kind === 'chuchu') {
      // gel blob
      const sq = 1 + Math.sin(this.bob) * 0.12;
      ctx.fillStyle = css(withAlpha(body2), 0.9);
      ctx.beginPath(); ctx.ellipse(0, 0, this.rad * (2 - sq) * 0.8, this.rad * sq, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.ellipse(0, 1, this.rad * (2 - sq) * 0.6, this.rad * sq * 0.7, 0, 0, TAU); ctx.fill();
      if (!flash) { ctx.fillStyle = '#12324a'; ctx.fillRect(-3, -2, 1.6, 1.6); ctx.fillRect(1.4, -2, 1.6, 1.6); }
    } else if (this.kind === 'octorok') {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, -2, this.rad, 0, TAU); ctx.fill();
      // tentacles
      ctx.strokeStyle = body2; ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 3, 3); ctx.lineTo(i * 4, 7 + Math.sin(this.bob + i) * 1.5); ctx.stroke(); }
      // snout
      ctx.fillStyle = body2; ctx.fillRect(this.facing * 4 - 1, -4, 3, 3);
      if (!flash) { ctx.fillStyle = '#2a1a0a'; ctx.fillRect(-2, -4, 1.5, 1.5); ctx.fillRect(1, -4, 1.5, 1.5); }
    } else {
      // bokoblin: pig-goblin
      ctx.scale(this.facing, 1);
      // legs
      ctx.fillStyle = '#5a3a2a';
      const lp = Math.sin(this.bob) * 1.5;
      ctx.fillRect(-4, 2, 3, 4 + lp); ctx.fillRect(1, 2, 3, 4 - lp);
      // body
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.ellipse(0, -1, this.rad, this.rad * 1.05, 0, 0, TAU); ctx.fill();
      // belly
      ctx.fillStyle = body2; ctx.beginPath(); ctx.ellipse(0, 1, this.rad * 0.6, this.rad * 0.7, 0, 0, TAU); ctx.fill();
      // head
      ctx.fillStyle = body; ctx.beginPath(); ctx.arc(2, -7, 4.4, 0, TAU); ctx.fill();
      // snout
      ctx.fillStyle = body2; ctx.beginPath(); ctx.arc(5, -6, 2, 0, TAU); ctx.fill();
      // ear/horn
      ctx.fillStyle = '#3a2416'; ctx.beginPath(); ctx.moveTo(-1, -10); ctx.lineTo(1, -13); ctx.lineTo(2, -9); ctx.closePath(); ctx.fill();
      if (!flash) { ctx.fillStyle = '#ffe14a'; ctx.fillRect(2.5, -8, 1.6, 1.6); }
      // club when attacking
      if (this.attackWind > 0.15) { ctx.fillStyle = '#6b4a2b'; ctx.save(); ctx.translate(6, -4); ctx.rotate(-this.attackWind * 2); ctx.fillRect(0, -1.5, 8, 3); ctx.restore(); }
    }
    ctx.restore();

    // alert '!'
    if (this.alertPing > 0) {
      ctx.fillStyle = '#ffd23a'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('!', x, y - this.rad - 10 - bobY);
    }
    // hp bar when damaged
    if (this.hp < this.maxHp && this.state !== 'dead') {
      const w = 18, hpx = x - w / 2, hpy = y - this.rad - 8 - bobY;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(hpx, hpy, w, 3);
      ctx.fillStyle = '#e0483a'; ctx.fillRect(hpx, hpy, w * clamp(this.hp / this.maxHp, 0, 1), 3);
    }
  }
}

function withAlpha(hexOrRgb) {
  // accept '#rrggbb' -> {r,g,b}
  if (typeof hexOrRgb === 'string') {
    const h = hexOrRgb.replace('#', '');
    return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
  }
  return hexOrRgb;
}


/* ===== js/entities/pickup.js ===== */
'use strict';
/* pickup.js — collectible items dropped in the world (hearts, rupees, arrows,
   food, korok seeds, weapons). Bob, magnetize to the player, auto-collect. */

const PICKUP_ICON = {
  heart: 'heart', rupeeG: 'rupeeGreen', rupeeB: 'rupeeBlue', rupeeR: 'rupeeRed',
  arrows: 'arrow', apple: 'apple', meat: 'meat', mushroom: 'mushroom', korok: 'korok',
  stamina: 'stamina', bomb: 'bomb',
};

class Pickup {
  constructor(x, y, type, key) {
    this.x = x; this.y = y;
    this.type = type;         // heart|rupeeG|...|weapon
    this.key = key || null;   // weapon key when type==='weapon'
    this.dead = false;
    this.bob = Math.random() * TAU;
    this.spawnPop = 1;        // launch animation
    this.vx = rand(-24, 24); this.vy = rand(-30, -10);
    this.life = 30;           // seconds before it fades (koroks/weapons never expire)
    this.persistent = (type === 'korok' || type === 'weapon');
    this.z = 6;               // hop height
    this.vz = rand(30, 60);
    this.settled = false;
  }

  update(dt, game) {
    this.bob += dt * 4;
    if (this.spawnPop > 0) this.spawnPop = Math.max(0, this.spawnPop - dt * 3);
    // little hop physics for a nice pop
    if (!this.settled) {
      this.z += this.vz * dt; this.vz -= 220 * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= Math.pow(0.05, dt); this.vy *= Math.pow(0.05, dt);
      if (this.z <= 0) { this.z = 0; this.vz *= -0.4; if (Math.abs(this.vz) < 12) { this.settled = true; this.vz = 0; } }
    }
    if (!this.persistent) {
      this.life -= dt;
      if (this.life <= 0) { this.dead = true; return; }
    }
    const p = game.player;
    if (!p.alive) return;
    const d = dist(this.x, this.y, p.x, p.y);
    if (d < 40 && this.settled) {
      // magnetize
      const a = angleTo(this.x, this.y, p.x, p.y);
      const pull = (1 - d / 40) * 160;
      this.x += Math.cos(a) * pull * dt;
      this.y += Math.sin(a) * pull * dt;
    }
    if (d < p.rad + 7) this._collect(game);
  }

  _collect(game) {
    const p = game.player;
    this.dead = true;
    switch (this.type) {
      case 'heart': p.heal(1); game.audio.play('heart'); break;
      case 'rupeeG': p.rupees += 1; game.audio.play('rupee'); break;
      case 'rupeeB': p.rupees += 5; game.audio.play('rupee'); break;
      case 'rupeeR': p.rupees += 20; game.audio.play('rupee'); break;
      case 'arrows': p.arrows += 5; game.audio.play('pickup'); game.toast('+5 Arrows'); break;
      case 'apple': p.addFood('apple'); game.audio.play('pickup'); break;
      case 'meat': p.addFood('meat'); game.audio.play('pickup'); break;
      case 'mushroom': p.addFood('mushroom'); game.audio.play('pickup'); break;
      case 'korok': p.koroks += 1; game.audio.play('korok'); game.toast('Ya-ha-ha! Korok seeds: ' + p.koroks); break;
      case 'weapon': p.giveWeapon(this.key); game.audio.play('pickup'); game.toast('Got ' + makeWeapon(this.key).name + '!'); break;
      default: game.audio.play('pickup');
    }
    game.particles.spark(this.x, this.y);
  }

  draw(ctx, game) {
    const iconName = this.type === 'weapon' ? makeWeapon(this.key).icon : PICKUP_ICON[this.type];
    const icon = game.sprites.icon[iconName];
    const bobY = Math.sin(this.bob) * 1.5;
    const yy = this.y - this.z - bobY;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, 5 - this.z * 0.05, 2, 0, 0, TAU); ctx.fill();
    if (this.type === 'korok') {
      // gentle glow
      ctx.fillStyle = 'rgba(150,220,120,0.25)';
      ctx.beginPath(); ctx.arc(this.x, yy, 9, 0, TAU); ctx.fill();
    }
    if (icon) {
      const s = 1 + this.spawnPop * 0.6;
      ctx.drawImage(icon, Math.round(this.x - 8 * s), Math.round(yy - 8 * s), 16 * s, 16 * s);
    }
    // blink when about to expire
    if (!this.persistent && this.life < 5 && Math.floor(this.life * 6) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(this.x - 8, yy - 8, 16, 16);
    }
  }
}


/* ===== js/entities/boss.js ===== */
'use strict';
/* boss.js — Stone Talus: a hulking rock golem. Its body is armoured (melee just
   clangs); damage lands only on the glowing ore weak-point that rotates around
   it. It stomps a shockwave and hurls boulders. Beating it grants a Heart
   Container and a mighty elemental weapon. */

class Boss {
  constructor(x, y, game, ref) {
    this.x = x; this.y = y;
    this.ref = ref;             // the world talus marker
    this.rad = 26;
    this.maxHp = 140; this.hp = 140;
    this.state = 'active';      // active | slam | hurt | dead
    this.dead = false; this.deadT = 0;
    this.oreAng = 0;            // ore orbit angle
    this.oreDist = 26;
    this.bodyBob = 0;
    this.moveT = 0; this.mvx = 0; this.mvy = 0;
    this.attackT = rand(2, 4);
    this.slamT = 0;             // slam windup timer
    this.flash = 0;
    this.hurtT = 0;
    this.hitBy = null;          // swing id that already struck the ore
    this.clangedBy = null;      // swing id that already clanged the body
    this.rageShown = false;
  }

  get alive() { return this.state !== 'dead'; }
  orePos() { return { x: this.x + Math.cos(this.oreAng) * this.oreDist, y: this.y - 10 + Math.sin(this.oreAng) * this.oreDist * 0.5 }; }

  update(dt, game) {
    if (this.state === 'dead') { this.deadT -= dt; return; }
    const p = game.player;
    this.bodyBob += dt * 3;
    this.flash = Math.max(0, this.flash - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    // ore rotates faster when enraged (low hp)
    const rage = this.hp < this.maxHp * 0.4;
    this.oreAng += dt * (rage ? 1.1 : 0.6);
    if (rage && !this.rageShown) { this.rageShown = true; game.toast('The Talus is enraged!'); game.shake(6); }

    const d = dist(this.x, this.y, p.x, p.y);

    // slow lumbering pursuit
    this.moveT -= dt;
    if (this.moveT <= 0) { this.moveT = rand(1.5, 3); const a = angleTo(this.x, this.y, p.x, p.y) + rand(-0.6, 0.6); this.mvx = Math.cos(a); this.mvy = Math.sin(a); }
    if (this.state === 'active') {
      const sp = rage ? 26 : 18;
      const res = game.world.moveCircle(this.x, this.y, this.rad, this.mvx * sp * dt, this.mvy * sp * dt, { deepSolid: true });
      this.x = res.x; this.y = res.y;
    }

    // attacks
    this.attackT -= dt;
    if (this.state === 'active' && this.attackT <= 0) {
      if (d < 90) { this.state = 'slam'; this.slamT = 0.8; }
      else { this._throw(game); this.attackT = rand(2.2, 3.5); }
    }
    if (this.state === 'slam') {
      this.slamT -= dt;
      if (this.slamT <= 0) {
        this.state = 'active'; this.attackT = rand(2.5, 4);
        game.shake(10); game.audio.play('explode');
        game.particles.explosion(this.x, this.y + 8);
        game.addLight(this.x, this.y, 120, [200, 170, 120], 0.3);
        // shockwave ring damage
        if (p.alive && dist(this.x, this.y, p.x, p.y) < 74) {
          const k = angleTo(this.x, this.y, p.x, p.y);
          p.damage(1.5, Math.cos(k), Math.sin(k), game);
        }
      }
    }

    // contact shove
    if (p.alive && circlesOverlap(this.x, this.y, this.rad, p.x, p.y, p.rad) && p.invuln <= 0) {
      const k = angleTo(this.x, this.y, p.x, p.y);
      p.damage(1, Math.cos(k), Math.sin(k), game);
    }
  }

  _throw(game) {
    const p = game.player;
    const a = angleTo(this.x, this.y - 10, p.x, p.y);
    const pr = new Projectile(this.x, this.y - 14, a, 'rock', game);
    pr.fromEnemy = true; pr.dmg = 1.25; pr.rad = 6;
    pr.vx = Math.cos(a) * 130; pr.vy = Math.sin(a) * 130;
    game.spawnProjectile(pr);
    game.audio.play('bomb');
  }

  // melee from the player. Returns true if the ore was struck.
  meleeHit(player, w, game, swingId) {
    if (this.state === 'dead') return false;
    const ore = this.orePos();
    const ang = player.aim;
    const dOre = dist(player.x, player.y, ore.x, ore.y);
    const toOre = angleTo(player.x, player.y, ore.x, ore.y);
    const dBody = dist(player.x, player.y, this.x, this.y);
    // the ore weak-point (damageable once per swing) — checked first so an
    // earlier body-clang this swing never locks it out
    if (this.hitBy !== swingId && dOre < w.reach + 10 && Math.abs(angDiff(ang, toOre)) < w.arc / 2 + 0.4) {
      this.hitBy = swingId;
      this._takeDamage(w.dmg * 2, ore.x, ore.y, game);
      return true;
    }
    // the armoured body just clangs (dedup'd separately from the ore)
    if (this.clangedBy !== swingId && dBody < w.reach + this.rad && Math.abs(angDiff(ang, angleTo(player.x, player.y, this.x, this.y))) < w.arc / 2 + 0.3) {
      this.clangedBy = swingId;
      game.particles.spark(player.x + Math.cos(ang) * this.rad, player.y + Math.sin(ang) * this.rad);
      game.audio.play('break');
      game.addFloater(this.x, this.y - 30, 'clang!', '#c8c8c8', { size: 11 });
    }
    return false;
  }

  // arrow / projectile hit test (called from Projectile)
  projHit(px, py, dmg, game) {
    if (this.state === 'dead') return false;
    const ore = this.orePos();
    if (dist(px, py, ore.x, ore.y) < 12) { this._takeDamage(dmg * 2, ore.x, ore.y, game); return true; }
    if (dist(px, py, this.x, this.y) < this.rad) { game.particles.spark(px, py); return true; } // blocked by body
    return false;
  }

  _takeDamage(amount, hx, hy, game) {
    this.hp -= amount;
    this.flash = 0.12; this.hurtT = 0.15;
    game.particles.burst(hx, hy, '#f0c060', 12);
    game.audio.play('hit');
    game.hitStop(0.05); game.shake(4);
    game.addFloater(hx, hy - 8, Math.round(amount), '#ffe27a', { size: 15 });
    game.player.awakenGain(0.04);
    if (this.hp <= 0) this._die(game);
  }

  _die(game) {
    this.state = 'dead'; this.dead = true; this.deadT = 1.4;
    if (this.ref) this.ref.defeated = true;
    game.audio.play('enemyDie'); game.shake(12);
    game.particles.explosion(this.x, this.y);
    for (let i = 0; i < 5; i++) game.particles.burst(this.x + rand(-20, 20), this.y + rand(-16, 16), '#8b857e', 14);
    // rewards
    const p = game.player;
    p.maxHearts++; p.heal(p.maxHearts);
    game.toast('Stone Talus defeated! ♥ Heart Container obtained!');
    const elem = game.rngPick(['fire', 'ice', 'shock']);
    game.spawnPickup(this.x, this.y + 6, 'weapon', 'claymore_' + elem);
    for (let i = 0; i < 6; i++) game.spawnPickup(this.x + rand(-20, 20), this.y + rand(-10, 10), 'rupeeR');
    game.spawnPickup(this.x, this.y, 'heart');
  }

  draw(ctx, game) {
    const x = Math.round(this.x), y = Math.round(this.y);
    if (this.state === 'dead') {
      ctx.globalAlpha = clamp(this.deadT / 1.4, 0, 1);
    }
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(x, y + 14, this.rad * 1.1, this.rad * 0.45, 0, 0, TAU); ctx.fill();

    const lift = this.state === 'slam' ? -Math.sin((0.8 - this.slamT) / 0.8 * Math.PI) * 8 : 0;
    const by = y + lift + Math.sin(this.bodyBob) * 1.2;
    const flash = this.flash > 0;

    // rocky body (cluster of boulders)
    const base = flash ? '#efe8dc' : '#7d766e';
    const lite = flash ? '#ffffff' : '#948d84';
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.moveTo(x - this.rad, by + 10);
    ctx.lineTo(x - this.rad + 4, by - this.rad);
    ctx.lineTo(x - 6, by - this.rad - 6);
    ctx.lineTo(x + 10, by - this.rad);
    ctx.lineTo(x + this.rad, by - 4);
    ctx.lineTo(x + this.rad - 3, by + 12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = lite;
    ctx.beginPath(); ctx.moveTo(x - 10, by - 14); ctx.lineTo(x + 4, by - 20); ctx.lineTo(x + 12, by - 8); ctx.lineTo(x - 2, by - 2); ctx.closePath(); ctx.fill();
    // eyes
    if (!flash) { ctx.fillStyle = '#ffcf3a'; ctx.fillRect(x - 8, by - 6, 3, 3); ctx.fillRect(x + 4, by - 6, 3, 3); }
    // legs
    ctx.fillStyle = flash ? '#efe8dc' : '#635d57';
    ctx.fillRect(x - 14, by + 8, 7, 8); ctx.fillRect(x + 7, by + 8, 7, 8);

    // ore weak-point
    const ore = this.orePos();
    const ox = Math.round(ore.x), oy = Math.round(ore.y + lift);
    ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.arc(ox, oy, 7, 0, TAU); ctx.fill();
    const glow = 0.6 + Math.sin(game._time * 6) * 0.3;
    ctx.fillStyle = `rgba(255,${120 + glow * 80 | 0},60,1)`;
    ctx.beginPath(); ctx.arc(ox, oy, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe0a0'; ctx.beginPath(); ctx.arc(ox - 1, oy - 1, 2, 0, TAU); ctx.fill();

    // slam telegraph ring
    if (this.state === 'slam') {
      ctx.strokeStyle = `rgba(255,120,60,${0.4 + Math.sin(game._time * 30) * 0.3})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y + 6, 74, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // hp bar
    if (this.state !== 'dead') {
      const bw = 120, bx = x - bw / 2, byy = y - this.rad - 34;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bx - 2, byy - 2, bw + 4, 10);
      ctx.fillStyle = '#5a4a3a'; ctx.fillRect(bx, byy, bw, 6);
      ctx.fillStyle = '#e0642a'; ctx.fillRect(bx, byy, bw * clamp(this.hp / this.maxHp, 0, 1), 6);
      ctx.fillStyle = '#e8eef2'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('STONE TALUS', x, byy - 5);
    }
  }
}


/* ===== js/systems/daynight.js ===== */
'use strict';
/* daynight.js — advances a day/night clock and yields a colour tint plus a
   night factor used for spawns. Triggers a blood moon on some nights. */

class DayNight {
  constructor(startHour) {
    this.dayLength = 200;         // real seconds per 24h
    this.time = startHour === undefined ? 8 : startHour; // hours 0..24
    this.day = 1;
    this.bloodMoon = 0;           // 0..1 intensity
    this._lastBloodDay = -1;      // day value the event last fired on (latch)
    this.onBloodMoon = null;
  }

  update(dt) {
    const prev = this.time;
    this.time += (dt / this.dayLength) * 24;
    if (this.time >= 24) { this.time -= 24; this.day++; }

    // Blood moon on every 3rd night, around midnight.
    const isBloodNight = (this.day % 3 === 0);
    const inWindow = (this.time >= 23.2 || this.time <= 0.6);
    if (isBloodNight && inWindow) {
      this.bloodMoon = Math.min(1, this.bloodMoon + dt * 0.5);
      // Day 3's window spans two midnights (start and end of the same day),
      // so latch on the day value to fire the event exactly once per blood night.
      if (this.bloodMoon > 0.85 && this._lastBloodDay !== this.day) {
        this._lastBloodDay = this.day;
        if (this.onBloodMoon) this.onBloodMoon();
      }
    } else {
      this.bloodMoon = Math.max(0, this.bloodMoon - dt * 0.5);
    }
  }

  // 0 = full day, 1 = deepest night
  get night() {
    const h = this.time;
    // light level curve
    let light;
    if (h >= 8 && h <= 17) light = 1;
    else if (h > 17 && h < 20) light = lerp(1, 0.12, (h - 17) / 3);
    else if (h >= 20 || h < 5) light = 0.12;
    else if (h >= 5 && h < 8) light = lerp(0.12, 1, (h - 5) / 3);
    else light = 1;
    return clamp(1 - light, 0, 1);
  }

  get phase() {
    const h = this.time;
    if (h >= 5 && h < 8) return 'Dawn';
    if (h >= 8 && h < 17) return 'Day';
    if (h >= 17 && h < 20) return 'Dusk';
    return 'Night';
  }

  // Returns a colour tint {r,g,b,a} to multiply over the scene.
  tint() {
    const n = this.night;
    // base darkening toward cool night blue
    let r = lerp(255, 70, n), g = lerp(255, 84, n), b = lerp(255, 140, n);
    // warm dawn/dusk
    const h = this.time;
    let warm = 0;
    if (h > 17 && h < 20) warm = 1 - Math.abs((h - 18.5) / 1.5);
    if (h >= 5 && h < 8) warm = 1 - Math.abs((h - 6.5) / 1.5);
    if (warm > 0) { r = lerp(r, 255, warm * 0.5); g = lerp(g, 170, warm * 0.4); b = lerp(b, 120, warm * 0.5); }
    // blood moon reddening
    if (this.bloodMoon > 0) { r = lerp(r, 200, this.bloodMoon); g = lerp(g, 40, this.bloodMoon); b = lerp(b, 40, this.bloodMoon); }
    return { r, g, b };
  }
}


/* ===== js/systems/spawner.js ===== */
'use strict';
/* spawner.js — populates enemy camps as the player approaches and keeps a
   modest population of wandering enemies around the player (more at night). */

class Spawner {
  constructor() {
    this.wanderTimer = 1.5;
  }

  update(dt, game) {
    this._camps(dt, game);
    this._wanderers(dt, game);
  }

  _camps(dt, game) {
    const p = game.player;
    for (const camp of game.world.structures.camps) {
      const d = dist(p.x, p.y, camp.x, camp.y);
      if (!camp.spawned && !camp.cleared && d < 240) {
        camp.spawned = true;
        camp.enemies = [];
        const night = game.dayNight.night > 0.5;
        for (let i = 0; i < camp.size; i++) {
          // find a walkable offset around the campfire (never in water/solids)
          let ex = camp.x, ey = camp.y;
          for (let tryp = 0; tryp < 8; tryp++) {
            const a = i / camp.size * TAU + Math.random();
            const rr = rand(18, 40);
            const cx = camp.x + Math.cos(a) * rr, cy = camp.y + Math.sin(a) * rr;
            const ti = game.world.tileInfoAtWorld(cx, cy);
            if (!ti.solid && !ti.deep) { ex = cx; ey = cy; break; }
          }
          let kind = 'bokoblin';
          if (night && Math.random() < 0.4) kind = 'bokoblin_blue';
          if (Math.random() < 0.18) kind = 'octorok';
          const e = game.spawnEnemy(ex, ey, kind);
          if (e) { e.hx = ex; e.hy = ey; e.camp = camp; camp.enemies.push(e); }
        }
        // If nothing spawned (global cap saturated), don't lock the camp as
        // "spawned but empty" — let it retry later.
        if (camp.enemies.length === 0) camp.spawned = false;
      }
      if (camp.spawned && !camp.cleared) {
        const anyAlive = camp.enemies.some(e => e.alive);
        if (!anyAlive && camp.enemies.length) {
          camp.cleared = true;
          // reward
          game.spawnPickup(camp.x, camp.y - 8, 'rupeeB');
          game.spawnPickup(camp.x + 10, camp.y - 4, 'heart');
          game.toast('Enemy camp cleared!');
        }
      }
    }
  }

  _wanderers(dt, game) {
    this.wanderTimer -= dt;
    const night = game.dayNight.night;
    const cap = 8 + Math.floor(night * 14) + (game.dayNight.bloodMoon > 0.3 ? 12 : 0);
    // count current wanderers
    let wander = 0;
    for (const e of game.enemies) if (e.isWanderer && e.alive) wander++;
    // despawn far wanderers
    const p = game.player;
    for (const e of game.enemies) {
      if (e.isWanderer && e.alive && dist(e.x, e.y, p.x, p.y) > 900) { e.state = 'dead'; e.deadT = 0; }
    }

    if (this.wanderTimer <= 0) {
      this.wanderTimer = rand(1.6, 3.2) / (1 + night);
      if (wander < cap) {
        const spawnPos = this._offscreenWalkable(game);
        if (spawnPos) {
          let kind = 'bokoblin';
          const roll = Math.random();
          if (night > 0.5) {
            if (roll < 0.25) kind = 'keese';
            else if (roll < 0.55) kind = 'bokoblin_blue';
            else if (roll < 0.7) kind = 'octorok';
            else kind = 'bokoblin';
          } else {
            if (roll < 0.15) kind = 'chuchu';
            else if (roll < 0.28) kind = 'octorok';
            else if (roll < 0.4) kind = 'keese';
            else kind = 'bokoblin';
          }
          const e = game.spawnEnemy(spawnPos.x, spawnPos.y, kind);
          if (e) { e.isWanderer = true; e.hx = spawnPos.x; e.hy = spawnPos.y; }
        }
      }
    }
  }

  _offscreenWalkable(game) {
    const p = game.player;
    const minR = game.view.w * 0.6, maxR = game.view.w * 0.85;
    for (let tries = 0; tries < 20; tries++) {
      const a = Math.random() * TAU;
      const r = rand(minR, maxR);
      const x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
      if (x < TILE * 2 || y < TILE * 2 || x > game.world.pxW - TILE * 2 || y > game.world.pxH - TILE * 2) continue;
      const t = game.world.tileInfoAtWorld(x, y);
      if (t.solid || t.deep) continue;
      // not too close to spawn safe zone
      if (dist(x, y, game.world.spawn.x, game.world.spawn.y) < 160) continue;
      return { x, y };
    }
    return null;
  }
}


/* ===== js/systems/lighting.js ===== */
'use strict';
/* lighting.js — screen-space lighting. Builds a darkness layer each frame
   (driven by day/night + weather) and punches soft light holes for the player
   torch, fires, structures and transient flashes, then adds an emissive bloom
   pass so fires/auras/shrines glow. Replaces the old flat night tint. */

class Lighting {
  constructor() {
    this.dark = null; this.dctx = null; this._w = 0; this._h = 0;
  }
  _ensure(w, h) {
    if (this.dark && this._w === w && this._h === h) return;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    this.dark = c; this.dctx = c.getContext('2d');
    this._w = w; this._h = h;
  }

  // world -> screen (CSS px) using the game's current view + zoom
  render(ctx, game) {
    const W = game.W, H = game.H, z = game.zoom, view = game.view;
    const night = game.dayNight.night;
    const gloom = game.weather ? game.weather.gloom : 0;
    const blood = game.dayNight.bloodMoon;
    const darkness = clamp(night * 0.9 + gloom * 0.55, 0, 0.94);

    // 1) gentle colour grade (dusk warmth / blood-moon red) via multiply
    const t = game.dayNight.tint();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgb(t.r, t.g, t.b);
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    const toX = (wx) => (wx - view.x) * z;
    const toY = (wy) => (wy - view.y) * z;
    const p = game.player;

    // gather warm/coloured light points for bloom
    const glows = [];
    game.world.forEachObjectIn(view.x - 40, view.y - 40, view.x + view.w + 40, view.y + view.h + 40, (o) => {
      if (o.dead) return;
      if (o.type === 'campfire' || o.type === 'cookpot') glows.push({ x: o.x, y: o.y - 6, r: 82, col: [255, 168, 74], fire: true });
      else if (o.type === 'tower') glows.push({ x: o.x, y: o.y - 88, r: 64, col: [90, 220, 210], fire: false });
      else if (o.type === 'shrine' && o.ref && o.ref.activated) glows.push({ x: o.x, y: o.y - 14, r: 60, col: [80, 210, 255], fire: false });
      else if (o.type === 'shrine') glows.push({ x: o.x, y: o.y - 14, r: 46, col: [224, 138, 58], fire: true });
    });
    for (const l of game.lights) glows.push({ x: l.x, y: l.y, r: l.r, col: l.col, transient: true, life: l.life / l.max });

    // 2) darkness layer with light holes
    if (darkness > 0.02) {
      this._ensure(W, H);
      const d = this.dctx;
      d.setTransform(1, 0, 0, 1, 0, 0);
      d.clearRect(0, 0, W, H);
      // night colour
      const nb = blood > 0.2 ? `rgba(30,6,10,${darkness})` : `rgba(8,12,30,${darkness})`;
      d.fillStyle = nb; d.fillRect(0, 0, W, H);
      d.globalCompositeOperation = 'destination-out';
      // player torch (bigger + steadier during awakening)
      const aw = p.awaken > 0;
      const flick = 0.9 + Math.sin(game._time * 12) * 0.03 + Math.sin(game._time * 27) * 0.02;
      this._hole(d, toX(p.x), toY(p.y), (aw ? 200 : 118) * z, (aw ? 0.98 : 0.9) * flick);
      for (const g of glows) {
        const fl = g.fire ? (0.88 + Math.sin(game._time * 10 + g.x) * 0.08) : 0.95;
        const a = g.transient ? Math.min(1, g.life * 1.3) : 1;
        this._hole(d, toX(g.x), toY(g.y), g.r * z, fl * a);
      }
      d.globalCompositeOperation = 'source-over';
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(this.dark, 0, 0, W, H);
      ctx.imageSmoothingEnabled = false;
    }

    // 3) emissive bloom (additive)
    ctx.globalCompositeOperation = 'lighter';
    const bloomAmt = 0.35 + darkness * 0.5;
    for (const g of glows) {
      const [r, gg, b] = g.col;
      const fl = g.fire ? (0.8 + Math.sin(game._time * 11 + g.y) * 0.15) : 1;
      const a = (g.transient ? Math.min(1, g.life) : bloomAmt) * fl;
      const rad = createGlowGrad(ctx, toX(g.x), toY(g.y), g.r * z * 0.9, r, gg, b, a);
      ctx.fillStyle = rad;
      ctx.fillRect(toX(g.x) - g.r * z, toY(g.y) - g.r * z, g.r * z * 2, g.r * z * 2);
    }
    // awakening gold aura bloom on the player
    if (p.awaken > 0) {
      const pulse = 0.5 + Math.sin(game._time * 8) * 0.12;
      const rad = createGlowGrad(ctx, toX(p.x), toY(p.y - 4), 90 * z, 255, 210, 90, pulse);
      ctx.fillStyle = rad;
      ctx.fillRect(toX(p.x) - 90 * z, toY(p.y - 4) - 90 * z, 180 * z, 180 * z);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  _hole(d, x, y, r, strength) {
    if (r <= 0) return;
    const g = d.createRadialGradient(x, y, r * 0.12, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${strength})`);
    g.addColorStop(0.7, `rgba(0,0,0,${strength * 0.5})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    d.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

function createGlowGrad(ctx, x, y, r, red, green, blue, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${red|0},${green|0},${blue|0},${a})`);
  g.addColorStop(0.5, `rgba(${red|0},${green|0},${blue|0},${a * 0.35})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  return g;
}


/* ===== js/systems/weather.js ===== */
'use strict';
/* weather.js — evolving weather: clear / cloudy / rain / storm / fog, plus
   biome snow. Storms flash lightning and — BOTW-style — can strike a player who
   is holding a metal weapon in the open. Exposes `gloom` for the light system. */

const WEATHER_STATES = ['clear', 'clear', 'cloudy', 'rain', 'fog', 'storm'];
const GLOOM = { clear: 0, cloudy: 0.14, rain: 0.32, storm: 0.5, fog: 0.4 };

class Weather {
  constructor(rng) {
    this.rng = rng || new RNG(9001);
    this.state = 'clear';
    this.next = 'clear';
    this.blend = 1;            // 0..1 transition toward `state`
    this.timer = 40;
    this.gloom = 0;
    this.rainAmt = 0;
    this.drops = [];
    this.flash = 0;            // screen flash 0..1
    this.thunderTimer = 0;
    this.strikeTimer = 12;
    this.strike = null;        // {t, x, y} pending bolt on the player
    this.snow = [];
  }

  isWet() { return this.state === 'rain' || this.state === 'storm'; }

  update(dt, game) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.state = this.next;
      this.next = this.rng.pick(WEATHER_STATES);
      this.timer = this.rng.range(35, 80);
      this.blend = 0;
    }
    this.blend = Math.min(1, this.blend + dt / 6);
    const targetGloom = GLOOM[this.state] || 0;
    this.gloom = approach(this.gloom, targetGloom, dt * 0.15);
    const targetRain = (this.state === 'rain') ? 0.7 : (this.state === 'storm') ? 1 : 0;
    this.rainAmt = approach(this.rainAmt, targetRain, dt * 0.6);
    this.flash = Math.max(0, this.flash - dt * 2.2);

    // ambient thunder flashes during a storm
    if (this.state === 'storm') {
      this.thunderTimer -= dt;
      if (this.thunderTimer <= 0) {
        this.thunderTimer = this.rng.range(4, 10);
        this.flash = this.rng.range(0.5, 0.9);
        game.audio.play('explode');
      }
      this._lightning(dt, game);
    } else if (this.strike) {
      this.strike = null;
    }

    // age the struck-bolt visual every frame, so it never freezes on-screen
    // when the storm ends within its brief lifetime
    if (this._boltAt) { this._boltAt.t -= dt; if (this._boltAt.t <= 0) this._boltAt = null; }
  }

  _lightning(dt, game) {
    const p = game.player;
    if (this.strike) {
      this.strike.t -= dt;
      // cancel if the player stopped holding metal or became untargetable
      // (awakened Link is untargetable, matching the scheduling guard below)
      if (!this._metal(p) || p.state === 'glide' || !p.alive || p.awaken > 0) { this.strike = null; return; }
      this.strike.x = p.x; this.strike.y = p.y;
      if (this.strike.t <= 0) {
        this.flash = 1;
        game.audio.play('explode');
        game.explode(p.x, p.y, 30, 0); // visual shock, no rock breaking damage
        game.particles.burst(p.x, p.y - 4, '#bfe0ff', 22);
        if (p.alive) p.damage(2, 0, -1, game); // a real jolt
        game.addLight(p.x, p.y - 20, 160, [180, 220, 255], 0.4);
        game.shake(9);
        this._boltAt = { x: p.x, y: p.y, t: 0.25 };
        this.strike = null;
      }
    } else {
      this.strikeTimer -= dt;
      if (this.strikeTimer <= 0) {
        this.strikeTimer = this.rng.range(9, 18);
        if (this._metal(p) && p.alive && p.state !== 'glide' && p.awaken <= 0) {
          this.strike = { t: 1.3, x: p.x, y: p.y };
          game.toast('⚡ Lightning is drawn to your metal weapon!');
        }
      }
    }
  }

  _metal(p) {
    const w = p.weapon;
    return w && (w.type === 'sword' || w.type === 'claymore' || w.type === 'spear');
  }

  // Drawn in screen space, after lighting.
  render(ctx, game) {
    const W = game.W, H = game.H;
    const coldHere = game.world.tileInfoAtWorld(game.player.x, game.player.y).cold;

    // rain
    if (this.rainAmt > 0.02 && !coldHere) {
      const n = Math.floor(this.rainAmt * 260);
      if (this.drops.length < n) for (let i = this.drops.length; i < n; i++) this.drops.push({ x: Math.random() * (W + 60) - 30, y: Math.random() * H, v: rand(560, 820), len: rand(9, 18) });
      this.drops.length = n;
      ctx.strokeStyle = `rgba(170,195,225,${0.35 + this.rainAmt * 0.25})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const d of this.drops) {
        d.y += d.v * 0.016; d.x += 2.2;
        if (d.y > H) { d.y = -10; d.x = Math.random() * (W + 60) - 30; }
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y + d.len);
      }
      ctx.stroke();
    } else if (this.drops.length && coldHere) {
      this.drops.length = 0;
    }

    // biome snow (independent of weather state)
    if (coldHere) {
      const target = 70;
      if (this.snow.length < target) for (let i = this.snow.length; i < target; i++) this.snow.push({ x: Math.random() * W, y: Math.random() * H, s: rand(0.6, 1.8), v: rand(16, 40) });
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (const f of this.snow) {
        f.y += f.v * 0.016; f.x += Math.sin((f.y + f.x) * 0.02) * 0.5;
        if (f.y > H) { f.y = -4; f.x = Math.random() * W; }
        ctx.fillRect(f.x, f.y, f.s, f.s);
      }
    } else if (this.snow.length) this.snow.length = 0;

    // fog
    if (this.state === 'fog' && this.blend > 0) {
      const a = 0.28 * this.blend;
      ctx.fillStyle = `rgba(200,206,214,${a})`;
      ctx.fillRect(0, 0, W, H);
    }

    // pending-strike telegraph on the player
    if (this.strike) {
      const z = game.zoom, view = game.view;
      const sx = (this.strike.x - view.x) * z, sy = (this.strike.y - view.y) * z;
      const k = 1 - this.strike.t / 1.3;
      ctx.strokeStyle = `rgba(180,220,255,${0.5 + Math.sin(game._time * 30) * 0.4})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy - 10 * z, (26 - k * 18) * z, 0, TAU); ctx.stroke();
    }
    // the bolt itself
    if (this._boltAt && this._boltAt.t > 0) {
      const z = game.zoom, view = game.view;
      const sx = (this._boltAt.x - view.x) * z, sy = (this._boltAt.y - view.y) * z;
      ctx.strokeStyle = 'rgba(220,240,255,0.95)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx, 0);
      let y = 0;
      while (y < sy) { y += H * 0.12; ctx.lineTo(sx + rand(-18, 18), Math.min(y, sy)); }
      ctx.stroke();
    }

    // lightning flash
    if (this.flash > 0.01) {
      ctx.fillStyle = `rgba(220,235,255,${this.flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}


/* ===== js/systems/ambient.js ===== */
'use strict';
/* ambient.js — living-world touches: butterflies by day, fireflies by night
   (glowing in the dark), and animated shimmer on water. Purely decorative. */

class Ambient {
  constructor() {
    this.critters = [];
    this.n = 26;
  }

  _spawn(game, near) {
    const view = game.view;
    const m = 40;
    return {
      x: near ? near.x : view.x + Math.random() * view.w,
      y: near ? near.y : view.y + Math.random() * view.h,
      vx: rand(-14, 14), vy: rand(-10, 10),
      ph: Math.random() * TAU, hue: Math.floor(rand(0, 5)),
      blink: Math.random() * TAU,
    };
  }

  update(dt, game) {
    const view = game.view;
    if (this.critters.length < this.n) for (let i = this.critters.length; i < this.n; i++) this.critters.push(this._spawn(game));
    for (const c of this.critters) {
      c.ph += dt * 3; c.blink += dt * 2;
      c.vx += Math.sin(c.ph) * 6 * dt; c.vy += Math.cos(c.ph * 0.7) * 5 * dt;
      c.vx = clamp(c.vx, -22, 22); c.vy = clamp(c.vy, -18, 18);
      c.x += c.vx * dt; c.y += c.vy * dt;
      // recycle when it drifts off the padded view
      if (c.x < view.x - 60 || c.x > view.x + view.w + 60 || c.y < view.y - 60 || c.y > view.y + view.h + 60) {
        const s = this._spawn(game);
        c.x = s.x; c.y = s.y; c.vx = s.vx; c.vy = s.vy;
      }
    }
  }

  // butterflies in world space (drawn with the world transform, daytime)
  drawDay(ctx, game) {
    if (game.dayNight.night > 0.55) return;
    const cols = ['#e46b9a', '#e8d24a', '#7aa6e8', '#f0864a', '#9a6be4'];
    for (const c of this.critters) {
      const t = game.world.tileInfoAtWorld(c.x, c.y);
      if (t.deep || t.solid) continue;
      const flap = Math.abs(Math.sin(c.ph * 4));
      ctx.fillStyle = cols[c.hue];
      const w = 1.4 + flap * 2.2;
      ctx.beginPath(); ctx.ellipse(c.x - w, c.y, w, 2.4, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x + w, c.y, w, 2.4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2a2320'; ctx.fillRect(c.x - 0.5, c.y - 1.5, 1, 3);
    }
  }

  // fireflies in screen space (additive, after lighting so they glow at night)
  drawGlow(ctx, game) {
    if (game.dayNight.night < 0.45) return;
    const z = game.zoom, view = game.view;
    ctx.globalCompositeOperation = 'lighter';
    for (const c of this.critters) {
      const t = game.world.tileInfoAtWorld(c.x, c.y);
      if (t.deep) continue;
      const b = 0.4 + Math.sin(c.blink) * 0.5;
      if (b <= 0.05) continue;
      const sx = (c.x - view.x) * z, sy = (c.y - view.y) * z;
      const r = 7 * z;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, `rgba(200,255,150,${b})`);
      g.addColorStop(1, 'rgba(160,255,120,0)');
      ctx.fillStyle = g; ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // shimmering highlights on visible water (world space, after terrain)
  drawWater(ctx, game) {
    const view = game.view, t = game._time;
    const tx0 = Math.floor(view.x / TILE), tx1 = Math.floor((view.x + view.w) / TILE);
    const ty0 = Math.floor(view.y / TILE), ty1 = Math.floor((view.y + view.h) / TILE);
    ctx.strokeStyle = 'rgba(220,240,255,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let ty = ty0; ty <= ty1; ty += 2) {
      for (let tx = tx0; tx <= tx1; tx += 2) {
        const info = TILES[game.world.tileIdAt(tx, ty)];
        if (!info || (!info.deep && !info.shallow)) continue;
        const wob = Math.sin(t * 2 + tx * 0.7 + ty * 1.3);
        if (wob < 0.4) continue;
        const x = tx * TILE + 3 + wob * 3, y = ty * TILE + 8 + Math.sin(t + tx) * 2;
        ctx.moveTo(x, y); ctx.lineTo(x + 5, y);
      }
    }
    ctx.stroke();
  }
}


/* ===== js/ui/hud.js ===== */
'use strict';
/* hud.js — heads-up display drawn in screen space: hearts, stamina wheel,
   equipped weapon + durability, ammo, rupees, koroks, clock, temperature,
   interaction prompt and toast messages. */

class HUD {
  constructor(game) { this.game = game; }

  draw(ctx, W, H) {
    const g = this.game, p = g.player;
    ctx.save();
    ctx.textBaseline = 'alphabetic';

    const touch = g.touch && g.touch.enabled;
    this._hearts(ctx, p, 16, 16);
    this._stamina(ctx, p, W, H);
    this._topRight(ctx, g, p, W);
    // On touch the bottom corners belong to the joystick/buttons, so move the
    // weapon panel up under the hearts.
    const wY = touch ? (16 + Math.ceil(p.maxHearts / 10) * 17 + 30) : (H - 58);
    this._weapon(ctx, g, p, 14, wY);
    this._temperature(ctx, g, p, W, H);
    this._awaken(ctx, g, p, W, H, touch);
    this._combo(ctx, g, W, H);
    this._prompt(ctx, g, W, H);
    this._toasts(ctx, g, W, H);
    this._bloodMoon(ctx, g, W, H);
    if (g.boss) this._boss(ctx, g, W);

    ctx.restore();
  }

  // Vertical "power" gauge on the left edge — fills as you fight; press R to Awaken.
  _awaken(ctx, g, p, W, H, touch) {
    const bh = 150, bx = 16, by = H / 2 - bh / 2;
    const full = p.awaken <= 0 && p.awakenMeter >= 1;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(ctx, bx, by, 12, bh, 6); ctx.fill();
    const frac = p.awaken > 0 ? clamp(p.awaken / 12, 0, 1) : clamp(p.awakenMeter, 0, 1);
    const fh = bh * frac;
    const grad = ctx.createLinearGradient(0, by + bh, 0, by);
    if (p.awaken > 0) { grad.addColorStop(0, '#ffd23a'); grad.addColorStop(1, '#fff2b0'); }
    else { grad.addColorStop(0, '#c88a2a'); grad.addColorStop(1, '#ffd23a'); }
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by + bh - fh, 12, fh, 6); ctx.fill();
    if (full || p.awaken > 0) {
      const pulse = 0.5 + Math.sin(g._time * 8) * 0.5;
      ctx.strokeStyle = `rgba(255,230,120,${0.4 + pulse * 0.5})`; ctx.lineWidth = 2;
      roundRect(ctx, bx - 1, by - 1, 14, bh + 2, 7); ctx.stroke();
    }
    ctx.save();
    ctx.translate(bx + 6, by - 8); ctx.textAlign = 'center';
    ctx.fillStyle = p.awaken > 0 ? '#fff2b0' : (full ? '#ffe27a' : '#9a8a6a');
    ctx.font = 'bold 10px monospace';
    ctx.fillText(p.awaken > 0 ? 'SSJ' : 'KI', 0, 0);
    ctx.restore();
    if (full && !touch) {
